human_reason_map:
- reason: canonical renderer migration; semantic IR unchanged
  count: 136
  check_id: non_canonical_render
- reason: Canonical re-rendering under the current grammar; parse and compose preserve the exact intermediate
    representation.
  count: 13
  check_id: non_canonical_render
- reason: 'DD-shaped x2 axis label removed from the grammar: the second local tangential direction completes
    the right-handed object-local triad (e2 = e3 x e1; e3 = plasma-facing normal, e1 = more-horizontal
    tangent toward positive toroidal angle). Descriptive carrier replaces the DD label per the locked
    local-frame design.'
  count: 12
  check_id: non_canonical_render
- reason: canonical renderer migration for a non-canonical drafted successor
  count: 12
  check_id: non_canonical_render
- reason: 'DD-shaped x1 axis label removed from the grammar: the first local tangential direction is the
    more-horizontal in-plane tangent oriented toward positive toroidal angle (e1 of the object-local frame;
    e3 = plasma-facing normal, e2 = e3 x e1). Descriptive carrier replaces the DD label per the locked
    local-frame design.'
  count: 10
  check_id: non_canonical_render
- reason: Use the DD-authoritative toroidal flux coordinate term.
  count: 6
  check_id: non_canonical_segment_order
- reason: Use canonical component and normalization order.
  count: 4
  check_id: non_canonical_segment_order
- reason: 'State-outside-subject canonical ordering (lead decision 2026-07-17, ISN 3cd15f5): state qualifiers
    bind outside the subject; the saturation state applies to the ion current, so ''saturated'' renders
    before ''ion''. Grammar now rejects the state-after-subject form.'
  count: 3
  check_id: non_canonical_segment_order
- reason: Use canonical grammar segment order.
  count: 3
  check_id: non_canonical_segment_order
- reason: The Data Dictionary defines this profile in terms of the toroidal flux coordinate; radius is
    not an approved catalog term.
  count: 3
  check_id: non_canonical_segment_order
- reason: The live plan authorizes the canonical locus spelling or owner-specific composition for this
    exact owner-geometry identity; a generic angular identity does not retain the named owner or position
    semantics.
  count: 3
  check_id: ambiguity_in_isolation
- reason: The description defines the locus as the surface minimizing the safety-factor magnitude; minimum_absolute_safety_factor
    is the registered position token for that same locus.
  count: 3
  check_id: non_canonical_locus_token
- reason: DD summary/global_quantities/power_loss is 'Total power loss through the plasma separatrix (P_sep)',
    units W — a scalar power, not a flux-surface-normal surface-integrated energy flux. The current name
    encodes a derivation rather than the quantity.
  count: 2
  check_id: unit_kind_inconsistent
- reason: gm2 (DD unit m^-2), gm3 and gm7 (both dimensionless) are flux-surface averages of grad_rho^2/R^2,
    grad_rho^2 and grad_rho respectively, per the DD text for those exact paths. All three sit on one
    name that carries BOTH a dimensionless and an m^-2 unit edge — the only standard name in the graph
    with two units, a direct symptom of the collapse. The average of a gradient and the average of its
    square are different quantities.
  count: 2
  check_id: collapsed_two_quantities
- reason: A camera image up-vector component is a dimensionless direction cosine, but this name has collected
    five DD paths whose declared unit is metre and whose DD text reads 'Height' or is a strike-point coordinate.
    A vertical position and an orientation-vector component are different quantities and cannot share
    a name; the unit contradiction is the symptom.
  count: 2
  check_id: collapsed_two_quantities
- reason: The pinned grammar now requires an explicit section plane on cross-sectional identities, so
    the prior spelling no longer parses; poloidal_plane names the sectioning plane and keeps the swept
    toroidal surface area a distinct quantity.
  count: 2
  check_id: missing_required_segment
- reason: unit s^-1, no m^-2 area factor; global particle removal rate at the wall due to pumping, not
    a spatial flux through a surface. 'rate' is the correct registered ISN base.
  count: 2
  check_id: unit_kind_inconsistent
- reason: 'DD source drift — the anchoring Data Dictionary path changed (path renamed: ''thomson_scattering/channel/line_of_sight/first_point/z''
    → ''ic_antennas/antenna/module/pressure/position/z''). Refresh this name''s documentation to reflect
    the corrected source; preserve the established intent and family phrasing. This is a targeted source-refresh,
    not a rewrite.'
