# JT-60SA - Japan Torus 60 Super Advanced
#
# Public facility configuration for graph and mappings.
# Infrastructure data is in jt-60sa_private.yaml (gitignored).

facility: jt-60sa
name: JT-60SA
machine: JT-60SA
description: Japan Torus 60 Super Advanced - Satellite tokamak facility
location: Naka, Japan

# SSH connection (user configures ~/.ssh/config with this alias)
ssh_host: jt-60sa

# Lower the priority of codex SSH workloads on shared JT-60SA hosts.
nice_level: 19

# Host-wide remote environment: the interpreter and shell setup every remote
# script on this host needs before it runs. The login shell pre-loads
# python/3.5.6, which cannot run the remote scripts; the recipe unloads it,
# loads python/3.12, and calls that module's own `python` binary (the system
# /usr/bin/python3 stays 3.9, and `module purge` drops the module path).
# eddb_pwrapper is not installed into the interpreter's environment, so its
# entry carries the source directory added to sys.path before the import.
remote_environment:
  python_command: python
  setup_commands:
    - module unload python/3.5.6
    - module load python/3.12
  min_python_version: "3.12"
  required_modules:
    - name: numpy
    - name: eddb_pwrapper
      path: /analysis/src/eddb

# Data system configuration for signal discovery
# Used by: imas-codex discover signals jt-60sa
data_systems:
  # EDAS is JT-60SA's primary experiment data access system.
  # Wraps proprietary data formats with C/Fortran/Python APIs.
  # The interpreter and module recipe comes from the facility
  # remote_environment block above.
  edas:
    databases: [EDDB, UDDB, PMDB, LCDB, MBDB, EQDB]
    api_path: /analysis/src/eddb
    lib_path: /analysis/lib/libeddb.so
    uddb_api_path: /analysis/src/uddb
    uddb_lib_path: /analysis/lib/libuddb.so
    pmdb_api_path: /analysis/src/pmdb
    pmdb_lib_path: /analysis/lib/libpmdb.so
    lcdb_api_path: /analysis/src/lcdbWrapper
    lcdb_root: /analysis_DB/EDASDB
    mbdb_api_path: /analysis/src/mbdb
    mbdb_lib_path: /analysis/lib/libmbdb.so
    mbdb_root: /analysis_DB/MBDB
    header_path: /analysis/src/edas/include
    # Newest E-shot the catalogue listed on 2026-10-05; valid data starts at
    # E080000 and the scanner formats an integer as E%06d.
    reference_shot: 101173
    equilibrium_examples:
      - code: SELENE
        format: selene_eq31
        root: /home/a114004/LOCALDB/EQDSK
        path: /home/a114004/LOCALDB/EQDSK/10/1011/101163/005000
        shot: 101163
        time: 5.0
        grid: [129, 129]
        sha256: c1b975f893e91c49283115655edf7254dbfcadab8e8347b1cdc144edb4f32089
      - code: TOPICS
        format: eq11
        root: /home/a048717/LOCALDB/EQDSK
        path: /home/a048717/LOCALDB/EQDSK/08/0802/080296/05000
        shot: 80296
        time: 5.0
        grid: [129, 129]
        sha256: d3b04dbe821272bab294b27580f297b214cfb35f630bd0d725702bdc13ffd168
      - code: SA
        format: g_eqdsk
        root: /home/d200024/LOCALDB
        filename_template: "EQDSK_E{shot:06d}t{time:g}_COCOS02"
        path: /home/d200024/LOCALDB/EQDSK_E101011t6.8_COCOS02
        shot: 101011
        time: 6.8
        grid: [129, 129]
        cocos: 2
        sha256: f71d3cb1009e657e841b6d7be22f694921dc9b937278f7a2d4f65ead9c52e1e7
      - code: LIUQE
        inventory_code: LIUQE/MEQ
        format: g_eqdsk
        root: /home/d260047/olivier/equil_runs
        filename_template: "EQDSK_E{shot:06d}t{time:g}_COCOS07"
        path: /home/d260047/olivier/equil_runs/EQDSK_E101011t6.8_COCOS07
        shot: 101011
        time: 6.8
        grid: [60, 129]
        cocos: 7
        sha256: f385641ad9740ed00698cbc03c8329a99577b36c948227bb6543e5888c86cd10
      - code: CHEASE
        format: g_eqdsk
        root: /home/d240036/equil_runs
        filename_template: "EQDSK_COCOS_17.OUT_E{shot:06d}t{time:.2f}"
        path: /home/d240036/equil_runs/EQDSK_COCOS_17.OUT_E101025t5.90
        shot: 101025
        time: 5.9
        grid: [129, 128]
        cocos: 17
        sha256: 962ec0d7b3c5ac22323f16aec8087ac6c01d13bc08bcb463787afb34573c1272

  # IMAS data available via modules
  imas:
    backends:
      - mdsplus
    db_name: jt-60sa

excludes:
  path_prefixes:
    - /tmp
    - /var/tmp
    - /work/edas
  patterns:
    - '*.avi'
    - '*.dat.old'
    - '*.backup'

# Data access patterns discovered during facility exploration.
data_access_patterns:
  primary_method: edas
  shot_identifier: shot
  signal_naming: >-
    EDAS EDDB API: EDDB_locallib_API with methods opendb(dbtype), closedb(),
    get_time_nearest(shot, t, dname, cat), get_time_slice_data(shot, t, dname, cat),
    get_time_seriese_data(shot, t1, t2, dname, cat).
    Low-level: _eddbreadTime(shot, cat, dname, t1, t2), _eddbreadHeader(shot, cat, dname),
    _eddbreadOne(shot, cat, dname, step), _eddbreadPara(shot, cat, dname).
    Also: _eddbreadPrePro, _eddbreadImage, _eddbreadComment, _eddbreadScore,
    _eddbreadChInfo, _eddbreadTable, _eddbreadShot, _eddbreadNearTime.
    EDDB_remote_API mirrors local API for remote access.
    Higher-level tools: eGIS (graphical viewer), eSLICE (time slicer),
    eSURF (surface viewer) wrap EDAS channels.
  tree_organization: >-
    EDAS database at /analysis_DB/EDASDB/ with per-shot directories (a003846, etc.).
    8 database API modules: edas_eddb_api (main), edas_easy_api (simplified),
    edas_fledd_api (FLEDD), edas_fsmd_api (FSMD), edas_lcdb_api (LCDB),
    edas_mbdb_api (MBDB), edas_pmdb_api (PMDB), edas_uddb_api (UDDB).
    AnalysisDB for processed results, ExperimentDB for raw measurements.
    Multiple database backends: EDDB, FLEDD, FSMD, LCDB, MBDB, PMDB, UDDB.
  key_tools:
    - edas_eddb_api
    - edas_easy_api
    - EDDB_locallib_API
    - EDDB_remote_API
    - eslice
    - esurf
    - egis
    - getseldata
    - FBEQU
    - SAEQU
    - TOPICS2
  wiki_signal_patterns:
    - EDAS channel ID tables
    - diagnostic parameter listings
    - Eddb API reference
    - EDAS database category (cat) listings
    - getseldata parameter documentation
    - eslice/esurf viewer documentation
  code_import_patterns:
    - import edas_eddb_api
    - import edas_easy_api
    - EDDB_locallib_API
    - EDDB_remote_API
    - eddb_get
    - eddbreadTime
    - eddbreadHeader
    - get_time_slice_data
    - get_time_nearest
    - opendb(
    - closedb(
    - import eddb
    - eslice
    - esurf
    - getseldata
  notes:
    - "EDAS2 v2.1.15 at /analysis/src/edas2/v2.1.15/ with edas_egis, edas_eslice2, edas_esurf2, edas_share"
    - "8 database API modules at edas_share/database_api/: eddb, easy, fledd, fsmd, lcdb, mbdb, pmdb, uddb"
    - "EDDB_locallib_API class: 25+ methods including opendb, closedb, get_time_nearest, get_time_slice_data"
    - "Low-level read methods: _eddbreadTime(shot,cat,dname,t1,t2), _eddbreadHeader(shot,cat,dname), _eddbreadOne, _eddbreadPara"
    - "EDASDB at /analysis_DB/EDASDB/ with shot directories (a003846, a003915, etc.)"
    - "Tools at /analysis/bin/: eslice, esurf, egis, getseldata, FBEQU, SAEQU, TOPICS2"
    - "C headers at /analysis/src/getseldata_v4.2/eddbaccess.h"
    - "IMAS/3.42.0, MDSplus/7.132.0, UDA/2.7.5-2.7.6 modules available"
    - "import imas works after module load (DD 3.42.0)"

# Discovery root paths for path discovery pipeline
# These are seeded as starting points for directory scanning
discovery_roots:
  # /analysis/src is named only through its seeded subdirectories: a seed of
  # the parent itself creates a depth-0 row that walks every unseeded child.
  - /analysis/src/SAselene_v2.0_forPSRC
  - /analysis/src/SAeqread
  - /analysis/src/edas2
  - /analysis/src/ECCD
  - /analysis/src/OFMC/ofmcauto
  - /analysis/src/topics_release
  - /analysis/src/easy-v5.01
  - /analysis/src/eagle-v4.05
  - /analysis/src/client_eqdbms.EQ32.Rev1
  - /analysis/src/SAeqfame
  - /analysis/src/getseldata_v4.2
  - /analysis/bin                  # Analysis binaries and scripts
  - /analysis/data                 # Analysis data outputs
  - /analysis/manual               # Documentation
  - /work/edas                     # EDAS work area
  - /analysis_DB/EDASDB            # EDAS database
  - /analysis_DB/MBDB              # MB database
  # Data-access layer: the experiment-database download libraries and wrappers
  # every diagnostic loader goes through, the reconstruction and machine
  # description trees, and the analysis/data tools. Each is its own entry; the
  # parent /analysis/src is never named.
  - /analysis/src/eddb
  - /analysis/src/uddb
  - /analysis/src/pmdb
  - /analysis/src/mbdb
  - /analysis/src/lcdbWrapper
  - /analysis/src/safledd
  - /analysis/src/edas_inf
  - /analysis/lib/JT60SAEQDB
  - /analysis/src/MagLine2022
  - /analysis/src/offlineTCCS
  - /analysis/src/offlineTCCS.MAIN
  - /analysis/src/SAsetequ
  - /analysis/src/setequ
  - /analysis/src/SAselene
  - /analysis/CCStable
  - /analysis/SAdata
  - /analysis/src/slice
  - /analysis/src/adam3
  - /analysis/src/adamwin-v4
  - /analysis/src/OFMC
  - /analysis/src/accome
  - /analysis/src/toolc
  - /analysis/src/gdlib
  - /analysis/src/getseldata_v4.1

# Wiki/documentation sites
# JT-60SA documentation is hosted on nakasvr23 behind IFERC VPN.
# Site 0: Live TWiki Main web - EDAS manuals, API docs, shot reports, daily reports (~5500 topics)
# Site 1: TWiki static export - analysis code documentation (Code web, ~285 topics)
# Site 2: Server landing page - hardware, software, login, batch jobs, compilers
#
# Access: Use browser URLs from port_forwards section when tunnels are active.
# Original URLs retained for documentation and direct VPN access.
wiki_sites:
  - name: twiki_main
    url: http://157.111.10.188/twiki
    site_type: twiki_raw
    data_path: /var/www/html/twiki/data/Main
    pub_path: /var/www/html/twiki/pub/Main
    web_name: Main
    access_method: tunnel              # Use port forward (browser.services[twiki_main])
    auth_type: none
    ssh_available: true
    exclude_patterns:
      - "^OperationStatusReport"   # Very large reports (>1MB each), low value
      - "^DailyReport"             # Large daily reports, low signal density
      - "^ShotE\\d"                # Per-shot reports, repetitive
    description: >-
      JT-60SA Main TWiki web via live Apache/CGI. Contains EDAS tool manuals
      (eGIS, eSLICE, eSURF), Eddb API documentation (C/Fortran/Python wrappers),
      AnalysisDB and ExperimentDB system docs, discharge parameter handbook,
      daily reports, shot reports, and operational reports.
      ~5500 topics, ~130 artifacts. Pages discovered via WebTopicList API,
      artifacts via fd scanning pub/<web>/ on the filesystem.
    languages:
      - ja
      - en

  - name: twiki_code
    url: https://nakasvr23.iferc.org/twiki_html
    portal_page: WebHome.html
    site_type: twiki_static
    pub_path: /var/www/html/twiki_html/rsrc  # Artifact discovery via fd over SSH
    access_method: tunnel              # Use port forward (browser.services[twiki_code])
    auth_type: none
    ssh_available: true
    description: >-
      JT-60SA Code web - analysis code documentation (standalone archive,
      no Code web in live TWiki). Contains TOPICS, EDAS, SLICE, equilibrium
      codes, hardware specs. Static HTML export, ~285 pages, ~644 artifacts.
      Mixed Japanese/English content.
    languages:
      - ja
      - en

  - name: server_docs
    url: https://nakasvr23.iferc.org
    portal_page: index-en.html
    site_type: static_html
    access_method: tunnel              # Use port forward (browser.services[server_docs])
    auth_type: none
    ssh_available: true
    description: >-
      JT-60SA data analysis server (nakasvr23) system documentation.
      Hardware specs, software list, login procedures, batch job usage,
      compiler configuration, file system layout. Bilingual (JP/EN).
    languages:
      - ja
      - en
    exclude_prefixes:
      - /twiki_html      # Separate TWiki site
      - /matlab          # MATLAB vendor documentation
      - /idl             # IDL vendor documentation
      - /pv-wave         # PV-WAVE vendor documentation
      - /analysis        # Analysis tools help (external)

# User info discovery configuration
user_info:
  name_format: last_first  # Japanese order: family name first (e.g., マッキントッシュ サイモン)
  lookup_tools:
    - getent
    - passwd
    - id

# =============================================================================
# Port Forwards - Local SSH tunnels for service access
# =============================================================================
# JT-60SA services are behind IFERC VPN. Access from workstation requires:
# 1. VPN active (OpenVPN to iferc.org)
# 2. SSH tunnels via autossh systemd service (jt-60sa-twiki-forward.service)
#
# Port convention: base 88xx for jt-60sa, last digit = wiki site index
# wiki_sites[0] -> port 8800, wiki_sites[1] -> port 8801, etc.
#
# These forwards terminate on the workstation only. JT-60SA services are never
# exposed toward ITER: no connection between JT-60SA and ITER is permitted, so
# JT-60SA discovery runs from the workstation, not from ITER workers.

port_forwards:
  port_base: 8800
  ssh_host: jt-60sa  # SSH to jt-60sa, then LocalForward to wiki servers
  forwards:
    - name: twiki_main
      local_port: 8800
      remote_host: 157.111.10.188
      remote_port: 80
      protocol: http
      description: JT-60SA Main TWiki web (live Apache/CGI, ~5500 topics)

    - name: twiki_code
      local_port: 8801
      remote_host: nakasvr23.iferc.org
      remote_port: 443
      protocol: https
      description: JT-60SA Code web static export (~285 pages)

    - name: server_docs
      local_port: 8802
      remote_host: nakasvr23.iferc.org
      remote_port: 443
      protocol: https
      description: nakasvr23 server documentation (hardware, software, login)

# =============================================================================
# Browser URLs - Localhost access with active port forwards
# =============================================================================
# These URLs work when the jt-60sa-twiki-forward.service is running.
# Workstation-only: there is no path from ITER workers to these services.

browser:
  services:
    - name: twiki_main
      url: http://localhost:8800/twiki
      description: Main TWiki web - EDAS manuals, API docs, shot reports

    - name: twiki_code
      url: https://localhost:8801/twiki_html
      description: Code web static - TOPICS, equilibrium codes, hardware specs

    - name: server_docs
      url: https://localhost:8802/
      description: Server documentation - login, batch jobs, compilers
