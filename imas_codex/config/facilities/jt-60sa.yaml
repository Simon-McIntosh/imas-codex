  # IMAS data available via modules
  imas:
    backends:
      - mdsplus
    db_name: jt-60sa

excludes:
  path_prefixes:
    - /tmp
    - /var/tmp
    - /work/edas
  patterns:
    - '*.avi'
    - '*.dat.old'
    - '*.backup'

# Per-source-group rules for reading a singleton array's member identifier out
# of its name. The MMSYS coil currents carry the member in the middle of the
# name, followed by the acquisition chain (HiTe, LKAT, TFLKAT), so the member is
# the text before that chain: curEF5LKAT -> EF5, curCS1HiTe -> CS1,
# curUFPLKAT -> UFP, cur1TFLKAT -> 1.
signal_member_patterns:
  MMSYS: '^cur(?P<member>.+?)(?:TFLKAT|LKAT|HiTe)$'

signal_glossary:
  - term: UFP
    meaning: upper fast plasma position control coil (FPPCC)
  - term: LFP
    meaning: lower fast plasma position control coil (FPPCC)
  - term: HiTe
    meaning: HiTe/HiTec acquisition chain measuring the same coil current as LKAT/LKAT2
  - term: LKAT
    meaning: LKAT/LKAT2 acquisition chain measuring the same coil current as HiTe/HiTec

# Data access patterns discovered during facility exploration.
data_access_patterns:
  primary_method: edas
  shot_identifier: shot
  signal_naming: >-
    EDAS EDDB API: EDDB_locallib_API with methods opendb(dbtype), closedb(),
    get_time_nearest(shot, t, dname, cat), get_time_slice_data(shot, t, dname, cat),
    get_time_seriese_data(shot, t1, t2, dname, cat).
    Low-level: _eddbreadTime(shot, cat, dname, t1, t2), _eddbreadHeader(shot, cat, dname),
    _eddbreadOne(shot, cat, dname, step), _eddbreadPara(shot, cat, dname).
    Also: _eddbreadPrePro, _eddbreadImage, _eddbreadComment, _eddbreadScore,
    _eddbreadChInfo, _eddbreadTable, _eddbreadShot, _eddbreadNearTime.
    EDDB_remote_API mirrors local API for remote access.
    UDDB identifies globally registered raw channels by PID; LCDB identifies
    an owner, category revision and field within a shot. PMDB needs a plant
    category and name plus wall-clock interval; FSMD needs PID, track and channel;
    MBDB needs owner, case and category. FLEDD selects equilibria by database id,
    shot and time revision; local EQDB records use shot/time paths under EQDSK.
    Higher-level tools: eGIS (graphical viewer), eSLICE (time slicer),
    eSURF (surface viewer) wrap EDAS channels.
  tree_organization: >-
    EDAS database at /analysis_DB/EDASDB/ with per-shot directories (a003846, etc.).
    8 database API modules: edas_eddb_api (main), edas_easy_api (simplified),
    edas_fledd_api (FLEDD), edas_fsmd_api (FSMD), edas_lcdb_api (LCDB),
    edas_mbdb_api (MBDB), edas_pmdb_api (PMDB), edas_uddb_api (UDDB).
    AnalysisDB for processed results, ExperimentDB for raw measurements.
    Multiple database backends: EDDB, FLEDD, FSMD, LCDB, MBDB, PMDB, UDDB.
  key_tools:
    - edas_eddb_api
    - edas_easy_api
    - EDDB_locallib_API
    - EDDB_remote_API
    - libFLEDDPIC
    - eqdbms
    - dbsel
    - eddbreadOne
    - eddbreadPara
    - get_time_seriese_data
    - uddbreadTable
    - uddbreadConvert
    - plantdread
    - planthread
    - get_fsmd_from_db
    - esyserd2
    - lcdb_dname
    - lcdb_value
    - mbdbDatanmList
    - mbdbRPoint
    - mbdbRTimes
    - eslice
    - esurf
    - egis
    - getseldata
    - FBEQU
    - SAEQU
    - TOPICS2
  wiki_signal_patterns:
    - EDAS channel ID tables
    - diagnostic parameter listings
    - Eddb API reference
    - EDAS database category (cat) listings
    - getseldata parameter documentation
    - eslice/esurf viewer documentation
  code_import_patterns:
    - import edas_eddb_api
    - import edas_easy_api
    - EDDB_locallib_API
    - EDDB_remote_API
    - eddb_get
    - eddbreadTime
    - eddbreadHeader
    - eddbreadOne
    - eddbreadPara
    - get_time_slice_data
    - get_time_seriese_data
    - get_time_nearest
    - opendb(
    - closedb(
    - import eddb
    - eslice
    - esurf
    - getseldata
    - libFLEDDPIC
    - eqlist_get_rev_
    - eqdata_get_
    - eqint_get_
    - eqdbl_get_
    - eqdbms
    - dbsel
    - uddbreadTable
    - uddbreadConvert
    - plantdread
    - planthread
    - get_fsmd_from_db
    - esyserd2
    - lcdb_dname
    - lcdb_value
    - mbdbDatanmList
    - mbdbRPoint
    - mbdbRTimes
  notes:
    - "EDAS2 v2.1.15 at /analysis/src/edas2/v2.1.15/ with edas_egis, edas_eslice2, edas_esurf2, edas_share"
    - "8 database API modules at edas_share/database_api/: eddb, easy, fledd, fsmd, lcdb, mbdb, pmdb, uddb"
    - "EDDB_locallib_API class: 25+ methods including opendb, closedb, get_time_nearest, get_time_slice_data"
    - "Low-level read methods: _eddbreadTime(shot,cat,dname,t1,t2), _eddbreadHeader(shot,cat,dname), _eddbreadOne, _eddbreadPara"
    - "EDASDB at /analysis_DB/EDASDB/ with shot directories (a003846, a003915, etc.)"
    - "Tools at /analysis/bin/: eslice, esurf, egis, getseldata, FBEQU, SAEQU, TOPICS2"
    - "C headers at /analysis/src/getseldata_v4.2/eddbaccess.h"
    - "IMAS/3.42.0, MDSplus/7.132.0, UDA/2.7.5-2.7.6 modules available"
    - "import imas works after module load (DD 3.42.0)"

# Discovery root paths for path discovery pipeline
# These are seeded as starting points for directory scanning
discovery_roots:
  # /analysis/src is named only through its seeded subdirectories: a seed of
  # the parent itself creates a depth-0 row that walks every unseeded child.
  - /analysis/src/SAselene_v2.0_forPSRC
  - /analysis/src/SAeqread
  - /analysis/src/edas2
  - /analysis/src/ECCD
  - /analysis/src/OFMC/ofmcauto
  - /analysis/src/topics_release
  - /analysis/src/easy-v5.01
  - /analysis/src/eagle-v4.05
  - /analysis/src/client_eqdbms.EQ32.Rev1
  - /analysis/src/SAeqfame
  - /analysis/src/getseldata_v4.2
  - /analysis/bin                  # Analysis binaries and scripts
  - /analysis/data                 # Analysis data outputs
  - /analysis/manual               # Documentation
  - /work/edas                     # EDAS work area
  - /analysis_DB/EDASDB            # EDAS database
  - /analysis_DB/MBDB              # MB database
  # Data-access layer: the experiment-database download libraries and wrappers
  # every diagnostic loader goes through, the reconstruction and machine
  # description trees, and the analysis/data tools. Each is its own entry; the
  # parent /analysis/src is never named.
  - /analysis/src/eddb
  - /analysis/src/uddb
  - /analysis/src/pmdb
  - /analysis/src/mbdb
  - /analysis/src/lcdbWrapper
  - /analysis/src/safledd
  - /analysis/src/edas_inf
  - /analysis/lib/JT60SAEQDB
  - /analysis/src/MagLine2022
  - /analysis/src/offlineTCCS
  - /analysis/src/offlineTCCS.MAIN
  - /analysis/src/SAsetequ
  - /analysis/src/setequ
  - /analysis/src/SAselene
  - /analysis/CCStable
  - /analysis/SAdata
  - /analysis/src/slice
  - /analysis/src/adam3
  - /analysis/src/adamwin-v4
  - /analysis/src/OFMC
  - /analysis/src/accome
  - /analysis/src/toolc
  - /analysis/src/gdlib
  - /analysis/src/getseldata_v4.1

# Wiki/documentation sites
# JT-60SA documentation is served on nakasvr26 through the workstation VPN.
# Site 0: Static Code wiki - analysis code documentation
# Site 1: Server landing page - hardware, software, login, batch jobs, compilers
# Direct viewing requires the IFERC VPN; port_forwards supplies local browser ports.
wiki_sites:
  - name: twiki_code
    url: https://nakasvr26.iferc.org/wiki
    portal_page: WebHome.html
    site_type: twiki_static
    access_method: tunnel
    auth_type: none
    ssh_available: true
    description: >-
      JT-60SA static Code wiki with analysis code documentation, EDAS, SLICE,
      equilibrium codes and linked attachments. Pages are listed by
      WebTopicList.html and attachments are linked from their topic pages.
    languages:
      - ja
      - en

  - name: server_docs
    url: https://nakasvr26.iferc.org
    portal_page: index-en.html
    site_type: static_html
    access_method: tunnel
    auth_type: none
    ssh_available: true
    description: >-
      JT-60SA data analysis server system documentation. Hardware specs,
      software list, login procedures, batch job usage, compiler configuration
      and file system layout. Bilingual (JP/EN).
    languages:
      - ja
      - en
    exclude_prefixes:
      - /wiki            # Separate Code wiki site
      - /matlab          # MATLAB vendor documentation
      - /idl             # IDL vendor documentation
      - /pv-wave         # PV-WAVE vendor documentation
      - /analysis        # Analysis tools help (external)

# User info discovery configuration
user_info:
  name_format: last_first  # Japanese order: family name first (e.g., マッキントッシュ サイモン)
  lookup_tools:
    - getent
    - passwd
    - id

# =============================================================================
# Port Forwards - Local SSH tunnels for service access
# =============================================================================
# Facility web traffic follows the jt-60sa SSH hop through the workstation VPN.
# The port suffix matches the wiki_sites index for browser access.

port_forwards:
  port_base: 8800
  ssh_host: jt-60sa
  forwards:
    - name: twiki_code
      local_port: 8800
      remote_host: nakasvr26.iferc.org
      remote_port: 443
      protocol: https
      description: JT-60SA static Code wiki

    - name: server_docs
      local_port: 8801
      remote_host: nakasvr26.iferc.org
      remote_port: 443
      protocol: https
      description: nakasvr26 server documentation (hardware, software, login)

# =============================================================================
# Browser URLs - Localhost access with active port forwards
# =============================================================================
# Direct over the IFERC VPN: https://nakasvr26.iferc.org/wiki/WebHome.html
# Local Code wiki tunnel: ssh -N -L 8800:nakasvr26.iferc.org:443 jt-60sa
# Forward port 8801 to the same host for server_docs. These localhost URLs
# are for workstation browsers with their corresponding SSH forwards running.

browser:
  services:
    - name: twiki_code
      url: https://localhost:8800/wiki/WebHome.html
      description: Code wiki - analysis code documentation and linked attachments

    - name: server_docs
      url: https://localhost:8801/
      description: Server documentation - login, batch jobs, compilers
