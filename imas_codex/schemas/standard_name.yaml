# Standard Names Schema
#
# Canonical physics quantity names for cross-facility semantic unification.
# StandardName bridges IMAS Data Dictionary paths and facility signals —
# it is neither DD-specific nor facility-specific, hence its own schema.
#
# Import chain:
#   common.yaml (provides Unit)
#     ↑
#   standard_name.yaml (this file)
#     ↑          ↑
#   imas_dd.yaml   facility.yaml
#
# Generated models: imas_codex/graph/models.py, imas_codex/graph/dd_models.py
# To regenerate: uv run build-models --force

id: https://imas.iter.org/schemas/standard_name
name: standard_name
title: IMAS Standard Names Schema
description: >-
  Canonical physics quantity names for cross-facility semantic unification.
  Links DD paths (IMASNode) and facility signals (FacilitySignal) to a
  shared vocabulary of physics concepts.

license: MIT
version: 0.9.0

prefixes:
  linkml: https://w3id.org/linkml/
  sn: https://imas.iter.org/schemas/standard_name/

default_prefix: sn
default_range: string

imports:
  - linkml:types
  - common
  - grammar_graph

# =============================================================================
# Enums
# =============================================================================

enums:
  StandardNameSourceType:
    description: Source type for standard name generation
    permissible_values:
      dd:
        description: Extracted from IMAS Data Dictionary
      signals:
        description: Extracted from facility signals
      derived:
        description: >-
          Auto-materialised structural parent scaffolding, sourced from child
          names by the derived-parent admission gate; NOT human-curated.
      reference:
        description: Seeded from ISN reference library
      catalog:
        description: >-
          Imported from the ISN catalog. Set on StandardName.source_types
          for names that originate from a catalog round-trip rather than
          pipeline extraction (see catalog_import.py).
      manual:
        description: >-
          Hand-authored origin with no deterministic upstream anchor. Assigned
          by the provenance rebuild to a live name that has no recoverable dd
          or derived source, so the ledger records an explicit, auditable
          origin rather than leaving the name orphaned — never a fabricated
          DD path.

  StandardNameSourceSnapshotClassification:
    description: >-
      Semantic relationship between one pinned DD source snapshot and the
      uniquely current DD authority that replaced it.
    permissible_values:
      byte_unchanged:
        description: >-
          Every DD-authoritative classification field is identical. The
          redundant operational description mirror is retained in the full
          ledger payload but does not independently make the change material.
      semantic_unchanged:
        description: >-
          DD-authoritative classification fields differ only by an explicitly
          governed semantic equivalence such as an equivalent unit spelling or
          registered DD unit correction.
      changed:
        description: At least one authoritative semantic field changed.

  StandardNameOrigin:
    description: >-
      Provenance of the most recent editorial edit to a StandardName.
      pipeline = generated/enriched by the codex LLM pipeline.
      catalog_edit = imported from a catalog PR that modified editorial
      fields. derived = structural parent node materialised by the
      admission gate (see imas_codex/standard_names/parents.py). Used
      by filter_protected() to guard catalog-owned content.
    permissible_values:
      pipeline:
        description: Generated or enriched by the codex LLM pipeline
      catalog_edit:
        description: Imported from a catalog PR with editorial changes
      derived:
        description: >-
          Structural parent node created by the admission gate when a
          composed child name has a parent that passes the admissibility
          (specificity / vector-topology) checks. Inadmissible parents are
          deleted by normalize_derived_parent_lifecycle at startup.

  VocabGapCategory:
    description: >-
      Classification of a VocabGap node.  Distinguishes true vocabulary
      absences from LLM slot-placement errors where the token exists in a
      different closed segment.
    permissible_values:
      absent:
        description: >-
          Token not found in any closed-vocabulary segment — a genuine
          ISN grammar gap that requires editorial action.
      wrong_slot_placement:
        description: >-
          Token exists in one or more closed segments but the LLM placed
          it in a segment that does not contain it.  Signals a prompt /
          model improvement need, not an ISN gap.
      ambiguous_known_token:
        description: >-
          Token exists in multiple closed segments and the reported
          segment is not among them.  May indicate either LLM confusion
          or legitimate vocabulary overlap requiring editorial review.
      decomposable:
        description: >-
          A compound token whose parts already exist as registered tokens in
          other segments — nameable by composition, not a genuine gap.  Assigned
          by reconcile_vocab_gaps when re-classifying against the current ISN
          vocabulary; persists on the node (unlike false_positive / open_segment
          / invalid_segment classifications, which reconcile deletes).
      rule_violation:
        description: >-
          The spelling is forbidden however the vocabulary grows: it indexes
          one ordinal sample of a repeated structure (first_point,
          rectangle_centre) or carries a bare DD coordinate-slot field name
          (x1, x2).  Guidance names the rule, not a missing token.
      reuse:
        description: >-
          A mechanical check derived the registered token this proposal
          spells (structural DD suffix, word-order permutation, or settled
          synonym) — reuse by construction, overriding any embedding
          adjudication.

  VocabGapDedupDecision:
    description: >-
      Outcome of the compose-time component-token reuse check for a VocabGap.
      The check embeds the proposed candidate-new token and compares it to its
      segment's registered vocabulary; a near-synonym hit triggers a chained
      compose retry that asks the agent to reuse-or-confirm.
    permissible_values:
      distinct_confirmed:
        description: >-
          The token was flagged as semantically near a registered same-segment
          token, the agent was re-prompted, and it RE-EMITTED the gap — the
          quantity is genuinely distinct on that segment's axis. A real
          new-vocab request; the ISN rotation need not re-litigate the synonym.
      reused:
        description: >-
          The token was flagged and the agent dropped it on the chained retry,
          reusing the registered token instead. Recorded for completeness;
          such gaps are normally not persisted (they no longer appear in the
          final vocab_gaps).
      unchecked:
        description: >-
          No reuse check fired for this gap (below threshold, the check was
          disabled, ISN/embeddings unavailable, or the gap was written on a
          path the check does not run). The default for un-adjudicated gaps.
      reuse_confirmed:
        description: >-
          A mechanical check (structural DD suffix, word-order permutation,
          settled synonym) derived the registered token this proposal spells.
          Supersedes any embedding adjudication on record — the target is
          derived, not scored. The registered token lives in reuse_target.
      checked_no_reuse:
        description: >-
          The offline nearest-neighbour measurement ran and recorded
          nearest_token / nearest_similarity, and no mechanical check
          resolved the token — the reuse question was asked and answered
          with a measurement rather than left unchecked.

  VocabGapDisposition:
    description: >-
      Editorial resolution of a vocabulary proposal. Observation categories
      describe what the composer reported; this independent field records what
      a reviewed vocabulary rotation decided to do.
    permissible_values:
      add:
        description: Add the approved token to the owning grammar vocabulary.
      fold:
        description: Express the proposal with registered grammar instead.
      reject:
        description: Do not add the proposal to grammar vocabulary.

  VocabGapTriage:
    description: >-
      Lifecycle bucket assigned by triage_vocab_gaps to every stored gap:
      derived from the mechanical reuse verdict, the reconciled category, and
      the last-seen stamp. One bucket per node; nothing is deleted.
    permissible_values:
      reuse:
        description: Mechanically resolved to a registered token.
      rule_violation:
        description: A construction the grammar already forbids.
      composable:
        description: >-
          Expressible from registered grammar (decomposable compounds,
          wrong-slot placements, ambiguous known tokens).
      retired_stale:
        description: >-
          Still absent but last proposed before the current-composer era and
          never reproduced — history, not demand.
      genuine:
        description: >-
          Absent and recently reproduced — the real vocabulary demand a
          rotation decision reads.
      add:
        description: Editorially approved for addition to the grammar.
      fold:
        description: Editorially resolved to a canonical registered expression.
      reject:
        description: Editorially rejected as grammar vocabulary.

  DDGapKind:
    description: >-
      What aspect of a Data Dictionary declaration is contradicted by the
      reported evidence.
    permissible_values:
      unit_defect:
        description: A path declares a physically incorrect unit.
      self_contradiction:
        description: >-
          Two DD facets of one quantity carry mutually incompatible
          declarations.
      doc_mismatch:
        description: Documentation contradicts the declared type, unit, or shape.
      type_wiring:
        description: A path is wired to the wrong field type or quantity family.
      missing_declaration:
        description: A physical quantity lacks a required declaration.
      rename_inconsistency:
        description: >-
          A cross-version rename left contradictory sibling declarations.

  DDGapStatus:
    description: >-
      Human-adjudicated lifecycle of a Data Dictionary defect report. A
      flagged report is evidence only and never changes pipeline behavior.
    permissible_values:
      flagged:
        description: Evidence has been reported and awaits human triage.
      triaged:
        description: A human has assessed the evidence but not dispositioned it.
      registered_exception:
        description: >-
          The defect is represented in an existing enforcement registry.
      upstream_issue:
        description: The defect has been filed against the Data Dictionary.
      rejected:
        description: The evidence was adjudicated not to be a DD defect.
      resolved_upstream:
        description: A published DD version corrected the defect.

  DDGapEvidenceRule:
    description: >-
      Machine-readable predicate asserted by one DD-gap observation. Only
      predicates with kind-specific release validators may be reconciled
      automatically; every other predicate remains manual evidence.
    permissible_values:
      unit_equals_expected:
        description: The raw published DD unit must equal expected_value.
      declaration_present:
        description: A named declaration absent from the observed DD must exist.
      value_equals_expected:
        description: A named declaration must equal expected_value.
      reference_value_matches:
        description: The declaration must equal the named reference path value.

  DDResolutionField:
    description: >-
      DD-authoritative field whose exact published value is replaced by one
      separately reviewed, version-bound local interpretation. LLM enrichment
      is excluded because it is not a DD declaration.
    permissible_values:
      unit:
        description: Normalized physical unit declaration.
      documentation:
        description: Exact raw DD documentation clause.
      data_type:
        description: DD storage data type.
      node_type:
        description: DD time-variation node type.
      physics_domain:
        description: Physics-domain classification attached to the DD node.
      cocos_transformation_type:
        description: COCOS transformation label declared by the DD.
      cocos_transformation_expression:
        description: Exact COCOS transformation expression declared by the DD.
      coordinates:
        description: Ordered exact coordinate identities declared by the DD.
      lifecycle_status:
        description: DD lifecycle maturity declaration.
      lifecycle_version:
        description: Exact version associated with the lifecycle declaration.

  DDResolutionStatus:
    description: >-
      Durable lifecycle of a reviewed local DD resolution. Only active records
      participate in runtime interpretation.
    permissible_values:
      active:
        description: Reviewed resolution applies to its exact path and DD version.
      retired_upstream:
        description: A published DD value converged on the reviewed effective value.
      withdrawn:
        description: Review authority withdrew the local interpretation.
      superseded:
        description: A newer separately reviewed resolution replaced this record.

  DDResolutionValueKind:
    description: Canonical storage kind for a typed DD resolution value.
    permissible_values:
      string:
        description: One exact scalar string.
      string_list:
        description: An ordered list of exact strings, used for coordinates.
      "null":
        description: An explicitly reviewed absent value.

  StandardNameKind:
    description: >-
      Entry kind for standard names — the structural classification of the
      quantity. Mirrors the ISN catalog Kind enum exactly (ISN is the
      authority; a kind outside this set cannot export). Semantic categories
      are not kinds: an eigenfunction is structurally complex, a spectrum is
      structurally scalar.
    permissible_values:
      scalar:
        description: Scalar quantity
      vector:
        description: Vector quantity (rank-1, including named single components)
      tensor:
        description: Tensor quantity (rank-2+, e.g. metric tensor, stress tensor)
      complex:
        description: Complex-valued quantity (real/imaginary parts or magnitude/phase)
      metadata:
        description: Non-measurable concept or classification

  StandardNameSourceStatus:
    description: >-
      Lifecycle status of a StandardNameSource node.
      extracted → composed | attached | vocab_gap | failed | stale | skipped | not_physical_quantity
    permissible_values:
      extracted:
        description: Source entity identified and queued for composition
      composed:
        description: LLM successfully generated a standard name from this source
      attached:
        description: Source auto-attached to an existing standard name (no LLM needed)
      vocab_gap:
        description: Composition blocked by missing grammar vocabulary
      failed:
        description: Composition failed after max retry attempts
      stale:
        description: Source entity no longer exists in upstream data
      skipped:
        description: >-
          DD path cannot be resolved to a valid standard name source due to
          upstream defects (prose unit, unresolvable Jinja template,
          context-dependent inheritance). See skip_reason for classification.
      not_physical_quantity:
        description: >-
          DD path is configuration metadata, not a physical/geometric/coordinate
          quantity. Filtered at extract time by attribute predicates (data_type,
          units, doc). Distinct from 'skipped' which signals upstream defect.

  ComposeHintStatus:
    description: >-
      Lifecycle of exact-source operator steering for DD name composition.
      An open hint remains available across retries and is consumed only when
      the exact fenced source successfully binds a candidate name.
    permissible_values:
      open:
        description: Steering is waiting for a successful source-to-name binding.
      consumed:
        description: The exact fenced source successfully bound a candidate.
      rejected:
        description: Steering was explicitly retired without a successful binding.

  StandardNameValidationStatus:
    description: >-
      Validation lifecycle for standard names.

        pending → valid | quarantined

      Names default to pending at persist time.
      validate_worker promotes to valid (passes) or quarantined (critical failures).

      Reviewer feedback (``reviewer_score_name`` / ``reviewer_score_docs``,
      ``reviewer_comments_name`` / ``reviewer_comments_docs``,
      ``review_tier``) is written onto every reviewed StandardName without
      status demotion. Sub-threshold names are selected for regeneration via
      ``sn run --min-score`` based on ``reviewer_score_name``, not on
      ``validation_status``.

      Only valid names participate in publish.
    permissible_values:
      pending:
        description: Awaiting validation (set at compose/persist time)
      valid:
        description: Passed ISN validation — eligible for consolidation, review, publish
      quarantined:
        description: >-
          Failed critical validation checks (grammar round-trip failure,
          empty description, invalid kind). Can be re-validated after fixes.

  LinkResolutionStatus:
    description: Status of cross-reference link resolution for standard names
    permissible_values:
      resolved:
        description: All links point to existing standard names with name prefix
      unresolved:
        description: One or more links point to DD paths with dd prefix or missing names
      failed:
        description: >-
          Link resolution attempted multiple times and permanently failed.
          Terminal state — requires manual intervention or vocabulary update.

  StandardNameReviewMode:
    description: >-
      Which LLM review rubric produced the most recent axis-specific
      score (``reviewer_score_name`` or ``reviewer_score_docs``).
      ``names`` uses four dimensions (grammar, semantic, convention,
      completeness) normalised over 80 points and is used for names
      generated without rich descriptions, typically during
      ``sn run --target names`` turns.
      ``docs`` uses four dimensions (description_quality, documentation_quality,
      completeness, physics_accuracy) normalised over 80 points and evaluates
      a docs-generation cycle (``sn run --target docs``) without
      re-scoring the name itself.
      Fidelity rank: ``names`` < ``docs``. A lower-fidelity
      run must not overwrite a prior higher-fidelity review unless
      ``--force`` is given.
    permissible_values:
      names:
        description: Four dimensions scored — grammar, semantic, convention, completeness.
      docs:
        description: >-
          Four dimensions scored — description_quality, documentation_quality,
          completeness, physics_accuracy.

  ReviewResolutionRole:
    description: >-
      Role of a Review node within an RD-quorum review group.
      ``primary`` and ``secondary`` run blind (identical input, no
      cross-contamination); ``escalator`` sees both prior critiques
      and is authoritative on disputed items.
    permissible_values:
      primary:
        description: First reviewer in the quorum (blind, cycle 0)
      secondary:
        description: Second reviewer in the quorum (blind, cycle 1)
      escalator:
        description: Tie-breaker reviewer that sees both prior critiques (cycle 2)

  ReviewResolutionMethod:
    description: >-
      How the final scores for a review group were determined.
      Only groups with ``quorum_consensus``, ``authoritative_escalation``,
      or ``single_review`` are eligible as winning groups for aggregate
      slot mirroring. ``max_cycles_reached`` and ``retry_item`` are
      non-winning terminal states.
    permissible_values:
      quorum_consensus:
        description: >-
          Cycles 0 and 1 agreed within tolerance on all dimensions.
          Final scores = mean of both reviewers.
      authoritative_escalation:
        description: >-
          Cycles 0 and 1 disagreed on one or more dimensions beyond
          tolerance. Cycle 2 (escalator) ran on disputed items and its
          result is authoritative for those items.
      max_cycles_reached:
        description: >-
          Cycles 0 and 1 disagreed but no escalator model is configured
          (len(models) < 3). Final scores = mean of both reviewers with
          disagreement flag.
      retry_item:
        description: >-
          Both cycles failed to produce a score for this item and retry
          also failed. Item is quarantined.
      single_review:
        description: >-
          Only one review cycle produced a valid score (either len(models)==1,
          or one cycle failed while the other succeeded).

  DocsReviewAdmissionStatus:
    description: >-
      Durable lifecycle of one priced documentation-review admission. Active
      records authorize exactly one fenced provider sequence; consumed and
      rolled_back records are immutable terminal receipts.
    permissible_values:
      active:
        description: Staged and eligible for one exact claimed review sequence.
      consumed:
        description: Terminal documentation authority and owned Reviews persisted atomically.
      rolled_back:
        description: Prior documentation authority restored and owned partial Reviews removed.

  SNRunStatus:
    description: SNRun lifecycle. `started` is in-progress; others are terminal.
    permissible_values:
      started:
        description: Run has begun and is currently executing.
      completed:
        description: Run finished cleanly.
      interrupted:
        description: User interrupted (Ctrl-C or signal).
      failed:
        description: Run aborted due to fatal error.
      degraded:
        description: Run completed but one or more LLMCost writes could not be drained — cost_spent is a lower bound.
      stale:
        description: >-
          Run left in-progress by a process that died without writing a terminal
          status; reclaimed by the orphan sweep so its claimed work is released.

  StandardNameStatus:
    description: >-
      ISN catalog lifecycle status of a StandardName — the vocabulary axis set
      on catalog import, orthogonal to the pipeline `name_stage` / `docs_stage`
      composition axes. Pipeline-minted names are `draft` until the catalog
      round-trip promotes them.
    permissible_values:
      draft:
        description: Pipeline-composed, not yet imported to the ISN catalog vocabulary.
      active:
        description: Live in the ISN catalog vocabulary.
      deprecated:
        description: Retired in the ISN catalog vocabulary; retained for resolution.
      superseded:
        description: Replaced by another catalog entry.

  NameStage:
    description: >-
      Name-pipeline stage for a StandardName node. Tracks progress through
      the name generation, review, and refinement sub-pipeline.
      Mirrors DocsStage for the docs sub-pipeline.
    permissible_values:
      pending:
        description: Queued for name generation; not yet drafted.
      drafted:
        description: >-
          Name generated (or refined) by the compose/refine worker.
          Set by _finalize_generated_name_stage and persist_refined_name.
          Eligible for name review.
      reviewed:
        description: >-
          Reviewed by the name-review worker; score recorded.
          If score < min_score and chain_length < rotation_cap, eligible
          for refine_name claiming.
      accepted:
        description: >-
          Score >= min_score; LLM review accepted. Transitions docs_stage to
          'pending', making the name eligible for generate_docs.
      approved:
        description: >-
          Accepted through a merged catalog pull request. This governance
          state is set only when the PR number, URL, and merge commit are
          recorded; RC export/import never grants it.
      refining:
        description: >-
          Claimed by a refine_name worker. Transient state — transitions
          back to 'reviewed' on failure or to 'drafted' on success (new node).
      exhausted:
        description: >-
          Reviewed but chain_length >= rotation_cap - 1 and score still
          below threshold. Terminal for the name pipeline.
      superseded:
        description: >-
          Replaced by a refined successor node via REFINED_FROM.
          Terminal — old node is kept for lineage but not re-processed.
      contested:
        description: >-
          Edited by a reviewer during human catalog review, but the edited
          form failed the compliance re-review on merge; frozen pending human
          adjudication. Not published (not 'approved') and not silently
          reverted (a human deliberately changed it). Excluded from all pools
          like 'exhausted'/'superseded'; resolved by sn edit (→re-review),
          sn approve --override (force approve), or sn revert (→accepted).

  RefineStopReason:
    description: >-
      Why a name-refinement attempt stopped short of an accepted successor.
      Recorded on ``refine_stop_reason``: on a name still holding budget it
      explains the attempt the next one follows, and on a name at
      ``name_stage='exhausted'`` it is why the name parked — letting an
      operator tell an ordinary spent budget from a conflict no further attempt
      could have resolved. Every value is recoverable: ``sn rescore`` resubmits
      the same name to a fresh quorum, and ``sn edit`` supplies the new
      steering information that reopens rewriting.
    permissible_values:
      attempts_exhausted:
        description: >-
          The refinement budget (``refine_attempts`` reaching ``rotation_cap``)
          was spent without a successor clearing review.
      transient_failure:
        description: >-
          The attempt failed for a reason that may not recur — a model or
          provider error, or a lost claim. Budget is still charged, because an
          attempt that cannot be distinguished from a permanent failure must
          not be free, but the name stays refinable while rotations remain.
      successor_collision:
        description: >-
          The refiner proposed an identity that already exists as a
          StandardName. Refinement cannot take an occupied identity — merging
          into it is a fold decision carrying source-migration semantics, not a
          rewrite — and the proposal is reproduced on every attempt, across
          models, so the remaining budget is not spent. The occupied identity
          is recorded on ``refine_collision_name``.
      successor_lifecycle_collision:
        description: >-
          The proposed identity exists in a lifecycle state the persistence
          fence will not reuse (a live, derived, or differently-scoped node),
          so the successor could never be provisioned under that name.
      vocabulary_gap:
        description: >-
          The refiner needs a token the closed grammar does not define, so no
          further attempt can compose the name it is reaching for. Resolved on
          the ISN side by admitting the token, not by re-running refinement.
      grammar_invalid:
        description: >-
          The proposed successor failed strict grammar validation for a reason
          other than a missing token — a malformed transformation, an invalid
          operator, or a self-referential rewrite. Deterministic for a given
          input, so terminal.

  EditMode:
    description: >-
      How an externally steered edit candidate originated. Set alongside
      name_hint / docs_hint when a human or agent attaches a proposal to a
      StandardName via `imas-codex sn edit`.
    permissible_values:
      hint:
        description: >-
          A direction is injected into generate_name/refine_name (name_hint)
          or generate_docs/refine_docs (docs_hint) prompts as additional
          steering context; the pipeline still composes the candidate.
      rename:
        description: >-
          name_hint carries a full replacement name that skips generation —
          the proposed name rides straight into name review.
      docs:
        description: >-
          docs_hint carries full replacement documentation that skips
          generation — the proposed documentation rides straight into
          docs review.

  EditOrigin:
    description: >-
      Who proposed an edit attached via `imas-codex sn edit`. Distinct from
      the implicit reviewer origin of `reviewer_suggested_name` (which is
      always LLM-authored); edit_origin records the human/agent that
      requested the steering.
    permissible_values:
      human:
        description: Edit proposed by a human editor.
      agent:
        description: Edit proposed by an autonomous or supervised agent.

  EditStatus:
    description: >-
      Lifecycle of an edit attached via `imas-codex sn edit`.
        open → applied | exhausted | rejected
    permissible_values:
      open:
        description: >-
          Edit is attached and riding the existing generate→review→score
          pipeline; outcome not yet determined.
      applied:
        description: >-
          The steered candidate was accepted by review — the edit achieved
          its intended change. Terminal.
      exhausted:
        description: >-
          The refine rotation cap was hit without the steered candidate
          being accepted. Terminal.
      rejected:
        description: >-
          The steered candidate was scored below threshold by review with
          no further rotation available, or was terminally rejected by an
          editor. Terminal.

  EditScope:
    description: >-
      Blast radius of an edit attached via `imas-codex sn edit`. Recorded on
      the edited StandardName so the rename cascade can be applied once the
      root edit's review accepts it.
    permissible_values:
      only_self:
        description: >-
          The edit applies to this StandardName only. Named `only_self`
          rather than `self` — a permissible_value literally named "self"
          crashes the LinkML/jsonasobj2 YAML loader (ExtendedNamespace
          kwarg collision with the `self` positional parameter) for every
          schema in the import closure, not just this one.
      family:
        description: >-
          The edit is promoted from this shared-segment leaf to its parent,
          and the parent's rename cascades through the full HAS_PARENT subtree
          (every descendant embedding the segment) — not just the leaf's
          direct siblings. Full-subtree breadth is grammar-required: a
          grandchild embedding the same base would desync into invalid grammar
          if only direct siblings were renamed.
      subtree:
        description: >-
          The edit applies to this StandardName (as parent) plus every
          descendant reachable via HAS_PARENT — the rename cascade follows
          the full subtree.

# =============================================================================
# Classes
# =============================================================================

classes:
  StandardName:
    description: >-
      A canonical physics or geometric quantity name. Part of the standard_names
      vocabulary used to unify signal semantics across facilities and DD paths.

      Relationships:
        - HAS_UNIT -> Unit (canonical units for this quantity)
        - HAS_COCOS -> COCOS (COCOS convention this quantity follows)
        - HAS_REVIEW -> StandardNameReview (quality review records)

      Inbound relationships:
        - (IMASNode)-[:HAS_STANDARD_NAME]->(StandardName)
        - (FacilitySignal)-[:HAS_STANDARD_NAME]->(StandardName)

      Example: plasma_current, electron_density_core, major_radius
    class_uri: sn:StandardName
    mixins:
      - LLMOperation
    attributes:
      id:
        identifier: true
        description: >-
          The standard name in snake_case.
          E.g., plasma_current, electron_temperature, major_radius
        required: true
      description:
        description: Human-readable definition of this quantity
      unit:
        description: Expected SI units for this quantity
        range: Unit
        annotations:
          relationship_type: HAS_UNIT
      source_types:
        description: >-
          Unordered set of source types that contribute to this standard name.
          E.g., ["dd"] for DD-only, ["dd", "signals"] for multi-source.
        multivalued: true
        range: StandardNameSourceType
      confidence:
        description: LLM confidence score for generated names (0-1)
        range: float
      origin:
        description: >-
          Provenance of the most recent editorial edit. 'pipeline' for
          LLM-generated content, 'catalog_edit' for content imported from
          a catalog PR. Used by filter_protected() to guard catalog-owned
          editorial fields from pipeline overwrites.
        range: StandardNameOrigin
      deprecates:
        description: >-
          ID of the standard name this entry deprecates. Set during
          catalog import when a name supersedes an older one.
      superseded_by:
        description: >-
          ID of the standard name that supersedes this entry. Set
          during catalog import when this name is replaced.
      catalog_pr_number:
        description: >-
          GitHub PR number of the merged catalog PR that approved this
          entry. Never set by RC import/export.
        range: integer
      catalog_pr_url:
        description: >-
          Full URL of the merged catalog PR that approved this entry.
          Set only by sn merge with complete merge metadata.
      catalog_approved_at:
        description: >-
          ISO 8601 timestamp when the catalog pull request was merged. Null
          until the name reaches the approved lifecycle state.
        range: datetime
      catalog_merge_commit_sha:
        description: >-
          Merge commit SHA of the catalog pull request that approved this
          name. Required together with catalog_pr_number and catalog_pr_url
          before name_stage may become approved.
      exported_at:
        description: >-
          ISO 8601 timestamp when this name was last exported to the
          catalog staging directory by sn export.
        range: datetime
      merge_quarantine_reason:
        description: >-
          Why sn merge quarantined a reviewer edit (the failing rubric verdict).
          Set on the validation_status='quarantined' path during merge.
      merge_quarantine_at:
        description: >-
          ISO 8601 timestamp when sn merge quarantined a reviewer edit.
        range: datetime
      contested_reason:
        description: >-
          Why a reviewer-edited name was moved to the 'contested' stage — the
          edited form and the failing compliance re-review verdict recorded by
          sn merge. Human-vs-machine conflict awaiting adjudication.
      contested_at:
        description: >-
          ISO 8601 timestamp when sn merge moved the name to 'contested'.
        range: datetime
      contested_resolution:
        description: >-
          How a contested name was adjudicated — the human justification passed
          to sn approve --override (force approve over the rubric) or sn revert
          (drop the edit back to accepted). Null while still contested.
      model:
        description: >-
          LLM model that generated this standard name
          (e.g., "google/gemini-3-flash"). Tracked for provenance.
      created_at:
        description: ISO 8601 timestamp when this name was created
        range: datetime
      generated_at:
        description: ISO 8601 timestamp when LLM generation occurred
        range: datetime
      embedding:
        description: Vector embedding of description for semantic search
        multivalued: true
        range: float
      embedded_at:
        description: When the embedding was last computed
        range: datetime
      embed_failed_at:
        description: When the most recent embedding attempt failed; cleared on success
        range: datetime
      embed_claimed_at:
        description: >-
          Timestamp when an embed worker claimed this name for embedding.
          Independent of the main claimed_at used for stage transitions.
          Stale claims (>5min) are automatically reclaimed.
        range: datetime
      embed_claim_token:
        description: UUID token for atomic embed work claiming
      embed_text_hash:
        description: >-
          SHA-256 hex digest (truncated to 16 chars) of the text used to
          compute the current embedding (format: "name — description").
          Used to detect stale embeddings after description updates.
          Cleared by persist functions when description changes.
      documentation:
        description: >-
          Strict normative documentation with defining LaTeX equations and
          symbols, scope and exclusions, essential semantic relationships, and
          necessary sign conventions. Generic diagnostics, estimator recipes,
          simulation workflows, typical values, and practical guidance are
          excluded.
          Uses [name](#name) inline links to other standard names.
      kind:
        description: >-
          Entry kind — structural classification (see StandardNameKind);
          mirrors the ISN catalog Kind enum
        range: StandardNameKind
      links:
        description: Internal cross-references to related standard names (name only)
        multivalued: true
        range: string
      source_paths:
        description: >-
          Exact StandardNameSource entity IDs mapped to this standard name
          (union list). DD entries use the canonical "dd:<bare DD path>" form,
          for example "dd:equilibrium/time_slice/profiles_1d/psi". Signal and
          derived entries retain their producing source IDs, including any
          facility/source prefix or "derived:" prefix.
        multivalued: true
        range: string
      validity_domain:
        description: Physical region where this quantity is defined
      constraints:
        description: Physical/mathematical constraints (e.g., T_e > 0)
        multivalued: true
        range: string
      physics_domain:
        description: >-
          Primary physics domain for this StandardName (scalar). When a
          source from a more central domain (lower rank in
          domain_ranking) is attached, ``physics_domain`` is promoted —
          this is the canonical "where does this concept live" pointer.
          Cross-domain discoverability is preserved via ``source_domains``.
        range: PhysicsDomain
        annotations:
          relationship_type: HAS_PHYSICS_DOMAIN
      source_domains:
        description: >-
          Every physics domain that has ever contributed a source to
          this StandardName (append-only, deduplicated). Preserves
          cross-domain discoverability after the primary
          ``physics_domain`` has been promoted to a more central
          value. A name with sources from {transport, equilibrium}
          will have ``physics_domain='equilibrium'`` (promoted) and
          ``source_domains=['transport', 'equilibrium']``.
        multivalued: true
        range: string
      primary_cluster_id:
        description: >-
          ID of the primary semantic cluster this standard name belongs to.
          Scalar source for the IN_CLUSTER edge (see primary_cluster_ref).
          Set at compose time from the highest-ranked contributing DD
          source's cluster (see sources/dd.py and enrichment.py).
      run_id:
        description: >-
          ID of the sn run that produced this standard name. Propagated from
          the originating StandardNameSource at compose time. Used for
          run-scoped filtering (``--focus``) and provenance.
      drain_scope_id:
        description: >-
          Ephemeral owner of one exact bounded manifest drain. This is
          independent of run_id provenance and is cleared when that drain
          completes or its lease is recovered.
      drain_scope_claimed_at:
        description: >-
          Heartbeat timestamp for drain_scope_id. This lease is independent of
          the worker claimed_at/claim_token pair.
        range: datetime
      drain_scope_paths:
        description: Exact DD paths that admitted this node to the bounded drain.
        multivalued: true
      drain_claim_scope_id:
        description: >-
          Ephemeral bounded-drain owner written atomically with a worker claim.
      semantic_sim:
        description: >-
          Semantic-similarity score (0-1) from the duplicate-detection gate.
          Cosine similarity of this name's embedding to its nearest existing
          neighbour at compose time. Written by the semantic-similarity check
          regardless of outcome (see workers.py).
        range: float
      tags:
        description: >-
          Free-form editorial tags carried on the standard name. Set during
          refine and round-tripped through the catalog. Multivalued string
          list.
        multivalued: true
        range: string
      cocos_transformation_type:
        description: >-
          COCOS transformation type from the source DD path. Identifies which
          class of COCOS sign convention applies (e.g., psi_like, ip_like).
          Null for COCOS-independent quantities. Authoritative from DD —
          injected post-LLM, never generated by the LLM.
          Values match the COCOSLabelTransformation enum from imas_dd.yaml.
        range: string
      cocos:
        description: >-
          COCOS convention this standard name follows. Links to a COCOS
          singleton node (e.g., COCOS 11 or 17). All sign convention
          parameters (sigma_bp, etc.) are on the COCOS node. Set for any
          COCOS-dependent quantity regardless of source (DD, facility
          signals, manual entry). Null for COCOS-independent quantities.
        range: COCOS
        annotations:
          relationship_type: HAS_COCOS
      dd_version:
        description: >-
          DD version used when this standard name was generated. Optional
          provenance — records which DD snapshot provided paths, units,
          and documentation at generation time. Null for non-DD-sourced
          names. Plain string, not a graph relationship.
        range: string
      isn_version:
        description: >-
          ISN (imas-standard-names) package version at generation time
          (e.g. "0.7.0rc56"). Records which grammar, vocabulary, and
          validation rules were in effect when the name was composed.
        range: string
      codex_version:
        description: >-
          imas-codex package version at generation time (e.g. "4.1.0").
          Records which pipeline, prompts, and enrichment logic produced
          this name.
        range: string
      imported_at:
        description: >-
          ISO 8601 timestamp when this entry was last folded in from the
          catalog. Set by ``sn merge`` on each catalog-PR merge.
        range: datetime
      reviewer_score_name:
        description: >-
          Name-review quality score (0-1). Set by the name review phase
          (``--target names`` or the ``review_names`` turn phase).
          Independent of ``reviewer_score_docs``.
        range: float
      reviewer_scores_name:
        description: >-
          JSON-encoded name-axis dimensional scores (4 dims: grammar,
          semantic, convention, completeness, each 0-20). Written by
          ``mode="name"`` review only.
      reviewer_comments_per_dim_name:
        description: >-
          JSON-encoded name-axis per-dimension reviewer comments. Keys
          match the name rubric dims (grammar, semantic, convention,
          completeness). Null values mean no comment for that dimension.
      reviewer_comments_name:
        description: >-
          Name-axis reviewer summary prose. Written by ``mode="name"``
          review only; used by the regeneration feedback-injection path.
      reviewer_suggested_name:
        description: >-
          Reviewer-proposed replacement name. Set by the name-review
          phase whenever the LLM offers a concrete improved name. The
          original ``id`` is preserved; this field records the suggestion
          for human editorial follow-up. Null when the reviewer offered
          no alternative.
        range: string
      reviewer_suggestion_justification_name:
        description: >-
          1–3 sentence justification for ``reviewer_suggested_name``,
          grounded in ISN grammar and the per-item DD context the reviewer
          received. Null when ``reviewer_suggested_name`` is null.
        range: string
      reviewer_model_name:
        description: LLM model that produced the most recent name-axis review.
      review_resolution_method:
        description: >-
          How the reviewer chain reached the most recent name-axis score:
          ``quorum_consensus`` (both blind seats agreed),
          ``authoritative_escalation`` (the escalator seat resolved their
          dispute), ``max_cycles_reached`` (the blind-seat cycles ended
          without agreement), or ``single_review`` (fewer seats scored than
          the chain defines).
        range: string
      review_quorum_shortfall:
        description: >-
          Why the most recent name-axis score was not acted on. Null on
          every quorate review. A non-null value means the reviewer chain
          did not reach a verdict, so the score neither accepts the name
          nor buys a refine rotation to rewrite it — refine eligibility
          skips any name carrying it. Cleared by the next quorate review;
          ``sn rescore`` is the recovery.
        range: string
      review_quorum_shortfall_at:
        description: >-
          ISO 8601 timestamp of the most recent withheld acceptance. Null
          whenever ``review_quorum_shortfall`` is null.
        range: datetime
      reviewed_name_at:
        description: >-
          ISO 8601 timestamp of the most recent name-review pass.
          Gate for docs review — docs review skips any name where
          ``reviewed_name_at IS NULL``.
        range: datetime
      reviewer_score_docs:
        description: >-
          Docs-review quality score (0-1). Set by the docs review phase
          (``--target docs`` or the ``review_docs`` turn phase).
          Independent of ``reviewer_score_name``.
        range: float
      reviewer_scores_docs:
        description: >-
          JSON-encoded docs-axis dimensional scores (4 dims:
          description_quality, documentation_quality, completeness,
          physics_accuracy, each 0-20). Written by ``mode="docs"`` review
          only.
      reviewer_comments_per_dim_docs:
        description: >-
          JSON-encoded docs-axis per-dimension reviewer comments. Keys
          match the docs rubric dims. Null values mean no comment for
          that dimension.
      reviewer_comments_docs:
        description: >-
          Docs-axis reviewer summary prose. Written by ``mode="docs"``
          review only.
      reviewer_model_docs:
        description: LLM model that produced the most recent docs-axis review.
      docs_review_resolution_method:
        description: >-
          How the reviewer chain reached the most recent docs-axis score:
          ``quorum_consensus`` (both blind seats agreed),
          ``authoritative_escalation`` (the escalator seat resolved their
          dispute), ``max_cycles_reached`` (no seat resolved it), or
          ``single_review`` (fewer seats scored than the chain defines).
        range: string
      docs_review_quorum_shortfall:
        description: >-
          Why the most recent docs-axis score was not acted on. Null on every
          quorate review. A non-null value means the reviewer chain did not
          reach a verdict, so the score neither accepts the documentation nor
          buys a refinement rotation. Cleared when documentation is staged for
          an exact rescore or by the next quorate review.
        range: string
      docs_review_quorum_shortfall_at:
        description: >-
          ISO 8601 timestamp of the most recent withheld docs decision. Null
          whenever ``docs_review_quorum_shortfall`` is null.
        range: datetime
      reviewed_docs_at:
        description: >-
          ISO 8601 timestamp of the most recent docs-review pass.
          Set only by ``--target docs`` review.
        range: datetime
      # --- name-pipeline stage tracking ---
      name_stage:
        description: >-
          Name-pipeline stage for this StandardName. Set by
          _finalize_generated_name_stage (drafted), the name-review worker
          (reviewed, accepted, exhausted), persist_refined_name (superseded
          on predecessor, drafted on new node), and the refine_name claim
          (refining). See NameStage enum for all values.
        range: NameStage
      chain_length:
        description: >-
          REFINED_FROM chain depth: 0 for original generated names,
          incremented by 1 on each refine_name pass that creates a new node.
          Lineage depth only — it counts PERSISTED successors, so it does not
          bound refinement work. refine_attempts is the budget counter.
        range: integer
      refine_attempts:
        description: >-
          Durable count of name-refinement attempts spent on this identity
          lineage. Incremented once per verified refine_name claim, before
          the model call, so an attempt whose successor never persists (the
          proposed identity already exists, the persistence fence refuses it,
          the candidate fails grammar validation) still consumes budget. A
          refined successor inherits the predecessor's count, so the cap
          bounds the whole chain rather than each node. Compared against
          rotation_cap by REFINE_NAME_ELIGIBILITY_WHERE, by the escalation
          decision, and by the review worker's exhaustion check.
        range: integer
      refine_stop_reason:
        description: >-
          Why the most recent name-refinement attempt stopped short of an
          accepted successor. Recorded on every failed attempt, so the next
          attempt can report what the last one hit, and it is the reason the
          name parked once name_stage reaches 'exhausted'. A persisted
          successor is a different node, so nothing carries a stale reason
          forward. Cleared when the name is re-staged with new steering
          information.
        range: RefineStopReason
      refine_stopped_at:
        description: >-
          ISO 8601 timestamp of the most recent refinement stop. Null whenever
          refine_stop_reason is null.
        range: datetime
      refine_collision_name:
        description: >-
          The existing StandardName id the refiner proposed to become, for
          the collision stop reasons. Diagnostic only — lineage lives on
          REFINED_FROM, and this pairing is explicitly NOT lineage: it names
          the identity refinement could not take, which is the operator's
          cue to fold or edit rather than re-run refinement.
      # --- generate_docs provenance ---
      docs_stage:
        description: >-
          Docs-pipeline stage for this StandardName. Mirrors name_stage for
          the docs generation/review/refine sub-pipeline.
          Values: pending | drafted | reviewed | accepted | exhausted.
          Set to 'pending' when name_stage transitions to 'accepted'.
      docs_chain_length:
        description: >-
          Number of docs refinement passes applied to this StandardName.
          0 on initial generate_docs; increments on each refine_docs pass.
        range: integer
      docs_model:
        description: >-
          LLM model used for the most recent generate_docs or refine_docs call.
      docs_generated_at:
        description: >-
          ISO 8601 timestamp when generate_docs last wrote documentation
          to this node.
        range: datetime
      harmonized_at:
        description: >-
          ISO 8601 timestamp of the most recent family-harmonization pass
          that stamped this member — i.e. its sibling family's documentation
          was verified structurally parallel (docs accepted, drift below the
          worklist threshold). Null for never-harmonized names.
        range: datetime
      harmonized_group_signature:
        description: >-
          Idempotency signature of the sibling family at harmonization time:
          a sha256 over the sorted live member ids plus each member's
          description+documentation content hash. The harmonize worklist
          skips a family while its current signature equals this stored
          value; any membership or docs change invalidates it.
      parent_enriched_at:
        description: >-
          ISO 8601 timestamp when the enrich_parents pool synthesised a real
          description for this derived parent (replacing the deterministic
          placeholder), routing it out of the coverage deadlock into
          REVIEW_NAME. Null for non-derived names and never-enriched parents.
        range: datetime
      parent_enrich_model:
        description: >-
          LLM model used by the enrich_parents pool to synthesise this derived
          parent's description from its children. Null unless enriched.
      review_tier:
        description: >-
          Quality tier from review: outstanding, good, inadequate, poor.
          Derived from axis-specific score thresholds
          (``reviewer_score_name`` or ``reviewer_score_docs``).
      review_count:
        description: >-
          Number of StandardNameReview nodes attached to this StandardName via
          HAS_REVIEW. 0 when no reviewers have scored it, 1 for single
          canonical review, N >= 2 for multi-reviewer setups.
        range: integer
      review_mean_score:
        description: >-
          Arithmetic mean of ``StandardNameReview.score`` across all attached
          StandardNameReview nodes. ``null`` when ``review_count == 0``.
        range: float
      review_disagreement:
        description: >-
          True iff ``review_count >= 2`` and
          ``max(StandardNameReview.score) - min(StandardNameReview.score) >= disagreement-threshold``.
          Always false for ``review_count <= 1``.
        range: boolean
      reviewer_score_secondary:
        description: >-
          Secondary reviewer's aggregate score (0-1) from the most recent
          dual-model review pass. Null when only a single model reviewed
          the name. Axis-agnostic — records the secondary score for
          whichever axis (name or docs) was last reviewed with dual models.
        range: float
      reviewer_scores_secondary:
        description: >-
          JSON-encoded per-dimension sub-scores from the secondary reviewer.
          Same schema as ``reviewer_scores_name`` / ``reviewer_scores_docs``
          depending on which axis produced the review.
      reviewer_model_secondary:
        description: >-
          LLM model that produced the secondary review. Null when only a
          single model reviewed the name.
      reviewer_disagreement:
        description: >-
          Absolute difference between the primary and secondary reviewer
          aggregate scores (0-1 scale). Null when only a single model
          reviewed the name. Distinct from ``review_disagreement`` (boolean
          computed from Review node spread).
      validation_issues:
        description: >-
          ISN validation issues from three-layer validation
          (pydantic, semantic, description). Each entry is a tagged
          string like "[pydantic:field] message" or "[semantic] message".
        multivalued: true
        range: string
      validation_layer_summary:
        description: >-
          JSON-encoded summary of validation by layer:
          {pydantic: {passed: bool, error_count: int},
           semantic: {issue_count: int},
           description: {issue_count: int}}
      vocab_gap_detail:
        description: >-
          JSON-encoded detail about missing vocabulary: segment name,
          needed token, and reason. Set when a compose vocab gap is flagged.
      catalog_commit_sha:
        description: >-
          Git commit SHA of the catalog repo at import time.
          Enables sync-status checking between graph and catalog.
      link_status:
        description: >-
          Resolution status of cross-reference links. Set to 'unresolved'
          when dd: prefix links are present, 'resolved' when all links
          point to existing standard names, 'failed' after max retries.
        range: LinkResolutionStatus
      link_checked_at:
        description: >-
          ISO 8601 timestamp when link resolution was last attempted.
          Used with link_retry_count for age-weighted priority queuing.
        range: datetime
      link_retry_count:
        description: >-
          Number of link resolution attempts. Used to determine when
          to move to terminal 'failed' state (max 5 retries).
        range: integer
      review_input_hash:
        description: >-
          SHA-256 hex digest of the inputs used in the most recent LLM
          review (name, description, documentation, unit, kind).
          Compared to a freshly computed hash to detect stale reviews
          that should be re-run.  OVERWRITTEN (not coalesced) on every
          write so that stale hashes never persist.
        range: string
      # --- Worker coordination (graph-state-machine) ---
      claimed_at:
        description: >-
          Timestamp when a worker claimed this name for processing.
          Used for distributed worker coordination across parallel agents.
          Stale claims (>5min) are reclaimed by other workers.
        range: datetime
      claim_token:
        description: UUID token for atomic work claiming between parallel workers
      validated_at:
        description: >-
          Timestamp when ISN validation completed. Null means validation
          has not run yet. Set by validate_worker after grammar round-trip
          and three-layer ISN checks.
        range: datetime
      validation_status:
        description: >-
          Validation lifecycle gate. Set to 'pending' at compose time,
          promoted to 'valid' or 'quarantined' by validate_worker. Only
          'valid' names participate in publish. Regeneration targeting is
          driven by `sn run --min-score F`, which selects valid names
          whose `reviewer_score_name` falls below the threshold.
        range: StandardNameValidationStatus
      status:
        description: >-
          ISN catalog lifecycle status — the vocabulary axis set on catalog
          import, orthogonal to the pipeline name_stage/docs_stage axes.
          Pipeline-minted names are 'draft' until the catalog round-trip.
        range: StandardNameStatus
      claim_seq:
        description: >-
          Monotonic claim counter incremented each time a pool worker claims
          this name; disambiguates concurrent claims and orders retries.
        range: integer
      source_path:
        description: >-
          Snapshot of the originating source id (DD path or facility signal)
          this name was composed from, denormalized from the StandardNameSource
          at refresh time for fast lookup without traversing PRODUCED_NAME.
      source_documentation:
        description: >-
          Snapshot of the source DD/signal documentation captured at refresh
          time (drives grounded compose/docs without re-reading the source).
      source_unit:
        description: >-
          Snapshot of the source DD/signal unit captured at refresh time
          (unit is DD-authoritative; mirrored here for display and validation).
      source_raw_unit:
        description: >-
          Exact unit published by the DD source when the effective source
          snapshot was resolved. Distinguishes upstream truth from a reviewed
          local resolution.
        range: string
      source_raw_documentation:
        description: >-
          Exact documentation published by the DD source when the effective
          source snapshot was resolved.
        range: string
      source_dd_resolution_ids:
        description: >-
          Resolution record identifiers applied to produce the effective
          source snapshot.
        multivalued: true
        range: string
      source_dd_resolution_converged_ids:
        description: >-
          Resolution record identifiers whose effective value already matches
          the raw published DD value.
        multivalued: true
        range: string
      source_dd_resolution_manifest_digest:
        description: >-
          Content digest of the strict DD resolution authority used to produce
          the source snapshot.
        range: string
      source_dd_resolution_marker:
        description: >-
          Typed marker distinguishing an effective DD source snapshot from raw
          published release evidence.
        range: string
      superseded_from_stage:
        description: >-
          The name_stage this name held immediately before it was superseded,
          retained so the compaction sweep can reason about what was lost.
      internal_changes:
        description: >-
          Non-indexed internal change events (rename, domain reclassify,
          supersede) recorded against this name for traceability without minting
          a new StandardName.
        multivalued: true
        range: StandardNameChange
        annotations:
          relationship_type: HAS_INTERNAL_CHANGE
      consolidated_at:
        description: >-
          Timestamp when cross-batch consolidation approved this name.
          Null means consolidation has not processed this name yet.
          Names with conflicts are not marked consolidated.
        range: datetime
      is_geometric_coordinate:
        description: >-
          True when this StandardName represents a geometric coordinate
          parent (e.g. position) whose children have heterogeneous units
          (m for r/z, rad for phi). Distinguishes geometric parents from
          physical vector parents which have uniform units. Set by
          seed_parent_sources when HAS_PARENT edges carry
          operator_kind='coordinate'.
        range: boolean
      desc_name_similarity:
        description: >-
          Cosine similarity between the grammar-expanded name embedding
          and the description embedding. Populated by REVIEW_NAME
          pre-step. Below ``desc_name_similarity_threshold`` (default
          0.55) routes the item to REFINE_DOCS instead of failing the
          name. Advisory; the reviewer also sees this in context.
        range: float
      grammar_tokens:
        description: >-
          GrammarToken nodes that make up this standard name, parsed
          against the active ISN grammar. Emitted as HAS_SEGMENT edges.

          Edge properties (written by persist_worker via
          imas_standard_names.graph.spec.segment_edge_specs):
            - position: integer — zero-based index of this token within
              the parsed name (order of appearance).
            - segment: string   — grammar segment name this token
              occupied (e.g. "subject", "transformation").

          In addition to the generic HAS_SEGMENT edge, 13 typed edges are
          written alongside it for direct graph traversal and MCP filtering.
          The typed edges are keyed on segment name:
            physical_base  → HAS_PHYSICAL_BASE
            subject        → HAS_SUBJECT
            transformation → HAS_TRANSFORMATION
            component      → HAS_COMPONENT
            coordinate     → HAS_COORDINATE
            process        → HAS_PROCESS
            position       → HAS_POSITION
            region         → HAS_REGION
            device         → HAS_DEVICE
            geometric_base → HAS_GEOMETRIC_BASE
            aggregation    → HAS_AGGREGATION
            orbit          → HAS_ORBIT
            population     → HAS_POPULATION
          Each typed edge carries no extra properties; target is the same
          GrammarToken node referenced by HAS_SEGMENT. LinkML does not
          natively model edge labels, so the convention mirrors the
          existing HAS_SEGMENT pattern (relationship_type annotation).

          LinkML does not natively model edge properties, so those two
          attributes live on the Cypher edge rather than as StandardName
          properties; segment_edge_specs above is their authoritative shape.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_SEGMENT
      # --- Typed grammar segment edges ---
      # Each typed edge mirrors a HAS_SEGMENT edge for direct graph traversal
      # and MCP filtering. See HAS_SEGMENT slot above for full rationale.
      grammar_physical_base_token:
        description: GrammarToken at the physical_base segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_PHYSICAL_BASE
      grammar_subject_token:
        description: GrammarToken at the subject segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_SUBJECT
      grammar_transformation_token:
        description: GrammarToken at the transformation segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_TRANSFORMATION
      grammar_component_token:
        description: GrammarToken at the component segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_COMPONENT
      grammar_coordinate_token:
        description: GrammarToken at the coordinate segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_COORDINATE
      grammar_process_token:
        description: GrammarToken at the process segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_PROCESS
      grammar_position_token:
        description: GrammarToken at the position segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_POSITION
      grammar_region_token:
        description: GrammarToken at the region segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_REGION
      grammar_device_token:
        description: GrammarToken at the device segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_DEVICE
      grammar_geometric_base_token:
        description: GrammarToken at the geometric_base segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_GEOMETRIC_BASE
      grammar_aggregation_token:
        description: GrammarToken at the aggregation segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_AGGREGATION
      grammar_orbit_token:
        description: GrammarToken at the orbit segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_ORBIT
      grammar_population_token:
        description: GrammarToken at the population segment.
        multivalued: true
        range: GrammarToken
        inlined: false
        annotations:
          relationship_type: HAS_POPULATION
      # --- Bare-name grammar-decomposition columns ---
      # These scalar columns are the canonical per-segment family written by
      # `_write_grammar_decomposition` and the standard-name persist path
      # (graph_ops.py). They mirror the typed HAS_* edges above and back the
      # search/filter surface (search.py segment_filters, grammar_query tiers,
      # MCP search_standard_names per-segment params). Property names equal the
      # ISN pydantic StandardName segment attribute names.
      physical_base:
        description: >-
          Core physical-quantity base token (grammar decomposition column,
          e.g. "temperature", "magnetic_field"). Written by
          `_write_grammar_decomposition` from the ISN parser.
      geometric_base:
        description: >-
          Geometric carrier base token (grammar decomposition column,
          e.g. "position", "area"). Written by `_write_grammar_decomposition`.
      subject:
        description: >-
          Subject token (grammar decomposition column, e.g. "electron",
          "ion"). Written by `_write_grammar_decomposition`.
      aggregation:
        description: >-
          Aggregation token (grammar decomposition column). Single-token
          closed segment: "total", "net". Renders ahead of subject in the ISN
          order <aggregation>_<orbit>_<population>_<subject>_<base>. Written
          by `_write_grammar_decomposition`.
      orbit:
        description: >-
          Orbit-class token (grammar decomposition column). Single-token
          closed segment: "trapped", "co_passing", "counter_passing",
          "co_current", "counter_current". Written by
          `_write_grammar_decomposition`.
      population:
        description: >-
          Energy-state population token (grammar decomposition column).
          Single-token closed segment distinguishing kinetic sub-populations:
          "fast", "thermal", "cold", "hot", "suprathermal", "molecular",
          "bulk". Written by `_write_grammar_decomposition`.
      transformation:
        description: >-
          Transformation prefix token (grammar decomposition column, e.g.
          "time_derivative"). Written by `_write_grammar_decomposition`.
      component:
        description: >-
          Vector-component token (grammar decomposition column, e.g.
          "toroidal", "radial"). Written by `_write_grammar_decomposition`.
      coordinate:
        description: >-
          Coordinate-axis token (grammar decomposition column, e.g.
          "poloidal", "parallel"). Written by `_write_grammar_decomposition`.
      process:
        description: >-
          Process / due_to_ token (grammar decomposition column). Written by
          `_write_grammar_decomposition`.
      position:
        description: >-
          Position qualifier token (grammar decomposition column, e.g.
          "at_magnetic_axis"). Written by `_write_grammar_decomposition`.
      region:
        description: >-
          Region qualifier token (grammar decomposition column). Written by
          `_write_grammar_decomposition`.
      device:
        description: >-
          Device qualifier token (grammar decomposition column). Written by
          `_write_grammar_decomposition`.
      object:
        description: >-
          Object token (grammar decomposition column). Written by
          `_write_grammar_decomposition`.
      geometry:
        description: >-
          Geometry token (grammar decomposition column). Written by
          `_write_grammar_decomposition`.
      # --- Qualifier fields for wave and geometric decomposition ---
      toroidal_mode:
        description: >-
          Toroidal mode number qualifier. Used for Fourier-decomposed
          quantities (e.g., n=0 axisymmetric component).
        range: integer
      flux_surface_average:
        description: >-
          Whether this quantity is a flux-surface average. Default false.
          Distinguishes local vs. averaged representations of the same
          physical quantity.
        range: boolean
      # --- Enrichment provenance ---
      enriched_at:
        description: ISO 8601 timestamp when enrichment completed
        range: datetime
      enrich_tokens:
        description: >-
          Total token count (prompt + completion) of the enrichment call.
        range: integer
      enrich_batch_id:
        description: >-
          Batch identifier grouping names enriched in the same run.
          Format: "enrich-{timestamp}" or user-supplied tag.
      # --- Per-pool cost attribution ---
      # The LLMOperation mixin provides the aggregate ``llm_cost`` field
      # (= sum of per-pool fields).  One cost field + one counter field
      # per pool, aligned 1:1 with the 6 SN pipeline pools.  All use
      # ``+= coalesce(...)`` accumulation; only ``sn clear`` resets them.
      llm_cost_generate_name:
        description: >-
          Cumulative USD cost of generate_name LLM calls for this name.
          Excludes refine_name (regeneration) costs.
        range: float
      llm_cost_review_name:
        description: >-
          Cumulative USD cost of review_name LLM calls (name-axis
          reviews across all reviewer models).
        range: float
      llm_cost_refine_name:
        description: >-
          Cumulative USD cost of refine_name LLM calls (regeneration
          when reviewer feedback triggered a re-compose).
        range: float
      llm_cost_generate_docs:
        description: >-
          Cumulative USD cost of generate_docs LLM calls for this name.
        range: float
      llm_cost_review_docs:
        description: >-
          Cumulative USD cost of review_docs LLM calls (docs-axis
          reviews across all reviewer models).
        range: float
      llm_cost_refine_docs:
        description: >-
          Cumulative USD cost of refine_docs LLM calls (docs
          regeneration after review feedback).
        range: float
      generate_name_count:
        description: >-
          Number of generate_name calls for this name.  Incremented
          each time ``write_standard_names`` records a non-null
          ``llm_cost`` and this is a first-generation (not a refine).
        range: integer
        ifabsent: int(0)
      review_name_count:
        description: >-
          Number of review_name calls for this name.  Incremented
          each time ``write_name_review_results`` persists a review.
        range: integer
        ifabsent: int(0)
      refine_name_count:
        description: >-
          Number of refine_name LLM calls for this name.  Tracks
          actual LLM invocations; may differ from ``regen_count``
          (which tracks rotation-cap cycles and may skip no-op
          refinements).
        range: integer
        ifabsent: int(0)
      generate_docs_count:
        description: >-
          Number of generate_docs LLM calls for this name.
        range: integer
        ifabsent: int(0)
      review_docs_count:
        description: >-
          Number of review_docs LLM calls for this name.  Incremented
          each time ``write_docs_review_results`` persists a review.
        range: integer
        ifabsent: int(0)
      refine_docs_count:
        description: >-
          Number of refine_docs LLM calls for this name.
        range: integer
        ifabsent: int(0)
      # --- Run provenance ---
      last_run_id:
        description: >-
          UUID of the ``sn run`` invocation that last produced or
          regenerated this name. Allows downstream review runs to
          identify which pipeline invocation created a name.
      last_run_at:
        description: >-
          ISO 8601 timestamp of the ``sn run`` invocation that last
          produced or regenerated this name. Paired with
          ``last_run_id`` for temporal queries.
        range: datetime
      # --- Regeneration tracking ---
      regen_count:
        description: >-
          Number of review→regen cycles this name has been through.
          0 for fresh names; incremented by the regen pass in
          ``sn run``. Hard cap at 1 prevents
          infinite regeneration loops on persistently poor scorers.
        range: integer
        ifabsent: int(0)
      refine_reason:
        description: >-
          Reviewer comments that triggered the last refinement cycle.
          Captured from ``reviewer_comments_name`` at refine time so the
          reason survives subsequent review overwrites.
      # --- Grammar parse provenance (imas-standard-names >= 0.7.0rc21) ---
      grammar_parse_version:
        description: >-
          Version of ``imas-standard-names`` used when the ISN parser
          last processed this name (e.g. ``"0.7.0rc21"``). Stamped at
          write time with ``imas_standard_names.__version__``. Enables
          staleness checks when the grammar parser is upgraded.
          ``null`` means parse has not been run.
        range: string
      validation_diagnostics_json:
        description: >-
          JSON-serialised list of parser diagnostics from the last ISN
          parse, one object per diagnostic with keys: ``category``,
          ``layer``, ``message``, ``suggestion``, ``severity``.
          An empty JSON array (``"[]"``) means no diagnostics were
          emitted; ``null`` means the ISN parse has not run yet.
          Grammar decomposition is derived on demand via
          ``imas_standard_names.grammar.parser.parse()``; per-segment
          properties are no longer stored on the node.
        range: string
      # --- REFERENCES relationship (enrich link graph) ---
      references:
        description: >-
          Other StandardName nodes this name references via name:x
          markers in its documentation. Created by enrich PERSIST
          to build a cross-reference graph between related concepts.
        multivalued: true
        range: StandardName
        inlined: false
        annotations:
          relationship_type: REFERENCES
      # --- Derivation relationship slots ---
      parents:
        description: >-
          StandardName parent nodes — names this entry belongs to as a
          structural child via one ISN grammar layer (qualifier, locus,
          projection, unary prefix/postfix, or binary operand). Direction:
          (child)-[:HAS_PARENT]->(parent). Emitted by derive_edges() for
          every derivation layer. Populated in the tail pass after all nodes
          in a batch are written. Forward-referenced targets are subject to
          the admission gate (see imas_codex/standard_names/parents.py) —
          inadmissible parents (bare-base scalars like ``pressure``) are
          NOT created as placeholder nodes; the edge is dropped.
          Exported as ``arguments`` in the ISN catalog format. Reuses the
          ``HAS_PARENT`` relationship convention from IMASNode hierarchy
          (imas_dd.yaml::parent_path) — different node labels, same
          semantic.
        multivalued: true
        range: StandardName
        inlined: false
        annotations:
          relationship_type: HAS_PARENT
      magnitudes:
        description: >-
          StandardName vector parents whose magnitude this entry expresses.
          Materialised passively at write time when this name matches the
          pattern ``magnitude_of_<X>`` AND ``X`` is an admitted vector
          parent in the graph. Direction:
          (magnitude_scalar)-[:MAGNITUDE_OF]->(vector_parent). Never
          speculatively created — source-driven only (DD path or signal
          must compose the magnitude name). Captures the algebraic
          vector ⇔ magnitude relationship without auto-generating
          companion SNs.
        multivalued: true
        range: StandardName
        inlined: false
        annotations:
          relationship_type: MAGNITUDE_OF
      error_siblings:
        description: >-
          StandardName nodes that are uncertainty variants of this name
          (upper/lower/index error forms). Direction: parent → sibling.
          Emitted for names whose outermost operator is upper_uncertainty,
          lower_uncertainty, or uncertainty_index.
        multivalued: true
        range: StandardName
        inlined: false
        annotations:
          relationship_type: HAS_ERROR
      predecessor:
        description: >-
          The standard name this entry supersedes (deprecation lineage).
          Scalar — a name has at most one direct predecessor. Derived from
          the deprecates scalar at write time.
        range: StandardName
        inlined: false
        annotations:
          relationship_type: HAS_PREDECESSOR
      successor:
        description: >-
          The standard name that supersedes this entry (deprecation lineage).
          Scalar — a name has at most one direct successor. Derived from the
          superseded_by scalar at write time.
        range: StandardName
        inlined: false
        annotations:
          relationship_type: HAS_SUCCESSOR
      primary_cluster_ref:
        description: >-
          Primary semantic cluster this standard name belongs to. Derived from
          the primary_cluster_id scalar at write time via IN_CLUSTER edge.
        range: IMASSemanticCluster
        inlined: false
        annotations:
          relationship_type: IN_CLUSTER
      reviews:
        description: >-
          StandardNameReview nodes attached to this StandardName via HAS_REVIEW.
          Direction: (StandardName)-[:HAS_REVIEW]->(StandardNameReview).
          Matches the HAS_* ownership convention (HAS_UNIT, HAS_COCOS, etc.).
        multivalued: true
        range: StandardNameReview
        inlined: false
        annotations:
          relationship_type: HAS_REVIEW
      docs_revisions:
        description: >-
          Linked DocsRevision snapshot nodes in the docs refinement chain.
          Each refine_docs run appends a new DocsRevision. Walk this edge
          to retrieve the full documentation history for prompt context.
        multivalued: true
        range: DocsRevision
        inlined: false
        annotations:
          relationship_type: DOCS_REVISION_OF
      docs_review_admission:
        description: >-
          Active priced documentation-review authority. The scalar id and
          HAS_DOCS_REVIEW_ADMISSION edge are created atomically with staging
          and cleared only by terminal consumption or exact rollback.
        range: DocsReviewAdmission
        inlined: false
        annotations:
          relationship_type: HAS_DOCS_REVIEW_ADMISSION
      refined_from:
        description: >-
          The predecessor StandardName node this entry was refined from.
          Created by persist_refined_name via ``MERGE (new)-[:REFINED_FROM]->(old)``.
          Scalar — a refined name has exactly one direct predecessor.
          Walk this chain to retrieve the full name refinement history.
        range: StandardName
        inlined: false
        annotations:
          relationship_type: REFINED_FROM
      loci:
        description: >-
          Locus nodes grouping standard names that share the same ISN locus
          qualifier (e.g. magnetic_axis, plasma_boundary). Direction:
          (StandardName)-[:HAS_LOCUS]->(Locus). Emitted by derive_edges() for
          locus-qualified names (see imas_codex/standard_names/derivation.py)
          and persisted by _write_standard_name_edges. The HAS_LOCUS edge
          carries ``locus_token`` and ``locus_relation`` properties on the
          Cypher edge (LinkML does not model edge properties).
        multivalued: true
        range: Locus
        inlined: false
        annotations:
          relationship_type: HAS_LOCUS
      # --- sn edit steering (human/agent proposals) ---
      edit_mode:
        description: >-
          How the attached edit steers the pipeline — hint (direction
          injected into generate/refine), rename (full replacement name,
          skips generation), or docs (full replacement documentation,
          skips generation). Null when no edit is attached.
        range: EditMode
      name_hint:
        description: >-
          Edit-steering payload for the name axis. In hint mode, a proposed
          direction injected into generate_name/refine_name prompts. In
          rename mode, the full replacement name that skips generation and
          rides straight into name review. Null when no name-axis edit is
          attached.
        range: string
      docs_hint:
        description: >-
          Edit-steering payload for the docs axis. In hint mode, a proposed
          direction injected into generate_docs/refine_docs prompts. In
          docs mode, the full replacement documentation that skips
          generation and rides straight into docs review. Null when no
          docs-axis edit is attached.
        range: string
      edit_reason:
        description: >-
          Mandatory justification for the attached edit. Injected into
          generate/refine prompts (hint mode) AND into the review gate
          (both hint and rename/docs modes) to neutralize the reviewer's
          revert-to-original pull. Required whenever edit_mode is set.
        range: string
      edit_origin:
        description: >-
          Who proposed the attached edit — human or agent. Distinct from
          the implicit LLM authorship of reviewer_suggested_name.
        range: EditOrigin
      edit_status:
        description: >-
          Lifecycle of the attached edit. Set to 'open' when the edit is
          attached, transitions to 'applied' when review accepts the
          steered candidate, 'exhausted' when the refine rotation cap is
          hit first, or 'rejected' when review terminally scores it below
          threshold. Null when no edit has ever been attached.
        range: EditStatus
      edit_scope:
        description: >-
          Blast radius of the attached edit — only_self, family, or
          subtree. Recorded at attach time so the rename cascade can be
          applied to the correct set of descendants once the root edit's
          review accepts it.
        range: EditScope
      edit_requested_at:
        description: >-
          ISO 8601 timestamp when the edit was attached via
          `imas-codex sn edit`. Null when no edit has ever been attached.
        range: datetime
      edit_override_edits:
        description: >-
          Cascade authorization recorded at edit-attach time: when true, the
          rename cascade may overwrite descendants carrying protected
          (catalog_edit) human edits. Defaults to false — a rename that did
          not explicitly opt in must not silently clobber curator edits when
          the root rename is accepted. Read back and honoured by the cascade
          preflight in persist_reviewed_name.
        range: boolean
      edit_include_accepted:
        description: >-
          Cascade authorization recorded at edit-attach time: when true, the
          rename cascade may rename descendants whose name_stage is
          'accepted' (catalog-authoritative). Defaults to false. Read back and
          honoured by the cascade preflight at acceptance time.
        range: boolean

  Locus:
    description: >-
      A shared ISN locus token (e.g. magnetic_axis, plasma_boundary,
      separatrix) that groups locus-qualified standard names. Created by
      the standard-name derivation layer when a name carries a locus
      qualifier; each StandardName sharing that locus links to the same
      Locus node via HAS_LOCUS.

      Inbound relationships:
        - (StandardName)-[:HAS_LOCUS]->(Locus)

      Example Cypher:
        MATCH (sn:StandardName)-[:HAS_LOCUS]->(loc:Locus {id: 'magnetic_axis'})
        RETURN sn.id
    class_uri: sn:Locus
    attributes:
      id:
        identifier: true
        description: >-
          The locus token string (e.g. "magnetic_axis", "plasma_boundary").
          Globally unique — loci are shared across standard names.
        required: true
      description:
        description: Human-readable description of this locus.

  DocsReviewAdmission:
    description: >-
      Durable fail-closed authority for one priced documentation review. Its
      identifier is derived from scope_id, so one scope cannot authorize two
      targets. The record binds rendered request identity, content evidence,
      provider exposure, worker claim, prior aggregate authority, and the
      exact Review group created by the authorized sequence.
    class_uri: sn:DocsReviewAdmission
    attributes:
      id:
        identifier: true
        required: true
        description: SHA-256 identity derived from the exact scope id.
      target_id:
        required: true
        description: Exact StandardName id authorized by this admission.
      scope_id:
        required: true
        description: Exact run scope; globally unique across admission targets.
      request_identity:
        required: true
        description: SHA-256 identity of the canonical rendered request and pricing inputs.
      docs_hash:
        required: true
        description: SHA-256 digest of description and documentation content at staging.
      review_input_hash:
        required: true
        description: SHA-256 digest of the complete review input at staging.
      mandatory_exposures_json:
        required: true
        description: JSON array of priced mandatory reviewer exposures in dispatch order.
      conditional_exposure:
        required: true
        range: float
        description: Conservatively bounded exposure for the possible escalator call.
      expected_exposure:
        required: true
        range: float
        description: Total mandatory plus conditional exposure reserved at admission.
      claim_token:
        description: Exact worker claim token bound before provider dispatch.
      claim_seq:
        range: integer
        description: Exact worker claim sequence bound before provider dispatch.
      claimed_at:
        range: datetime
        description: Timestamp when the exact worker claim was bound.
      prior_docs_stage:
        required: true
        description: Terminal documentation stage present before recovery staging.
      prior_authority_json:
        required: true
        description: JSON snapshot of every docs-axis aggregate authority field.
      review_group_id:
        required: true
        description: Deterministic owner id for Reviews created by this admission.
      created_review_ids:
        multivalued: true
        range: string
        description: Exact Review ids atomically created or matched by terminal persistence.
      created_reviews:
        description: StandardNameReview records owned exclusively by this admission.
        multivalued: true
        range: StandardNameReview
        inlined: false
        annotations:
          relationship_type: CREATED_REVIEW
      status:
        required: true
        range: DocsReviewAdmissionStatus
      receipt_identity:
        required: true
        description: SHA-256 identity of the immutable admission receipt payload.
      created_at:
        required: true
        range: datetime
      expires_at:
        required: true
        range: datetime
        description: Latest instant at which provider dispatch may begin.
      dispatch_verified_at:
        range: datetime
        description: Timestamp of the transactional pre-provider identity verification.
      completed_at:
        range: datetime
        description: Timestamp when terminal authority was atomically consumed.
      rolled_back_at:
        range: datetime
        description: Timestamp when exact prior authority was restored.
      final_authority_json:
        description: JSON snapshot of terminal docs authority written on consumption.

  DocsRevision:
    description: >-
      Snapshot of documentation state when refine_docs creates a new revision.
      Linked from StandardName via DOCS_REVISION_OF (chain). Each revision
      captures the full documentation state at that point in time, enabling
      full history retrieval for prompt context and audit.
    class_uri: sn:DocsRevision
    attributes:
      id:
        identifier: true
        description: >-
          Composite key (sn_id#rev-N) where N is the revision number.
        required: true
      sn_id:
        description: >-
          StandardName id this revision belongs to. Denormalised for query
          convenience; the authoritative link is the DOCS_REVISION_OF edge.
      revision_number:
        description: >-
          Zero-based revision index within the chain. Equals the SN
          docs_chain_length at the time this snapshot was created.
        range: integer
      description:
        description: >-
          Snapshot of the SN description text at this revision.
      documentation:
        description: >-
          Snapshot of the documentation text at this revision.
      model:
        description: >-
          Model that generated the docs captured in this revision.
      generated_at:
        description: >-
          When the docs captured in this revision were generated.
        range: datetime
      reviewer_score_docs:
        description: >-
          Reviewer score for this docs revision (0-1).
        range: float
      reviewer_comments_per_dim_docs:
        description: >-
          Per-dimension reviewer comments JSON for this revision.
      reviewer_comments_docs:
        description: >-
          Aggregated reviewer comments for this revision.
      created_at:
        description: >-
          When this revision snapshot was created.
        range: datetime

  StandardNameChange:
    description: >-
      A non-indexed internal change event (rename, domain reclassification,
      supersede) recorded against a StandardName for traceability, WITHOUT
      minting a new StandardName. Linked from the affected name via
      HAS_INTERNAL_CHANGE. History belongs here, not on REFINED_FROM chains.

      Example Cypher:
        MATCH (sn:StandardName {id: $name})-[:HAS_INTERNAL_CHANGE]->(c:StandardNameChange)
        RETURN c.operation, c.from_name, c.to_name, c.changed_at
    class_uri: sn:StandardNameChange
    attributes:
      id:
        identifier: true
        required: true
        description: "Composite key: sn-change:{uuid}"
      from_name:
        description: The name (or value) before the change.
      to_name:
        description: The name (or value) after the change; the linked StandardName id.
      operation:
        description: >-
          The change operation (e.g. reclassify_domain, rename, supersede).
      reason:
        description: Human/edit-supplied rationale for the change.
      origin:
        description: What initiated the change (pipeline phase, edit, cascade).
      run_id:
        description: The SNRun that produced the change, when applicable.
      changed_at:
        description: When the change was recorded.
        range: datetime
      internal:
        description: Always true — marks this as an internal (non-indexed) event.
        range: boolean

  VocabGap:
    description: >-
      Records a missing grammar token identified during standard name composition.
      Linked via HAS_STANDARD_NAME_VOCAB_GAP from the blocked StandardNameSource
      (source-first, one hop — used by reconcile) and from the underlying DD path
      / facility signal entity (the DD-catalog view). The node stores the
      normalized gap concept; per-source evidence (reason, observed_at) lives on
      the relationships.

      Example Cypher:
        MATCH (vg:VocabGap) RETURN vg.segment, vg.token, vg.example_count
        MATCH (s:StandardNameSource)-[:HAS_STANDARD_NAME_VOCAB_GAP]->(vg:VocabGap) RETURN s.id, vg.id
        MATCH (n:IMASNode)-[:HAS_STANDARD_NAME_VOCAB_GAP]->(vg:VocabGap) RETURN n.id, vg.id
    class_uri: sn:VocabGap
    attributes:
      id:
        identifier: true
        description: >-
          Format: vocab_gap:{segment}:{token}
          Example: vocab_gap:transformation:time_derivative_of
        required: true
      segment:
        description: Grammar segment missing the token (transformation, process, subject, etc.)
        required: true
      token:
        description: The token that should exist in the grammar vocabulary
        required: true
      example_count:
        description: Number of source paths that reported needing this token
        range: integer
      first_seen_at:
        description: When this gap was first identified
        range: datetime
      last_seen_at:
        description: When this gap was most recently reported
        range: datetime
      category:
        description: >-
          Gap classification: absent (true gap), wrong_slot_placement
          (token exists in a different segment), or ambiguous_known_token
          (token found in multiple segments).
        range: VocabGapCategory
      actual_segments:
        description: >-
          Closed-vocabulary segments that actually contain this token.
          Populated when category is wrong_slot_placement or
          ambiguous_known_token; empty for absent gaps.
        multivalued: true
      nearest_token:
        description: >-
          Nearest registered same-segment token found by the compose-time
          token-reuse check (cosine-nearest in the segment's vocabulary).
          Populated when the proposed token was flagged as a likely synonym.
      nearest_similarity:
        description: >-
          Cosine similarity (0-1) between the proposed token and nearest_token
          at the compose-time dedup check.
        range: float
      dedup_decision:
        description: >-
          Adjudication of the compose-time token-reuse check for this gap.
          distinct_confirmed = the agent re-emitted the gap after being shown
          the near-token; unchecked = no check fired.
        range: VocabGapDedupDecision
      editorial_disposition:
        description: >-
          Reviewed vocabulary action, independent of observation category and
          compose-time dedup evidence.
        range: VocabGapDisposition
      editorial_target:
        description: >-
          Canonical token or composed expression for add and fold decisions.
      editorial_reason:
        description: Evidence-backed rationale for the editorial decision.
      editorial_actor:
        description: Operator or review authority that applied the decision.
      editorial_at:
        description: When the active editorial decision was applied.
        range: datetime
      editorial_grammar_signature:
        description: >-
          Digest of the complete grammar vocabulary against which the decision
          was made. Used to identify decisions that need explicit invalidation
          after grammar changes.
      editorial_grammar_version:
        description: ISN package version installed when the decision was applied.
      editorial_active:
        description: >-
          Whether the editorial decision is active. Explicit signature reset
          deactivates a decision without erasing its audit fields.
        range: boolean
      editorial_invalidated_at:
        description: When an explicit grammar-signature reset deactivated it.
        range: datetime
      editorial_invalidation_actor:
        description: Operator or review authority that invalidated the decision.
      editorial_invalidation_reason:
        description: Why the grammar change requires fresh editorial review.
      editorial_invalidation_grammar_signature:
        description: Grammar signature in force when the decision was invalidated.
      reconciled_at:
        description: >-
          Timestamp when reconcile_vocab_gaps last reclassified this gap
          against the current ISN vocabulary. Null until a reconcile pass
          updates the gap's category/actual_segments.
        range: datetime
      reuse_target:
        description: >-
          The registered token a mechanical reuse check derived for this
          proposal. Set with dedup_decision=reuse_confirmed.
      reuse_mechanism:
        description: >-
          Which mechanical check derived the target: structural_suffix,
          word_order, or settled_synonym.
      reuse_detail:
        description: >-
          One clause explaining the derivation, mirrored into retry guidance.
      triage:
        description: >-
          Lifecycle bucket assigned by triage_vocab_gaps.
        range: VocabGapTriage
      triaged_at:
        description: When the triage pass last stamped this node.
        range: datetime
      evidence:
        description: Immutable observations that reported this gap.
        multivalued: true
        range: VocabGapEvidence
        annotations:
          relationship_type: HAS_EVIDENCE

  VocabGapEvidence:
    description: >-
      One source observation of a vocabulary gap. Repeated reports create
      distinct evidence nodes so reasons and timestamps remain auditable even
      when the normalized VocabGap is observed again.
    class_uri: sn:VocabGapEvidence
    attributes:
      id:
        identifier: true
        required: true
        description: "Composite key: vocab-gap-evidence:{uuid}"
      source_id:
        required: true
        description: Source entity identifier that reported the gap.
      vocab_gap_id:
        required: true
        description: Normalized gap identity observed by this evidence record.
      segment:
        required: true
        description: Grammar segment reported by the observation.
      token:
        required: true
        description: Proposed grammar token reported by the observation.
      source_type:
        required: true
        range: StandardNameSourceType
        description: Source namespace, currently dd or signals.
      description:
        required: true
        description: Human-readable source-specific explanation of the observation.
      reason:
        required: true
        description: Source-specific explanation supplied with the observation.
      observed_at:
        required: true
        range: datetime
        description: When this observation was recorded.

  DDGapObservation:
    description: >-
      Immutable evidence payload for one distinct source, rule, value, and
      argument. Re-reporting identical evidence updates last_observed_at without
      erasing the first observation; changed evidence creates a new node.
    class_uri: sn:DDGapObservation
    attributes:
      id:
        identifier: true
        required: true
        description: "Content-addressed identity: dd_gap_observation:{sha256}"
      dd_gap_id:
        required: true
        description: DDGap fact observed by this evidence record.
      source_path:
        required: true
        description: Exact IMASNode path that supplied the evidence.
      reason:
        required: true
        description: Evidence-backed argument supplied by the reporter.
      reporter:
        required: true
        description: Audit, pipeline seat, model, or human that reported the evidence.
      observed_dd_version:
        description: Exact published DD version in which the value was observed.
      observed_value:
        description: Raw DD declaration observed by the reporter.
      expected_value:
        description: Value the evidence says a corrected DD should publish.
      evidence_rule:
        range: DDGapEvidenceRule
        description: Structured predicate supporting release reconciliation.
      reference_path:
        description: Optional exact DD path used as comparison evidence.
      reference_value:
        description: Raw value observed at reference_path.
      first_observed_at:
        required: true
        range: datetime
        description: When this exact evidence payload was first observed.
      last_observed_at:
        required: true
        range: datetime
        description: When this exact evidence payload was most recently observed.

  DDGapStateChange:
    description: >-
      Immutable audit event created by a successful compare-and-set DD-gap
      lifecycle transition.
    class_uri: sn:DDGapStateChange
    attributes:
      id:
        identifier: true
        required: true
        description: "Unique identity: dd_gap_state_change:{uuid}"
      dd_gap_id:
        required: true
        description: DDGap fact whose state changed.
      from_status:
        required: true
        range: DDGapStatus
      to_status:
        required: true
        range: DDGapStatus
      actor:
        required: true
        description: Human authority or governed release reconciler applying the change.
      reason:
        required: true
        description: Evidence-backed justification for the lifecycle change.
      changed_at:
        required: true
        range: datetime
      upstream_url:
        description: HTTPS upstream issue or change URL attached by this transition.
      resolved_dd_version:
        description: Exact published DD version proven to correct the fact.
      validation_evidence:
        description: Structured or human validation result proving a resolution.

  DDGapIdentityChange:
    description: >-
      Immutable audit event recording an in-place DDGap identity
      reclassification while preserving the fact's lifecycle and evidence.
    class_uri: sn:DDGapIdentityChange
    attributes:
      id:
        identifier: true
        required: true
        description: "Unique identity: dd_gap_identity_change:{uuid}"
      dd_gap_id:
        required: true
        description: Current DDGap identity immediately after this reclassification.
      old_id:
        required: true
        description: DDGap identity immediately before this reclassification.
      new_id:
        required: true
        description: DDGap identity immediately after this reclassification.
      old_kind:
        required: true
        range: DDGapKind
      new_kind:
        required: true
        range: DDGapKind
      changed_at:
        required: true
        range: datetime
      changed_by:
        required: true
        description: Governed mechanism applying the identity reclassification.
      reason:
        required: true
        description: Evidence-backed justification for the identity change.

  DDResolution:
    description: >-
      One exact, version-bound bridge from a corrected IMASNode declaration to
      the DDGap fact that proves the published declaration is defective. The
      corrected graph value remains directly usable while this node preserves
      the published value, effective value, upstream disposition, retirement
      boundary, and plain human audit trail.

      Example Cypher:
        MATCH (n:IMASNode)-[:BRIDGED_BY]->(r:DDResolution)-[:EVIDENCED_BY]->(g:DDGap)
        RETURN n.id, r.published_value, r.effective_value, r.dd_version, g.id
    class_uri: sn:DDResolution
    attributes:
      id:
        identifier: true
        required: true
        description: "Content-addressed identity: dd_resolution:{sha256}"
      path:
        required: true
        description: Exact IDS-prefixed DD path; patterns and aliases are forbidden.
      dd_version:
        required: true
        description: One exact published DD version; ranges and latest aliases are forbidden.
      field:
        required: true
        range: DDResolutionField
      published_kind:
        required: true
        range: DDResolutionValueKind
      published_value:
        required: true
        description: Canonical JSON for the value published by this DD release.
      effective_kind:
        required: true
        range: DDResolutionValueKind
      effective_value:
        required: true
        description: Canonical JSON for the separately reviewed effective typed value.
      reason:
        required: true
        description: Physics or schema justification for bridging the declaration.
      recorded_by:
        required: true
        description: Human authority that recorded the reviewed bridge.
      recorded_at:
        required: true
        range: datetime
      upstream_reference:
        required: true
        description: >-
          Official upstream change reference, or the literal none-yet marker
          when no upstream filing exists.
      upstream_commit_reference:
        required: true
        description: Exact upstream commit reference, or the literal none-yet marker.
      retiring_release:
        required: true
        description: DD release expected to retire the bridge, or none-yet.
      source_manifest_digest:
        required: true
        description: Digest of the packaged source used for this one-time port.
      status:
        required: true
        range: DDResolutionStatus
      corrected_node:
        required: true
        range: string
        description: Exact corrected IMASNode identity carrying this bridge.
      evidence:
        required: true
        range: string
        description: Exact DDGap fact proving the published declaration is defective.
        annotations:
          relationship_type: EVIDENCED_BY
          target_label: DDGap
      for_dd_version:
        required: true
        range: string
        annotations:
          relationship_type: FOR_DD_VERSION
          target_label: DDVersion

  DDGap:
    description: >-
      Records evidence that a Data Dictionary path or path pattern carries a
      defective declaration. One node represents one (path, kind) fact.
      Repeated observations increase example_count; the reporter's argument
      and observation time live on HAS_DD_GAP relationships. Flagging is
      observational only: enforcement remains in the existing curated
      registries until human triage changes it.

      Example Cypher:
        MATCH (g:DDGap) RETURN g.path, g.kind, g.status, g.example_count
        MATCH (n:IMASNode)-[r:HAS_DD_GAP]->(g:DDGap) RETURN n.id, r.reason, g.id
    class_uri: sn:DDGap
    attributes:
      id:
        identifier: true
        required: true
        description: "Composite key: dd_gap:{path}:{kind}"
      path:
        required: true
        description: Exact DD path or registry path pattern carrying the defect.
      kind:
        required: true
        range: DDGapKind
      status:
        required: true
        range: DDGapStatus
      example_count:
        description: Number of independent observations of this fact.
        range: integer
      first_seen_at:
        description: When the fact was first reported.
        range: datetime
      last_seen_at:
        description: When the fact was most recently reported.
        range: datetime
      observed_dd_version:
        description: Exact DD version from the most recently observed evidence payload.
      observed_value:
        description: Raw declaration from the most recently observed evidence payload.
      expected_value:
        description: Expected corrected declaration from the latest evidence payload.
      evidence_rule:
        range: DDGapEvidenceRule
        description: Latest structured predicate available for reconciliation.
      reference_path:
        description: Optional exact DD comparison path from the latest evidence.
      reference_value:
        description: Raw declaration observed at reference_path.
      triaged_at:
        description: When a human last dispositioned the fact.
        range: datetime
      triage_actor:
        description: Human authority that most recently triaged the fact.
      triage_reason:
        description: Evidence-backed reason for the most recent human disposition.
      status_changed_at:
        description: When the lifecycle status most recently changed.
        range: datetime
      status_changed_by:
        description: Human authority or governed reconciler that changed the status.
      status_change_reason:
        description: Reason recorded with the most recent lifecycle change.
      validation_evidence:
        description: Validation result supporting resolved_upstream.
      upstream_url:
        description: Upstream DD issue or change URL, when filed.
      resolved_dd_version:
        description: DD version that corrected the declaration.
      registry_backend:
        description: >-
          Existing enforcement registry that represents this defect. Presence
          is provenance only; DDGap nodes do not themselves suppress behavior.
      affected_path_count:
        description: Number of current IMASNode paths matched by a registry pattern.
        range: integer
      observations:
        description: Durable history of distinct evidence payloads for this fact.
        multivalued: true
        range: DDGapObservation
        annotations:
          relationship_type: HAS_OBSERVATION
      state_changes:
        description: Immutable compare-and-set lifecycle transition history.
        multivalued: true
        range: DDGapStateChange
        annotations:
          relationship_type: HAS_STATE_CHANGE
      identity_changes:
        description: Immutable history of governed identity reclassifications.
        multivalued: true
        range: DDGapIdentityChange
        annotations:
          relationship_type: HAS_IDENTITY_CHANGE
  StandardNameSource:
    description: >-
      Tracks an individual source entity (DD path or facility signal) through
      the standard name composition pipeline. Graph-primary state machine —
      all pipeline progress is persisted here, not in memory.

      Example Cypher:
        MATCH (sns:StandardNameSource {source_type: 'dd', status: 'extracted'})
        RETURN sns.source_id, sns.batch_key

        MATCH (sns:StandardNameSource)-[:PRODUCED_NAME]->(sn:StandardName)
        RETURN sns.source_id, sn.id
    class_uri: sn:StandardNameSource
    attributes:
      id:
        identifier: true
        description: >-
          Composite key: source_type + ":" + source_id.
          DD: "dd:equilibrium/time_slice/profiles_1d/psi"
          Signal: "signals:tcv:ip/measured"
        required: true
      source_type:
        description: Type of source entity (dd or signals)
        range: StandardNameSourceType
        required: true
      source_id:
        description: >-
          Original entity identifier. DD path (bare) or signal ID (facility:path).
        required: true
      batch_key:
        description: >-
          Grouping key for LLM composition batches.
          DD: "{cluster_label}:{unit}" or "unclustered:{ids_name}:{unit}"
          Signals: "{physics_domain}:{diagnostic}:{unit}"
      status:
        description: Current lifecycle status
        range: StandardNameSourceStatus
        required: true
      created_at:
        description: >-
          Timestamp when this source node was first created in the graph.
          Set ON CREATE by the batch/derived-parent materialisers.
        range: datetime
      claimed_at:
        description: Timestamp when a worker claimed this source for processing
        range: datetime
      drain_scope_id:
        description: >-
          Ephemeral owner of one exact bounded manifest drain. This is never
          used as production provenance and never replaces run_id.
      drain_scope_claimed_at:
        description: >-
          Heartbeat timestamp for drain_scope_id. This lease is independent of
          the worker claimed_at/claim_token pair.
        range: datetime
      drain_scope_paths:
        description: Exact DD paths that admitted this source to the bounded drain.
        multivalued: true
      drain_claim_scope_id:
        description: >-
          Ephemeral bounded-drain owner written atomically with a worker claim.
      drain_scope_actionable:
        description: >-
          Ephemeral bounded-drain eligibility. Set only on exact DD sources
          that the owning drain may compose and removed with the scope lease.
        range: boolean
      claim_token:
        description: UUID token for claim verification
      claim_seq:
        description: >-
          Monotonic claim counter incremented whenever a worker claims this
          source. Combined with claim_token to fence delayed duplicate workers;
          legacy rows with no value start at one on their next claim.
        range: integer
      attempt_count:
        description: Number of composition attempts (for durable retry)
        range: integer
      compose_hint:
        description: >-
          Operator steering for composition of this exact DD source. This text
          is non-authoritative: it cannot override the pinned DD snapshot,
          unit, COCOS convention, physics domain, or grammar validation.
      compose_hint_reason:
        description: >-
          Operator justification for the exact-source composition steering.
          Kept separate from last_error and retry-event reasons so failures and
          retries cannot erase or reinterpret the requested intent.
      compose_hint_status:
        description: Lifecycle of the exact-source composition steering.
        range: ComposeHintStatus
      compose_hint_requested_at:
        description: Timestamp when the current exact-source steering was opened.
        range: datetime
      compose_hint_consumed_at:
        description: >-
          Timestamp when the exact fenced source successfully bound a candidate.
          Cleared when an operator replaces an open hint.
        range: datetime
      retry_events:
        description: >-
          Durable operator-requested releases of a terminal composition failure,
          an attempt-capped source, or an explicitly selected skipped source.
          Each event records the source state and error before exclusion and
          attempt state are reset, so restoring claimability never erases why
          the source was parked.
        multivalued: true
        range: StandardNameSourceRetry
        inlined: false
        annotations:
          relationship_type: HAS_RETRY_EVENT
      snapshot_changes:
        description: >-
          Immutable governed migrations of this source's pinned DD snapshot.
          Each event records complete canonical before/after payloads and the
          authority and preservation hashes proven by the atomic transaction.
        multivalued: true
        range: StandardNameSourceSnapshotChange
        inlined: false
        annotations:
          relationship_type: HAS_SNAPSHOT_CHANGE
      identity_repairs:
        description: >-
          Immutable governed repairs of the source identity scalar. The
          existing DD relationship and every source snapshot property remain
          unchanged by this transition.
        multivalued: true
        range: StandardNameSourceIdentityRepair
        inlined: false
        annotations:
          relationship_type: HAS_IDENTITY_REPAIR
      snapshot_adoptions:
        description: >-
          Immutable governed adoptions of current DD authority when the source
          already names that exact DD version but its complete snapshot differs.
        multivalued: true
        range: StandardNameSourceSnapshotAdoption
        inlined: false
        annotations:
          relationship_type: HAS_SNAPSHOT_ADOPTION
      unit_cache_corrections:
        description: >-
          Immutable governed corrections of only the non-authoritative DD unit
          cache from a uniquely current DD node and HAS_UNIT relationship. The
          source's pinned historical DD version and every other snapshot field
          remain unchanged.
        multivalued: true
        range: StandardNameSourceUnitCacheCorrection
        inlined: false
        annotations:
          relationship_type: HAS_UNIT_CACHE_CORRECTION
      snapshot_admissions:
        description: >-
          Immutable governed admissions of a previously unpinned source to the
          uniquely current complete DD snapshot.
        multivalued: true
        range: StandardNameSourceSnapshotAdmission
        inlined: false
        annotations:
          relationship_type: HAS_SNAPSHOT_ADMISSION
      identity_folds:
        description: >-
          Immutable governed retirements of a duplicate DD source identity in
          favor of this canonical source. No semantic targets move between the
          two source rows.
        multivalued: true
        range: StandardNameSourceIdentityFold
        inlined: false
        annotations:
          relationship_type: HAS_IDENTITY_FOLD
      authority_retirements:
        description: >-
          Immutable governed retirements of sources whose backing DD node is
          outside standard-name participation.
        multivalued: true
        range: StandardNameSourceAuthorityRetirement
        inlined: false
        annotations:
          relationship_type: HAS_AUTHORITY_RETIREMENT
      last_error:
        description: Error message from most recent failed attempt
      failed_at:
        description: Timestamp of terminal failure
        range: datetime
      composed_at:
        description: Timestamp when composition succeeded
        range: datetime
      dd_path:
        description: >-
          For DD sources, links to the IMASNode via FROM_DD_PATH relationship.
          Value is the IMASNode id (bare DD path).
        annotations:
          relationship_type: FROM_DD_PATH
          target_label: IMASNode
      signal:
        description: >-
          For signal sources, links to the FacilitySignal via FROM_SIGNAL relationship.
          Value is the FacilitySignal id (facility:path).
        annotations:
          relationship_type: FROM_SIGNAL
          target_label: FacilitySignal
      standard_name:
        description: The StandardName produced by composing this source
        range: StandardName
        annotations:
          relationship_type: PRODUCED_NAME
      vocab_gaps:
        description: >-
          VocabGap nodes whose missing tokens block this source's composition,
          set when the source is retired to status='vocab_gap'. A direct,
          source-first link to the canonical gap record (the DD IMASNode /
          FacilitySignal entity carries the same edge for the DD-catalog view).
          "Why is this source blocked?" is then a one-hop query returning the
          actual VocabGap node(s); reconcile_vocab_gaps revives the source when
          this edge is gone. Only genuinely-absent closed-segment gaps produce a
          node — non-actionable composer mis-reports do not.
        multivalued: true
        range: VocabGap
        annotations:
          relationship_type: HAS_STANDARD_NAME_VOCAB_GAP
      produced_sn_id:
        description: >-
          ID of the StandardName this source produced (composed or
          auto-attached). Scalar property mirror of the PRODUCED_NAME
          relationship — set in the same transaction the edge is MERGEd.
          Enables recovery of the edge if MERGE fails silently (e.g. when
          the target StandardName was not persisted) and simplifies
          bulk queries that only need the target id.
      provenance:
        description: >-
          Value-provenance / estimator of this source path, from the ISN
          value-provenance controlled vocabulary
          (``measured`` | ``reconstructed`` | ``reference``). Null when the
          path is not a value-provenance facet. This is LINK metadata: the
          measured / reconstructed / reference facets of the same physical
          quantity collapse onto ONE StandardName (many sources -> one name),
          with the estimator recorded here and NEVER emitted in the name.
          Treated like unit/cocos — DD/ISN-authoritative, injected at link
          time. Validated against
          ``imas_standard_names.value_provenance_terms()``; never a codex enum
          (ISN owns the vocabulary).
          Query: MATCH (sns:StandardNameSource {provenance: 'measured'})
                 -[:PRODUCED_NAME]->(sn:StandardName) RETURN sn.id
      embedding:
        description: Vector embedding for semantic search
        multivalued: true
        range: float
      embedded_at:
        description: When embedding was last computed
        range: datetime
      description:
        description: Human-readable description of this source entity
      skip_reason:
        description: >-
          Machine-readable skip classification (e.g.
          'dd_unit_unresolvable', 'dd_unit_ambiguous',
          'dd_unit_context_dependent'). Set when status='skipped'.
      skip_reason_detail:
        description: >-
          Human-readable detail for the skip (e.g. the raw DD unit string,
          the conflicting parent/child units). Set when status='skipped'.
      vocab_gap_grammar_signature:
        description: >-
          Digest of the ISN grammar vocabulary in force when this source was
          parked at ``status='vocab_gap'``. A parked source is blocked on a
          token the composer asked for, but that request is frequently the
          wrong spelling of a capability the vocabulary expresses another way —
          so waiting for the exact token to appear strands it forever. The
          reconcile compares this stamp against the live vocabulary digest and
          grants one retry per vocabulary change; re-stamping it makes the pass
          idempotent at a fixed vocabulary. ``null`` means the source was
          parked before the stamp existed and is due one retry.
      dd_version:
        description: >-
          DD version at extraction time. Records which DD snapshot was
          queried for paths, units, and documentation when this source
          was first extracted. Plain string provenance, not a relationship.
        range: string
      dd_documentation:
        description: >-
          Immutable raw DD documentation of the source leaf at extraction.
          Authoritative source text; never replaced by LLM enrichment.
      dd_snapshot_pinned:
        description: >-
          True only when the immutable DD snapshot was captured atomically at
          source creation from the exact current dd_version.
        range: boolean
      dd_parent_path:
        description: Meaningful direct parent path captured with the DD leaf.
      dd_parent_documentation:
        description: Immutable raw DD documentation of the direct parent.
      dd_data_type:
        description: Immutable DD data type captured at extraction.
      dd_unit:
        description: >-
          Normalized DD unit cache initialized at extraction. Current IMASNode
          and HAS_UNIT state remain authoritative; a governed unit-cache
          correction may update this cache without rewriting the pinned
          historical snapshot.
      dd_coordinates:
        description: Immutable coordinate path/spec identifiers at extraction.
        multivalued: true
      dd_lifecycle_status:
        description: Immutable DD lifecycle status captured at extraction.
      dd_lifecycle_version:
        description: DD version in which the captured lifecycle status was set.
      enhanced_description:
        description: >-
          Non-authoritative graph enrichment captured for semantic context.
          Kept separate from raw DD documentation.
      enhancement_kind:
        description: Kind of enhancement captured (template or llm).
      physics_domain:
        description: >-
          Physics domain of this source entity at extraction time. For DD
          sources, copied from the IMASNode's physics_domain; for signal
          sources, from the FacilitySignal. Plain string provenance — drives
          the batch_key grouping and is promoted onto the produced
          StandardName. Set in batch_create_sources (see graph_ops.py).

  StandardNameSourceSnapshotChange:
    description: >-
      Immutable receipt for one atomic in-place migration of a stable DD
      StandardNameSource identity to a newer uniquely current DD authority.
      The event never changes a StandardName or its review lifecycle.
    class_uri: sn:StandardNameSourceSnapshotChange
    attributes:
      id:
        identifier: true
        required: true
        description: Stable content-derived event identifier.
      source_id:
        required: true
        description: Exact StandardNameSource identity migrated by this event.
      from_dd_version:
        required: true
        description: Exact pinned DD version before migration.
      to_dd_version:
        required: true
        description: Exact uniquely current DD version after migration.
      before_snapshot_hash:
        required: true
        description: SHA-256 of the canonical pre-migration source snapshot.
      after_snapshot_hash:
        required: true
        description: SHA-256 of the canonical post-migration source snapshot.
      before_snapshot_payload:
        required: true
        description: Complete canonical JSON source snapshot before migration.
      after_snapshot_payload:
        required: true
        description: Complete canonical JSON source snapshot after migration.
      authority_hash:
        required: true
        description: >-
          SHA-256 of the complete current DD node, version, unit, parent, and
          coordinate authority proven by the transaction.
      precondition_hash:
        required: true
        description: >-
          SHA-256 of all source, backing, projection, name, review, edit, and
          relationship state fenced before mutation.
      preserved_state_hash:
        required: true
        description: >-
          SHA-256 of every non-snapshot property and relationship required to
          remain unchanged by the migration.
      classification:
        required: true
        range: StandardNameSourceSnapshotClassification
        description: Semantic classification of the authority change.
      reason:
        required: true
        description: Operator-provided reason for the governed migration.
      run_id:
        required: true
        description: Identifier shared by every event in one atomic invocation.
      changed_at:
        required: true
        range: datetime
        description: Transaction timestamp at which the migration committed.

  StandardNameSourceIdentityRepair:
    description: >-
      Immutable receipt for an atomic repair of one DD source identity scalar.
      The existing FROM_DD_PATH relationship is preserved exactly.
    class_uri: sn:StandardNameSourceIdentityRepair
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      source_id: {required: true, description: Exact stable StandardNameSource identity repaired.}
      before_source_identity_payload: {required: true, description: Canonical complete identity payload before repair.}
      after_source_identity_payload: {required: true, description: Canonical complete identity payload after repair.}
      before_identity_hash: {required: true, description: SHA-256 of the canonical pre-repair identity payload.}
      after_identity_hash: {required: true, description: SHA-256 of the canonical post-repair identity payload.}
      authority_hash: {required: true, description: SHA-256 of the exact current DD authority closure.}
      precondition_hash: {required: true, description: SHA-256 of the exact fenced graph precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of graph state other than the identity scalar.}
      reason: {required: true, description: Operator-provided reason for the governed repair.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      changed_at: {required: true, range: datetime, description: Transaction timestamp at which the repair committed.}

  StandardNameSourceSnapshotAdoption:
    description: >-
      Immutable receipt for atomic reconciliation to current DD authority when
      no DD version transition occurred.
    class_uri: sn:StandardNameSourceSnapshotAdoption
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      source_id: {required: true, description: Exact stable StandardNameSource identity reconciled.}
      dd_version: {required: true, description: Exact DD version named before and after adoption.}
      before_snapshot_hash: {required: true, description: SHA-256 of the complete pre-adoption snapshot.}
      after_snapshot_hash: {required: true, description: SHA-256 of the complete adopted snapshot.}
      before_snapshot_payload: {required: true, description: Complete canonical snapshot before adoption.}
      after_snapshot_payload: {required: true, description: Complete canonical snapshot after adoption.}
      authority_hash: {required: true, description: SHA-256 of the exact current DD authority closure.}
      precondition_hash: {required: true, description: SHA-256 of the exact fenced graph precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of every non-snapshot property and relationship.}
      classification: {required: true, range: StandardNameSourceSnapshotClassification, description: Semantic classification of the adopted authority change.}
      reason: {required: true, description: Operator-provided reason for the governed adoption.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      adopted_at: {required: true, range: datetime, description: Transaction timestamp at which adoption committed.}

  StandardNameSourceUnitCacheCorrection:
    description: >-
      Immutable receipt for an atomic correction of only a DD source's
      non-authoritative unit cache from a uniquely current IMASNode and exact
      HAS_UNIT relationship. The pinned source DD version and every other
      source property and relationship remain unchanged.
    class_uri: sn:StandardNameSourceUnitCacheCorrection
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      source_id: {required: true, description: Exact stable StandardNameSource identity corrected.}
      operation: {required: true, description: Governed operation name recorded by the manifest-bound transaction.}
      source_dd_version: {required: true, description: Historical DD version that remains pinned on the source.}
      authority_dd_version: {required: true, description: Uniquely current DD version supplying unit authority.}
      authority_node_id: {required: true, description: Exact IMASNode path supplying current unit authority.}
      from_unit: {required: true, description: Exact source dd_unit cache value before correction.}
      to_unit: {required: true, description: Exact agreeing IMASNode unit and HAS_UNIT target value.}
      before_snapshot_hash: {required: true, description: SHA-256 of the complete source snapshot before correction.}
      after_snapshot_hash: {required: true, description: SHA-256 of the snapshot with only dd_unit corrected.}
      before_snapshot_payload: {required: true, description: Complete canonical source snapshot before correction.}
      after_snapshot_payload: {required: true, description: Complete canonical snapshot with only dd_unit corrected.}
      authority_hash: {required: true, description: SHA-256 of the complete current DD node and version authority closure.}
      authority_identity_hash:
        required: true
        description: >-
          SHA-256 of exact source, backing node, current DD version, and unit
          identities.
      authority_relationships_hash: {required: true, description: SHA-256 of exact FROM_DD_PATH and HAS_UNIT relationship identities and properties.}
      precondition_hash: {required: true, description: SHA-256 of the exact fenced graph precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of every source property other than dd_unit and every preserved relationship.}
      manifest_hash: {required: true, description: SHA-256 of the exact manifest bytes authorizing the correction.}
      reason: {required: true, description: Operator-provided reason for the governed correction.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      corrected_at: {required: true, range: datetime, description: Transaction timestamp at which the correction committed.}

  StandardNameSourceSnapshotAdmission:
    description: >-
      Immutable receipt for atomic admission of a source with no prior pinned
      DD snapshot. No prior DD version is invented by this event.
    class_uri: sn:StandardNameSourceSnapshotAdmission
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      source_id: {required: true, description: Exact stable StandardNameSource identity admitted.}
      to_dd_version: {required: true, description: Exact uniquely current DD version admitted.}
      before_snapshot_hash: {required: true, description: SHA-256 of the complete null pre-admission snapshot.}
      after_snapshot_hash: {required: true, description: SHA-256 of the complete admitted snapshot.}
      before_snapshot_payload: {required: true, description: Complete canonical null snapshot before admission.}
      after_snapshot_payload: {required: true, description: Complete canonical snapshot after admission.}
      authority_hash: {required: true, description: SHA-256 of the exact current DD authority closure.}
      precondition_hash: {required: true, description: SHA-256 of the exact fenced graph precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of every non-snapshot property and relationship.}
      reason: {required: true, description: Operator-provided reason for the governed admission.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      admitted_at: {required: true, range: datetime, description: Transaction timestamp at which admission committed.}

  StandardNameSourceIdentityFold:
    description: >-
      Immutable receipt for retiring one duplicate DD source identity while
      preserving the canonical source and all historical retry evidence.
    class_uri: sn:StandardNameSourceIdentityFold
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      canonical_source_id: {required: true, description: Exact canonical StandardNameSource identity retained.}
      duplicate_source_id: {required: true, description: Exact duplicate StandardNameSource identity retired.}
      before_duplicate_identity_payload: {required: true, description: Canonical complete duplicate identity before retirement.}
      after_duplicate_identity_payload: {required: true, description: Canonical complete duplicate identity after retirement.}
      before_duplicate_identity_hash: {required: true, description: SHA-256 of the duplicate pre-retirement identity payload.}
      after_duplicate_identity_hash: {required: true, description: SHA-256 of the duplicate post-retirement identity payload.}
      authority_hash: {required: true, description: SHA-256 of the canonical current DD authority closure.}
      precondition_hash: {required: true, description: SHA-256 of the complete canonical and duplicate precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of graph state outside the authorized duplicate retirement.}
      reason: {required: true, description: Operator-provided reason for the governed fold.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      folded_at: {required: true, range: datetime, description: Transaction timestamp at which the fold committed.}

  StandardNameSourceAuthorityRetirement:
    description: >-
      Immutable receipt for retiring a DD source whose exact backing category
      does not participate in standard-name generation.
    class_uri: sn:StandardNameSourceAuthorityRetirement
    attributes:
      id: {identifier: true, required: true, description: Stable content-derived event identifier.}
      source_id: {required: true, description: Exact StandardNameSource identity retired.}
      dd_path: {required: true, description: Exact backing IMASNode identity.}
      node_category: {required: true, description: Nonparticipating DD node category proven at retirement.}
      removed_target_ids: {multivalued: true, description: Exact null-lifecycle target identities detached by the retirement.}
      before_source_payload: {required: true, description: Canonical complete source payload before retirement.}
      after_source_payload: {required: true, description: Canonical complete source payload after retirement.}
      before_source_hash: {required: true, description: SHA-256 of the complete pre-retirement source payload.}
      after_source_hash: {required: true, description: SHA-256 of the complete post-retirement source payload.}
      authority_hash: {required: true, description: SHA-256 of the exact current DD authority closure.}
      precondition_hash: {required: true, description: SHA-256 of the complete fenced graph precondition.}
      preserved_state_hash: {required: true, description: SHA-256 of graph state outside the authorized retirement.}
      reason: {required: true, description: Operator-provided reason for the governed retirement.}
      run_id: {required: true, description: Identifier shared by every event in one atomic invocation.}
      retired_at: {required: true, range: datetime, description: Transaction timestamp at which retirement committed.}

  StandardNameSourceRetry:
    description: >-
      Audit event written before a failed, attempt-capped, or explicitly
      selected skipped StandardNameSource is returned to the composition queue.
      The source keeps a scalar event-id mirror and a HAS_RETRY_EVENT
      relationship to every event.
    class_uri: sn:StandardNameSourceRetry
    attributes:
      id:
        identifier: true
        required: true
        description: "Composite key: source-retry:{uuid}"
      source_id:
        required: true
        description: The StandardNameSource id released for another attempt.
      previous_status:
        required: true
        range: StandardNameSourceStatus
        description: >-
          Source lifecycle status immediately before release. This is also the
          recovery-kind discriminator; skipped recovery records ``skipped``.
      previous_attempt_count:
        required: true
        range: integer
        description: Composition-attempt count immediately before release.
      previous_error:
        description: >-
          Durable recovery explanation. Retains the most recent non-empty
          composition error and, whenever present, appends the prior skip_reason
          plus optional skip_reason_detail. Either source may stand alone; null
          means neither source contained an explanation.
      reason:
        required: true
        description: Operator-supplied reason for granting another attempt.
      terminal_sn_id:
        description: >-
          Terminal StandardName identity whose exact source binding was
          released. Present only for terminal-attachment recovery events.
      terminal_stage:
        range: NameStage
        description: >-
          Lifecycle stage of the terminal target at the recovery boundary.
      before_closure_hash:
        description: >-
          SHA-256 of the complete signed source, DD path, and terminal-target
          closure before recovery.
      preserved_state_hash:
        description: >-
          SHA-256 of the graph state that the terminal recovery must preserve.
      manifest_hash:
        description: >-
          SHA-256 of the exact manifest authorizing terminal recovery.
      run_id:
        description: >-
          Invocation identity shared by the terminal-recovery mutation events.
      retried_at:
        required: true
        range: datetime
        description: Timestamp when the source was returned to extracted.

  SNRun:
    description: >-
      A single invocation of ``sn run``. Records budget, counts,
      domains touched, and stop reason so operators can audit run
      cycles over time.

      Example Cypher:
        MATCH (rr:SNRun)
        RETURN rr.id, rr.started_at, rr.cost_spent,
               rr.cost_total, rr.events_total, rr.stop_reason
        ORDER BY rr.started_at DESC LIMIT 10

        MATCH (sn:StandardName)
        WHERE sn.last_run_id IS NOT NULL
        MATCH (rr:SNRun {id: sn.last_run_id})
        RETURN rr.id, count(sn) AS touched
        ORDER BY rr.started_at DESC
    class_uri: sn:SNRun
    attributes:
      id:
        identifier: true
        description: UUID of the run
        required: true
      created_at:
        description: When the SNRun node was first created in the graph
        range: datetime
      started_at:
        description: When the run started
        required: true
        range: datetime
      ended_at:
        description: When finalization completed (set by finalize_sn_run)
        range: datetime
      stopped_at:
        description: When the run stopped (null if still running or interrupted before finalize)
        range: datetime
      cost_spent:
        description: Total LLM cost spent across all phases (USD)
        range: float
        ifabsent: float(0.0)
      cost_limit:
        description: Cost budget supplied to this run (USD)
        range: float
      compose_cost:
        description: >-
          LLM cost attributable to the generate and regen phases (USD).
          Populated from the shared BudgetManager phase-spend map.
        range: float
        ifabsent: float(0.0)
      review_cost:
        description: >-
          LLM cost attributable to the review_names and review_docs phases (USD).
          Populated from the shared BudgetManager phase-spend map.
        range: float
        ifabsent: float(0.0)
      names_composed:
        description: Count of names produced by the generate phase
        range: integer
        ifabsent: int(0)
      names_enriched:
        description: Count of names enriched during this run
        range: integer
        ifabsent: int(0)
      names_reviewed:
        description: Count of names reviewed during this run
        range: integer
        ifabsent: int(0)
      names_regenerated:
        description: Count of names that went through the regen phase
        range: integer
        ifabsent: int(0)
      error_siblings_minted:
        description: >-
          Count of error-sibling StandardName nodes deterministically
          minted during the generate phase via uncertainty modifier
          grammar. Each parent with HAS_ERROR edges produces up to
          three siblings (upper_uncertainty, lower_uncertainty,
          uncertainty_index). These skip LLM compose and review.
        range: integer
        ifabsent: int(0)
      domains_touched:
        description: Physics domains that had at least one phase executed
        multivalued: true
      stop_reason:
        description: >-
          Why the run exited. One of:
          'budget_exhausted', 'interrupted', 'error', 'completed'.
      min_score:
        description: >-
          The ``--min-score`` threshold below which reviewed names were
          selected for the regen phase. Null if regen phase was skipped.
        range: float
      description:
        description: Free-text notes about this run (optional)
      pipeline_hash:
        description: >-
          Composite SHA-256 digest (16 hex chars) of all prompt files,
          classifier code, and ISN vocab version at cycle start.
          Computed by ``imas_codex.standard_names.pipeline_version.compute_pipeline_hash``
          and stored as the ``_composite`` key.  Used by ``sn run`` to
          detect pipeline changes between cycles and prompt the operator
          to run ``sn clear`` before continuing.
        range: string
      pipeline_hash_detail:
        description: >-
          JSON-encoded dict of per-file 16-char hex digests that
          contributed to ``pipeline_hash``.  Allows precise diff
          reporting ("generate_name_system.md changed") without storing the
          full file contents.
        range: string
      status:
        description: Lifecycle status. started=in-progress; final values are past-tense.
        range: SNRunStatus
        ifabsent: string(started)
      cost_is_exact:
        description: >-
          False when one or more LLMCost writes failed and could not be drained
          before run finalization. cost_spent is then a lower bound.
        range: boolean
        ifabsent: boolean(true)
      cost_total:
        description: >-
          Aggregate of sum(LLMCost.llm_cost) for all LLMCost children
          of this run. Set live by BudgetManager flush and finalised by
          finalize_sn_run from the LLMCost ledger. Authoritative mirror
          of the graph-sourced spend total.
        range: float
      events_total:
        description: >-
          Count of LLMCost nodes linked to this run. Set live by
          BudgetManager flush and finalised by finalize_sn_run.
        range: integer
      elapsed_s:
        description: >-
          Wall-clock seconds from started_at to stopped_at. Computed and
          written by finalize_sn_run so the value is always (stopped_at -
          started_at).total_seconds(). Null when the run never stopped.
        range: float
      last_heartbeat:
        description: >-
          Most recent heartbeat from a live run; orphan sweep uses
          this to detect dead processes.
        range: datetime
      invocation:
        description: >-
          Shell-equivalent command line the run was launched with, as a
          single shlex-quoted string. Any argument that carries a
          credential (an option whose name mentions key, token, secret,
          or password, and bare values shaped like an API key) is
          replaced by a redaction marker before the string is stored.
          Without this a run that exited on 'no_eligible_work' or
          'budget_saturated' cannot be told apart from one whose scope
          flags excluded the work it was meant to do.
        range: string
      invocation_flags:
        description: >-
          JSON object of the resolved run knobs the orchestrator received
          — cost limit, time limit, min score, model overrides, backlog
          caps, and the phase skip flags. Resolved values, not raw
          argv, so a default that changed between releases is still
          recoverable from the run row.
        range: string
      invocation_scope:
        description: >-
          JSON object of the work-scope restriction — physics domains,
          scope run id, drain scope id and DD version, exact-path count,
          single-pool selector, and the edits-only / skip-maintenance
          switches. Answers whether an empty run had no work or was
          pointed away from it.
        range: string

  LLMCost:
    description: >-
      Atomic LLM cost row. One node per acall_llm_structured() invocation.
      Append-only and idempotent — created with a deterministic UUID via CREATE
      (not MERGE). Duplicate writes raise a constraint violation that callers
      treat as success. Sole source of truth for SN spend totals.
    class_uri: sn:LLMCost
    mixins:
      - LLMOperation
    attributes:
      id:
        identifier: true
        required: true
        description: Deterministic UUID generated client-side.
      run_id:
        required: true
        description: Links to SNRun.id via FOR_RUN edge.
      phase:
        required: true
        description: Pipeline phase (generate, regen, enrich, review_names, review_docs).
      cycle:
        description: Review cycle (c0, c1, c2) or null for non-review phases.
      sn_ids:
        multivalued: true
        description: StandardName ids touched by this LLM call. Per-name cost share = llm_cost / size(sn_ids).
      batch_id:
        description: Groups retries within one logical batch.
      overspend:
        description: USD charged beyond the lease reservation. 0.0 when call fits its reservation.
        range: float
        ifabsent: float(0.0)
      pool:
        description: >-
          Normalized pipeline pool name. One of: compose, refine_name,
          refine_docs, validate, review, enrich. Maps legacy phase values
          to the six canonical pool identifiers.
      event_type:
        description: >-
          Raw phase/event label as recorded by the caller (e.g.
          generate_name, regen, refine_docs). Preserves the original
          granularity before pool normalisation.
      for_run:
        range: SNRun
        annotations:
          relationship_type: FOR_RUN
        description: Edge to the parent SNRun.

  StandardNameReview:
    description: >-
      Quality review of a StandardName produced by an LLM reviewer model.
      A StandardName may have one (canonical) or many (multi-reviewer)
      StandardNameReview nodes attached via HAS_REVIEW. Each StandardNameReview
      belongs to an RD-quorum review group identified by ``review_group_id``.

      Example Cypher:
        MATCH (sn:StandardName {id: 'electron_temperature'})-[:HAS_REVIEW]->(r:StandardNameReview)
        RETURN r.llm_model, r.score, r.tier, r.review_axis, r.cycle_index,
               r.review_group_id, r.resolution_role, r.resolution_method
    class_uri: sn:StandardNameReview
    mixins:
      - LLMOperation
    attributes:
      id:
        identifier: true
        description: >-
          Composite id: ``{standard_name_id}:{axis}:{review_group_id}:{cycle_index}``.
          Unique across axes and quorum cycles. MERGE is idempotent for
          rerun of the same review pass.
        required: true
      standard_name_id:
        description: ID of the reviewed StandardName (back-reference; edge owned by StandardName via HAS_REVIEW)
        required: true
      review_axis:
        description: >-
          Which review rubric produced this StandardNameReview — ``names``
          (4-dim name scoring) or ``docs`` (4-dim documentation scoring).
        range: StandardNameReviewMode
        required: true
      cycle_index:
        description: >-
          Zero-based cycle index within the RD-quorum group.
          0 = primary (blind), 1 = secondary (blind), 2 = escalator.
        range: integer
        required: true
      review_group_id:
        description: >-
          UUID identifying the quorum group this Review belongs to.
          All cycles within one batch review share the same group id.
        required: true
      docs_review_admission_id:
        description: >-
          Durable admission that exclusively owns this Review. Null for
          ordinary pipeline reviews and immutable once set.
      resolution_role:
        description: >-
          Role of this Review within the quorum group: primary, secondary,
          or escalator.
        range: ReviewResolutionRole
        required: true
      resolution_method:
        description: >-
          How the final scores were resolved for this review group.
          Set on the last cycle in the group; null on intermediate cycles.
        range: ReviewResolutionMethod
      model:
        description: LLM model id used for this review (OpenRouter-style slug)
        required: true
      reviewer_model:
        description: >-
          LLM model id used for this review — consumer-facing alias for
          ``model``. Set to the same value as ``model`` so that queries on
          ``rv.reviewer_model`` return the expected string without needing
          to alias in Cypher.
      model_family:
        description: >-
          Family of the reviewing model (anthropic, openai, google, mistral,
          meta, xai, cohere, other). Derived from ``model`` for family-aware
          diversity queries.
      is_canonical:
        description: >-
          True iff this is the canonical reviewer (``models[0]``). Its
          score/tier/comments mirror onto the StandardName node.
        range: boolean
      score:
        description: Normalized reviewer score (0-1)
        range: float
      scores_json:
        description: >-
          JSON-encoded per-dimension sub-scores. Schema depends on review
          mode (names 4-dim, docs 4-dim independent).
      comments_per_dim_json:
        description: >-
          JSON-encoded per-dimension reviewer comments matching scores_json
          dimensions. Values are optional strings (null for no comment).
      tier:
        description: Quality tier (outstanding, good, inadequate, poor, unknown)
      comments:
        description: Free-text reviewer comments
      suggested_name:
        description: >-
          Reviewer-proposed replacement name. Mirrors
          ``StandardName.reviewer_suggested_name`` for the canonical
          reviewer. Null when the reviewer offered no alternative.
        range: string
      suggestion_justification:
        description: >-
          1–3 sentence justification for ``suggested_name``. Null when
          ``suggested_name`` is null.
        range: string
      reviewed_at:
        description: ISO 8601 timestamp when the review completed
        range: datetime
      codex_version:
        description: >-
          imas-codex package version at review time (e.g. "4.1.0").
          Records which review prompts, rubric, and pipeline logic
          produced this review.
        range: string
      isn_version:
        description: >-
          ISN (imas-standard-names) package version at review time
          (e.g. "0.7.0rc56"). Records which grammar and validation
          rules were used during review.
        range: string

  PromotionCandidate:
    description: >-
      A grammar-vocabulary token proposed for addition to ISN's closed
      vocabulary lists, detected by mining the graph for tokens that are
      saturated — reused across multiple high-quality StandardNames.

      Lifecycle:
        1. ``sn vocab saturated`` mines candidates (multiple StandardName uses,
           all with review_mean_score >= threshold, not already in ISN vocab).
        2. ``sn vocab promote`` persists a ``PromotionCandidate`` node per
           saturated token and prints an ISN-ready PR snippet.
        3. When the ISN PR is opened, ``submitted_to_isn_at`` is recorded.
        4. Once the token lands in an ISN release, ``imas_standard_names``
           picks it up automatically on the next dependency bump — codex
           does not own the vocabulary itself.

      Each candidate is linked to the StandardNames that evidence its use
      via the EVIDENCED_BY relationship.

      Example Cypher:
        MATCH (pc:PromotionCandidate {segment: 'physical_base'})
        WHERE pc.submitted_to_isn_at IS NULL
        RETURN pc.token, pc.uses, pc.min_review_score ORDER BY pc.uses DESC

        MATCH (pc:PromotionCandidate)-[:EVIDENCED_BY]->(sn:StandardName)
        RETURN pc.token, collect(sn.id) AS supporting_names
    class_uri: sn:PromotionCandidate
    attributes:
      id:
        identifier: true
        description: >-
          Format: promotion_candidate:{segment}:{token}
          Example: promotion_candidate:physical_base:gap
        required: true
      segment:
        description: >-
          Grammar segment the token belongs to (e.g. ``physical_base``,
          ``subject``). All segments are closed vocabulary — candidates
          represent tokens used by the LLM that are not yet in the
          installed ISN vocabulary.
        required: true
      token:
        description: The candidate vocabulary token
        required: true
      uses:
        description: >-
          Number of distinct StandardNames using this token in the named
          segment slot at detection time.
        range: integer
      min_review_score:
        description: >-
          Minimum ``review_mean_score`` across the supporting StandardNames
          at detection time. All supporting names must meet the threshold
          (default 0.75) for the candidate to be emitted.
        range: float
      physics_domains:
        description: >-
          Comma-separated list of distinct ``physics_domain`` values covered
          by the supporting StandardNames (evidence of cross-domain use).
      detected_at:
        description: ISO 8601 timestamp when this candidate was first detected
        range: datetime
      last_detected_at:
        description: >-
          ISO 8601 timestamp when this candidate was most recently observed
          in a ``sn vocab saturated`` pass.  Updated on each detection run so
          that stale candidates (not seen for a long time) can be culled.
        range: datetime
      submitted_to_isn_at:
        description: >-
          ISO 8601 timestamp when a PR was opened against ISN for this
          candidate. NULL means the candidate has not yet been submitted.
        range: datetime
      evidences:
        description: >-
          Supporting StandardNames whose segment slot contains this token.
          Persisted as EVIDENCED_BY edges in the graph; LinkML does not
          model edge properties.
        multivalued: true
        range: StandardName
        inlined: false
        annotations:
          relationship_type: EVIDENCED_BY
