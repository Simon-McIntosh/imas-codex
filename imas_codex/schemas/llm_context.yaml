id: https://imas.iter.org/schemas/llm_context
name: llm_context
title: Typed LLM Prompt Context Schema
description: >-
  Provider-independent prompt context types that keep source authority,
  semantic obligations, reviewer intent, mutable provenance, and comparison
  evidence in disjoint carriers. These types are request data and are never
  persisted as graph nodes.

license: MIT
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  llmctx: https://imas.iter.org/schemas/llm_context/

default_prefix: llmctx
default_range: string

imports:
  - linkml:types

enums:
  AuthorityClass:
    description: The authority role a context claim is permitted to have.
    permissible_values:
      pinned_source_fact:
        description: Exact fact read from a pinned source and source version.
      approved_local_resolution:
        description: Versioned local resolution scoped to exact source facts.
      semantic_obligation:
        description: Normalized facet derived from mutually consistent authority.
      reviewer_intent:
        description: Explicit requested change that cannot override source facts.
      mutable_provenance:
        description: Prior generated or reviewed material with mutable provenance.
      non_binding_comparator:
        description: Evidence useful for comparison but never for identity authority.

  ContextScope:
    description: The narrowest scope at which a claim is valid.
    permissible_values:
      exact_item:
        description: The claim applies only to the identified request item.
      family:
        description: The claim describes a comparison family, not item identity.
      batch:
        description: The claim is safe to share across the current batch.
      global_static:
        description: The claim is registered immutable context shared globally.

  FacetState:
    description: Explicit state of an obligation facet.
    permissible_values:
      known:
        description: The facet has a source-backed value.
      unknown:
        description: The source does not establish the facet.
      not_applicable:
        description: The facet has no meaning for this request item.

  ContextValueKind:
    description: The single populated channel of a typed context value.
    permissible_values:
      text:
        description: A text value.
      integer:
        description: An integer value.
      number:
        description: A real-number value.
      boolean:
        description: A Boolean value.
      text_list:
        description: An ordered list of text values.
      structured:
        description: An ordered list of named typed fields.

  TemplateRole:
    description: Message role produced by a registered prompt template.
    permissible_values:
      system:
        description: Static system instruction material.
      user:
        description: Dynamic request material.
      assistant:
        description: Registered assistant-prefill material.

  TelemetryState:
    description: Whether one provider telemetry dimension is trustworthy.
    permissible_values:
      valid:
      invalid:
      unavailable:

  StaticContextKind:
    description: Kind of immutable input included in the static fingerprint.
    permissible_values:
      template:
        description: A registered prompt template or include.
      schema:
        description: A response or context schema.
      grammar:
        description: A grammar or controlled-vocabulary snapshot.
      policy:
        description: A registered call-site or seat policy.

classes:
  ContextField:
    description: A named, non-nested field in a structured context value.
    attributes:
      name:
        required: true
        description: Stable mechanism name for the field.
      value_kind:
        range: ContextValueKind
        required: true
      text_value:
        description: Populated only when value_kind is text.
      integer_value:
        range: integer
        description: Populated only when value_kind is integer.
      number_value:
        range: double
        description: Populated only when value_kind is number.
      boolean_value:
        range: boolean
        description: Populated only when value_kind is boolean.
      text_items:
        range: string
        multivalued: true
        description: Populated only when value_kind is text_list.

  ContextValue:
    description: >-
      A typed claim payload with exactly one populated value channel. Structured
      values use named typed fields instead of unlabelled dictionaries.
    attributes:
      value_kind:
        range: ContextValueKind
        required: true
      text_value:
        description: Populated only when value_kind is text.
      integer_value:
        range: integer
        description: Populated only when value_kind is integer.
      number_value:
        range: double
        description: Populated only when value_kind is number.
      boolean_value:
        range: boolean
        description: Populated only when value_kind is boolean.
      text_items:
        range: string
        multivalued: true
        description: Populated only when value_kind is text_list.
      fields:
        range: ContextField
        multivalued: true
        description: Populated only when value_kind is structured.

  ContextClaim:
    description: A single source-addressable claim with immutable provenance.
    attributes:
      claim_id:
        required: true
        description: Stable identifier unique within an envelope.
      authority_class:
        range: AuthorityClass
        required: true
      kind:
        required: true
        description: Mechanism or semantic facet named by the claim.
      value:
        range: ContextValue
        required: true
      source_ref:
        required: true
        description: Exact DD path, resolution key, graph id, or artifact id.
      source_field:
        required: true
        description: Exact field within the source that supports the claim.
      source_version:
        required: true
        description: Exact version of the source material.
      source_digest:
        required: true
        description: Lowercase SHA-256 digest of the exact source material.
      scope:
        range: ContextScope
        required: true
      observed_at:
        range: datetime
        description: Optional observation time, excluded when absent.

  SemanticFacet:
    description: An explicit known, unknown, or not-applicable obligation facet.
    attributes:
      state:
        range: FacetState
        required: true
      value:
        description: Required for known and forbidden for other states.
      source_claim_ids:
        range: string
        multivalued: true
        description: Authority claims from which a known facet was normalized.

  SemanticObligations:
    description: >-
      Complete normalized identity and review facets. Every field is present;
      unavailable fields use an explicit unknown or not-applicable state.
    attributes:
      quantity: {range: SemanticFacet, required: true}
      carrier: {range: SemanticFacet, required: true}
      representation: {range: SemanticFacet, required: true}
      coordinate_frame: {range: SemanticFacet, required: true}
      owner: {range: SemanticFacet, required: true}
      locus: {range: SemanticFacet, required: true}
      axis: {range: SemanticFacet, required: true}
      section_plane: {range: SemanticFacet, required: true}
      unit: {range: SemanticFacet, required: true}
      dd_version: {range: SemanticFacet, required: true}
      kind: {range: SemanticFacet, required: true}
      physics_domain: {range: SemanticFacet, required: true}
      cocos: {range: SemanticFacet, required: true}
      family: {range: SemanticFacet, required: true}

  StaticContextRef:
    description: A registered immutable input to prompt rendering.
    attributes:
      name:
        required: true
      kind:
        range: StaticContextKind
        required: true
      role:
        range: TemplateRole
        description: Message role for template inputs; absent for other kinds.
      source_version:
        required: true
      source_digest:
        required: true

  PromptAttachment:
    description: Bounded binary image input carried by one request item.
    attributes:
      attachment_id: {required: true}
      media_type: {required: true}
      content_digest:
        required: true
        description: Lowercase SHA-256 digest of the decoded bytes.
      data_base64:
        required: true
        description: Exact base64 payload used to construct the provider data URL.
      byte_length: {range: integer, required: true}
      width: {range: integer, required: true}
      height: {range: integer, required: true}

  PromptItemEnvelope:
    description: All disjoint context channels for exactly one request item.
    attributes:
      item_id:
        required: true
      source_facts:
        range: ContextClaim
        multivalued: true
        required: true
      approved_resolutions:
        range: ContextClaim
        multivalued: true
        required: true
      obligations:
        range: SemanticObligations
        required: true
      reviewer_intent:
        range: ContextClaim
        multivalued: true
        required: true
      comparators:
        range: ContextClaim
        multivalued: true
        required: true
      provenance:
        range: ContextClaim
        multivalued: true
        required: true
      mutable_candidate:
        range: ContextClaim
        description: Current generated candidate, when one exists.
      attachments:
        range: PromptAttachment
        multivalued: true
        description: Optional bounded multimodal inputs for this item.

  PromptEnvelope:
    tree_root: true
    description: Complete typed input to one registered provider request.
    attributes:
      schema_version:
        required: true
      callsite_id:
        required: true
      service:
        required: true
      seat:
        required: true
      task_kind:
        required: true
      policy_id:
        required: true
      static_context:
        range: StaticContextRef
        multivalued: true
        required: true
      batch_items:
        range: PromptItemEnvelope
        multivalued: true
        required: true
      batch_comparators:
        range: ContextClaim
        multivalued: true
        required: true

  EnvelopeFingerprints:
    description: Independent canonical fingerprints for a validated envelope.
    attributes:
      static_fingerprint: {required: true}
      authority_fingerprint: {required: true}
      comparator_fingerprint: {required: true}
      provenance_fingerprint: {required: true}
      request_fingerprint: {required: true}

  ItemFingerprints:
    description: Order-independent identity of one validated item context.
    attributes:
      item_id: {required: true}
      authority_fingerprint: {required: true}
      comparator_fingerprint: {required: true}
      provenance_fingerprint: {required: true}

  ProviderUsage:
    description: Provider-reported usage and explicit validity after a response.
    attributes:
      input_tokens: {range: integer}
      input_tokens_state: {range: TelemetryState, required: true}
      output_tokens: {range: integer}
      output_tokens_state: {range: TelemetryState, required: true}
      cached_read_tokens: {range: integer}
      cached_read_tokens_state: {range: TelemetryState, required: true}
      cached_write_tokens: {range: integer}
      cached_write_tokens_state: {range: TelemetryState, required: true}
      actual_cost: {range: double}
      actual_cost_state: {range: TelemetryState, required: true}
      attempt_count: {range: integer, required: true}

  PromptItemReceipt:
    description: Redacted request receipt for one item without raw values.
    attributes:
      item_id: {required: true}
      source_refs: {range: string, multivalued: true, required: true}
      source_count: {range: integer, required: true}
      fingerprints: {range: ItemFingerprints, required: true}

  PromptAttachmentReceipt:
    description: Redacted attachment identity without encoded binary content.
    attributes:
      item_id: {required: true}
      attachment_id: {required: true}
      media_type: {required: true}
      content_digest: {required: true}
      byte_length: {range: integer, required: true}
      width: {range: integer, required: true}
      height: {range: integer, required: true}

  BatchComparatorReceipt:
    description: Exact shared comparator source inventory for the whole batch.
    attributes:
      source_refs: {range: string, multivalued: true, required: true}
      source_count: {range: integer, required: true}
      fingerprint: {required: true}

  PromptReceipt:
    description: Provider-independent request identity and exact exposure receipt.
    attributes:
      fingerprints: {range: EnvelopeFingerprints, required: true}
      rendered_message_digests:
        range: string
        multivalued: true
        required: true
      item_receipts:
        range: PromptItemReceipt
        multivalued: true
        required: true
      attachment_receipts:
        range: PromptAttachmentReceipt
        multivalued: true
        required: true
      batch_comparator_receipt:
        range: BatchComparatorReceipt
        required: true
      wire_request_digest: {required: true}
      credential_source_identity:
        required: true
        description: Non-secret registry name and one-way key identity.
      endpoint_contract:
        required: true
        description: Enforceable route contract used for the frozen request.
      prompt_bundle_digest: {required: true}
      response_model_identity: {required: true}
      response_schema_digest: {required: true}
      parsed_output_digest:
        description: Canonical parsed-model digest populated only after success.
      tokenizer_id: {required: true}
      exact_input_tokens: {range: integer, required: true}
      max_input_tokens: {range: integer, required: true}
      max_output_tokens: {range: integer, required: true}
      max_attempts: {range: integer, required: true}
      attachment_count: {range: integer, required: true}
      attachment_bytes: {range: integer, required: true}
      maximum_image_count: {range: integer, required: true}
      maximum_cost_exposure: {range: double, required: true}
      provider_usage: {range: ProviderUsage}
      failure_type:
        description: Typed transport failure class populated after billable failure.
