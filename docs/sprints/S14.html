  <li data-slug="sn-west-catalog-release" data-item="{&quot;done_when&quot;: &quot;The reviewed catalog change is merged and tagged, graph/catalog/source parity is exact, and the undo rehearsal restores the pre-release state while retaining audit history.&quot;, &quot;slug&quot;: &quot;sn-west-catalog-release&quot;, &quot;why_now&quot;: &quot;Every barrier this release must not ship around now lives in S12: the embedding-coverage gate and the 78 unauthorized relocations. Scheduling the RC in S10 put it BEFORE both, which is the premature release those plans exist to prevent - two error-level sprint-order inversions. S13 places it downstream of the whole barrier set.&quot;}">sn-west-catalog-release</li>
  <li data-slug="sn-west-cohort-treatment" data-item="{&quot;done_when&quot;: &quot;A cut publishes only names traceable to the batch manifest plus the structural parents they require, with the count of out-of-manifest names measured at zero; the twelve attempt-cap sources are re-composed or refused with a stated reason; the skip rule&#x27;s exclusions each carry a written justification; and no candidate can be cut carrying a name with a null status.&quot;, &quot;slug&quot;: &quot;sn-west-cohort-treatment&quot;, &quot;why_now&quot;: &quot;The candidate was cut and halted on the same hour: 150 of its 411 published names are bound to no path in the batch manifest, so a physicist would have been asked to review names from outside the batch they were told they were reviewing. Every later candidate inherits that scoping defect, and the 37 untreated manifest paths sit behind it.&quot;}">sn-west-cohort-treatment</li>

  <li data-slug="catalog-review-surface" data-item="{&quot;done_when&quot;: &quot;The approval fold-back is exercised with one accepted and one refused edit, the unwind is proven to leave no lasting change, and an accepted edit is traceable to its author and pull request in the graph&quot;, &quot;slug&quot;: &quot;catalog-review-surface&quot;, &quot;why_now&quot;: &quot;A reviewer&#x27;s edits must be traceable and machine-owned fields protected before any batch is put in front of a physicist&quot;}">catalog-review-surface</li>

  <script type="application/json" id="reckon-resource-state">{"description":"WHY THIS IS ITS OWN SPRINT. S10 had grown to fourteen items spanning two different kinds of work: getting a batch in front of a reviewer, and making the pipeline that produces the batch trustworthy. Those compete. Every session that chased a pipeline defect deferred the cut, and every session that chased the cut left the defect. The split makes the dependency explicit rather than implicit: the release waits on named integrity gates, and nothing else in the release sprint waits on anything.\n\nWHERE THE BATCH ACTUALLY STANDS, measured per source against the committed manifest on 2026-09-16. 340 of 342 sources are carried, meaning at least one of the source's identities is accepted on both the name and documentation axes. Counting per identity row rather than per source is what produced every earlier lower figure, because several sources hold a superseded or exhausted identity alongside the accepted one. No pull request is open; the last was closed at the lead's direction and nothing replaced it.\n\nTHE TWO REMAINING SOURCES, and the lead's ruling that they are not optional. calorimetry/group/component/energy_total/data lost its binding when its name reached exhausted, which is the terminal-binding invariant working rather than a defect; its source sits at extracted with a fresh attempt budget, so the route back is a composition, not a reattach. camera_x_rays/camera/camera_dimensions is at its five-attempt cap with every candidate spelling spent, and the nearest accepted name is refused on a device-locus mismatch because a camera is not a detector in the locus registry. The lead's direction is that a manifest must be fully generable and that difficulty is not a reason to carry an exclusion. Both belong to the generability plan in the integrity sprint rather than here; this sprint consumes their outcome.\n\nWHAT THE RELEASE STILL OWES A REVIEWER, and it is not more names. The exporter selects
