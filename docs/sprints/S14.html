ELEASE STILL OWES A REVIEWER, and it is not more names. The exporter selects on accepted or approved and applies no producer-edge eligibility predicate, so an accepted name carrying no producing source can enter a candidate set; four such identities did, and nothing published only because an unrelated token-collision gate failed first. A reviewer cannot detect a name with no data-dictionary justification by reading it. That predicate is tracked on the integrity sprint and is the single highest-value change standing between this batch and a defensible review.\n\nMEASUREMENT DISCIPLINE. Take the batch size from a dry run at the moment of the cut and from nothing else. Quote no figure into a brief that was not measured in the same session that uses it.\n\nROUTE THIS SPRINT TO THE LOCAL LANE. THE CODEX WINDOW IS SPENT FOR THE WEEK. Measured from a promotion receipt on 2026-09-17 at 09:15 UTC: 87.0 percent of a 10,080-minute window used, resetting 2026-09-21 at 05:57 UTC. All four codex lanes share that one meter, so spreading across them buys model diversity and no headroom at all. Against a working ceiling near 92 percent that leaves about five points for the remaining 3.9 days of the window, which is hours of wave at the burn this campaign has been running - 3.14 days elapsed against 87 percent consumed is 27.7 points per day on average. Treat clive as the default lane for every node in this sprint and codex as the exception that needs a reason, not the reverse. A peer session independently read the same meter at 87-88 percent, so this is the account's position and not one session's artifact; that session projected exhaustion on 2026-09-19, which is slower than the average burn implies - either way there is no wave-sized headroom before the reset.\n\nA FENCE DEFECT TO FIX BEFORE THE NEXT AUDIT WAVE. reckon audit-doc requires a reckon HTML header carrying plan-slug and plan-status metas, so genuine markdown under docs/ can never satisfy it. Two 2026-09-17 nodes were fenced with a .md write path AND an audit-doc-exits-0 gate, which cannot both hold: one reported blocked with its evidence committed, the other passed by writing HTML into the .md filename. Either fence evidence at a .html path or teach doccheck to accept markdown; do not simply drop the gate, because it is a real and satisfiable check.","ends":"2026-10-16","id":"S14","items":[{"done_when":"The reviewed catalog change is merged and tagged, graph/catalog/source parity is exact, and the undo rehearsal restores the pre-release state while retaining audit history.","slug":"sn-west-catalog-release","why_now":"Every barrier this release must not ship around now lives in S12: the embedding-coverage gate and the 78 unauthorized relocations. Scheduling the RC in S10 put it BEFORE both, which is the premature release those plans exist to prevent - two error-level sprint-order inversions. S13 places it downstream of the whole barrier set."},{"done_when":"A cut publishes only names traceable to the batch manifest plus the structural parents they require, with the count of out-of-manifest names measured at zero; the twelve attempt-cap sources are re-composed or refused with a stated reason; the skip rule's exclusions each carry a written justification; and no candidate can be cut carrying a name with a null status.","slug":"sn-west-cohort-treatment","why_now":"The candidate was cut and halted on the same hour: 150 of its 411 published names are bound to no path in the batch manifest, so a physicist would have been asked to review names from outside the batch they were told they were reviewing. Every later candidate inherits that scoping defect, and the 37 untreated manifest paths sit behind it."},{"done_when":"Every WEST row has an explicit human accept/change/hold disposition with complete current name, source, description, and review evidence; requested changes pass the ordinary pipeline.","slug":"sn-west-review-rehearsal","why_now":"Human experts review the refreshed cohort at
