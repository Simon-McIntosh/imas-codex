<main class="reckon-resource" data-type="sprint" data-id="S10">
  <ol data-reckon="sprint-items">
  <li data-slug="sn-west-review-rehearsal" data-item="{&quot;done_when&quot;: &quot;Every WEST row has an explicit human accept/change/hold disposition with complete current name, source, description, and review evidence; requested changes pass the ordinary pipeline.&quot;, &quot;slug&quot;: &quot;sn-west-review-rehearsal&quot;, &quot;why_now&quot;: &quot;Human experts review the refreshed cohort at the new docs standard; the census pre-screen and 14-source residual close first.&quot;}">sn-west-review-rehearsal</li>
  <li data-slug="sn-west-catalog-release" data-item="{&quot;done_when&quot;: &quot;The reviewed catalog change is merged and tagged, graph/catalog/source parity is exact, and the undo rehearsal restores the pre-release state while retaining audit history.&quot;, &quot;slug&quot;: &quot;sn-west-catalog-release&quot;, &quot;why_now&quot;: &quot;Every barrier this release must not ship around now lives in S12: the embedding-coverage gate and the 78 unauthorized relocations. Scheduling the RC in S10 put it BEFORE both, which is the premature release those plans exist to prevent - two error-level sprint-order inversions. S13 places it downstream of the whole barrier set.&quot;}">sn-west-catalog-release</li>
  <li data-slug="sn-embedding-coverage-gate" data-item="{&quot;done_when&quot;: &quot;The coverage shortfall is measured over the release set and the whole accepted corpus with sanity counts; missing embeddings on real descriptions are separated from missing descriptions; Gate A&#x27;s assertion and threshold are recovered; and the gate is fixed, deliberately relaxed with a written threshold, or the affected identities withheld with named reasons.&quot;, &quot;slug&quot;: &quot;sn-embedding-coverage-gate&quot;, &quot;why_now&quot;: &quot;A gate that fails and is downgraded to advisory has stopped being a gate, and the next consumer of that export is a release candidate.&quot;}">sn-embedding-coverage-gate</li>
  <li data-slug="sn-relocation-retirement-apply" data-item="{&quot;done_when&quot;: &quot;Fresh authority built and hashed inside the applying invocation; admitted and refused counts with verbatim reasons; receipts recovered by run_id plus manifest digest; replay write-free; the unauthorized-relocation class re-measured to zero or to named refusals; the two export-cycle identities released.&quot;, &quot;slug&quot;: &quot;sn-relocation-retirement-apply&quot;, &quot;why_now&quot;: &quot;The only residual with no external dependency. Program proved at a495fb07 and prevention landed at b926b8dd, so retirement is now durable where an earlier governed deletion was undone.&quot;}">sn-relocation-retirement-apply</li>
  <li data-slug="offsite-recovery-cadence" data-item="{&quot;done_when&quot;: &quot;A full-graph offsite push runs on its own schedule with a stated retention count, graph status reports offsite currency beside the local figure, a push proves whatever the recovery-verification decision requires, and the wall time and registry storage cost of one real push are recorded rather than projected.&quot;, &quot;slug&quot;: &quot;offsite-recovery-cadence&quot;, &quot;why_now&quot;: &quot;A measurement taken while hardening the destructive graph commands returned a verdict that plan had no authority to act on: release cadence is acting as the backup schedule, so the only full offsite copy is 56.238 days behind the live store and drifts with how often code ships rather than how often data changes. The prerequisite lands this sprint&#x27;s predecessor and leaves the machinery - a currency helper, an archive naming contract and manifest scope counts - so this consumes existing pieces rather than building new ones.&quot;}">offsite-recovery-cadence</li>
  <li data-slug="hidden-suite-failures" data-item="{&quot;done_when&quot;: &quot;Every one of the 49 carries a verdict - fix here, owned elsewhere, environmental, or wrong premise; the optional-dependency posture is decided and applied; assigned repairs each move a named test from failing to passing; a zero-collection suite can no longer be mistaken for a passing one; and a final full-suite figure is recorded against the opening census.&quot;, &quot;slug&quot;: &quot;hidden-suite-failures&quot;, &quot;why_now&quot;: &quot;Restoring test collection while shipping the graph-safety plan revealed that uv run pytest had exited 2 with zero tests run since 2026-08-25, and that 49 tests fail once it collects. Every change in that window landed against a suite that verified nothing while appearing to be present, so the backlog does not age quietly - it grows invisibly.&quot;}">hidden-suite-failures</li>
  <li data-slug="sn-west-cohort-treatment" data-item="{&quot;done_when&quot;: &quot;A cut publishes only names traceable to the batch manifest plus the structural parents they require, with the count of out-of-manifest names measured at zero; the twelve attempt-cap sources are re-composed or refused with a stated reason; the skip rule&#x27;s exclusions each carry a written justification; and no candidate can be cut carrying a name with a null status.&quot;, &quot;slug&quot;: &quot;sn-west-cohort-treatment&quot;, &quot;why_now&quot;: &quot;The candidate was cut and halted on the same hour: 150 of its 411 published names are bound to no path in the batch manifest, so a physicist would have been asked to review names from outside the batch they were told they were reviewing. Every later candidate inherits that scoping defect, and the 37 untreated manifest paths sit behind it.&quot;}">sn-west-cohort-treatment</li>
  <li data-slug="sn-lifecycle-integrity" data-item="{&quot;done_when&quot;: &quot;The exported status is derived from the graph with a candidate refused when any name would publish a null status; one axis is authoritative for the published catalog and the other is derived or removed; an import that writes origin or status fails a test, demonstrated by removing the guard and watching it fail; the 54 misclassified fit artifacts carry the category that already exists; and a repeat census after a later export and a later import returns unchanged numbers.&quot;, &quot;slug&quot;: &quot;sn-lifecycle-integrity&quot;, &quot;why_now&quot;: &quot;Repairs run ahead of their leaks otherwise. The exporter writes status as a literal, so backfilling the 2533 nulls would never reach the catalog; the import guard is a locked decision with no proven test behind it, so the round trip that cleared 1,091 identities can still recur; and the fit-artifact misclassification is the same fix the cohort plan would otherwise make separately. Closing these first is what stops the same census being re-measured every sprint.&quot;}">sn-lifecycle-integrity</li>
  <li data-slug="sn-grammar-refinement" data-item="{&quot;done_when&quot;: &quot;The two rendering rules live in the ISN renderer rather than any prompt, so a new name is born canonical; round-trip symmetry holds with parse of render returning the same IR; the 165 tail-gated names are re-rendered through parse, re-render and supersede with provenance and their descriptions unchanged; the component axis is a distinguished dimension in the graph schema, where it serves completeness queries, with no sidecar field added because the site decomposes each name through the standard-names package and the grammar round-trips by design; and the 176 true vector-component gaps each carry a per-name verdict against their data-dictionary source.&quot;, &quot;slug&quot;: &quot;sn-grammar-refinement&quot;, &quot;why_now&quot;: &quot;The window is open exactly once. Composition is local and free, so a rename costs wall clock only, and 225 of the 253 affected names are already publishable - one approval from frozen, after which every correction becomes a published-catalog migration with consumers attached. The demonstrator has already proved the machinery preserves meaning on 11 names at zero cost.&quot;}">sn-grammar-refinement</li>
  </ol>
