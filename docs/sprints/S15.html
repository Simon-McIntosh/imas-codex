  <script type="application/json" id="reckon-resource-state">{"description":"On 2026-09-23 to 24 the login node reached load 143 while its CPU sat 97% idle. The cause was agent processes blocked on GPFS, and imas-codex host showed it as 100% CPU while listing none of them. This sprint makes the host command the lead's agent dashboard. It shows every process of the lead's uid on the login and fleet nodes, attributed to its owning session, with CPU, memory and filesystem each reported as a correct percentage of its own limit, and it keeps a record that answers who loaded the node after the fact.","ends":"","id":"S15","items":[{"done_when":"One pane shows every process of the lead's uid on the login and fleet nodes, grouped by owning session. CPU is a percentage of the slice quota with the throttled fraction beside it, memory a percentage of the slice limit, and filesystem a GPFS-blocked share with a stat-latency multiple. The orphan flag is raised only for a dead recorded owner, long-running background work is flagged, host kill acts only on listed pids, and a report over the sample record names the incident's owners.","slug":"host-dashboard-covers-every-agent-process","why_now":"The panel misreported the storage event as CPU saturation and hid every process that caused it, and the lead has asked for it to become the dashboard that watches agent runs."}],"starts":"","status":"open","summary":"","theme":"The lead can see every agent process and what it costs","type":"sprint","version":1}</script>
