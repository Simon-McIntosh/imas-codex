<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm" viewBox="0 0 3110 1600" font-family="DejaVu Sans, Helvetica, sans-serif">
  <!-- Axes: x is the recorded firings still firing (0-12), y the planted contradictions recalled (52-61). -->
