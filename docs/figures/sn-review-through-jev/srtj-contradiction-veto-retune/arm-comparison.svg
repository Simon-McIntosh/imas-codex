    <line x1="400" y1="1300" x2="2900" y2="1300"/>
  </g>
  <g stroke="#333" stroke-width="4">
    <line x1="400" y1="1300" x2="400" y2="1320"/>
    <line x1="817" y1="1300" x2="817" y2="1320"/>
    <line x1="1233" y1="1300" x2="1233" y2="1320"/>
    <line x1="1650" y1="1300" x2="1650" y2="1320"/>
    <line x1="2067" y1="1300" x2="2067" y2="1320"/>
    <line x1="2483" y1="1300" x2="2483" y2="1320"/>
    <line x1="2900" y1="1300" x2="2900" y2="1320"/>
    <line x1="400" y1="1300" x2="380" y2="1300"/>
    <line x1="400" y1="1056" x2="380" y2="1056"/>
    <line x1="400" y1="811" x2="380" y2="811"/>
    <line x1="400" y1="567" x2="380" y2="567"/>
    <line x1="400" y1="322" x2="380" y2="322"/>
  </g>
  <g font-size="43" fill="#333" text-anchor="middle">
    <text x="400" y="1385">0</text>
    <text x="817" y="1385">2</text>
    <text x="1233" y="1385">4</text>
    <text x="1650" y="1385">6</text>
    <text x="2067" y="1385">8</text>
    <text x="2483" y="1385">10</text>
    <text x="2900" y="1385">12</text>
  </g>
  <g font-size="43" fill="#333" text-anchor="end">
    <text x="360" y="1316">52</text>
    <text x="360" y="1072">54</text>
    <text x="360" y="827">56</text>
    <text x="360" y="583">58</text>
    <text x="360" y="338">60</text>
