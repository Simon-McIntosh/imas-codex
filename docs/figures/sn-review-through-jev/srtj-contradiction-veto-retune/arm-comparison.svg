  <text x="120" y="800" font-size="49" fill="#333" text-anchor="middle" transform="rotate(-90 120 800)">planted contradictions recalled [of 60]</text>
  <text x="1650" y="1490" font-size="49" fill="#333" text-anchor="middle">recorded firings still firing [of 46]</text>
  <!-- The two legs of the bar. -->
  <line x1="1025" y1="200" x2="1025" y2="1300" stroke="#8a8a8a" stroke-width="4" stroke-dasharray="14 10"/>
  <line x1="400" y1="322" x2="2900" y2="322" stroke="#8a8a8a" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="2483" cy="322" r="30" fill="#2f6f9f"/>
  <circle cx="1025" cy="444" r="26" fill="#929292"/>
  <text x="2430" y="410" font-size="43" fill="#2f6f9f" text-anchor="end">A — predicate only, shipped</text>
  <text x="1060" y="530" font-size="43" fill="#6f6f6f">B — predicate and settlement</text>
