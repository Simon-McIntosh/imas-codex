<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     role="img"
     aria-label="Flow diagram decomposing the 91 inadmissible rows into 65 test-fixture identities and 26 rule-driven refusals, and the 26 further into 3 whose failing condition is read from the parent identity and 23 whose is read from the row's own node"
     style="max-width:100%;font:12px/1.4 system-ui,sans-serif" fill="currentColor">
  <title>Adjudication of the 91 inadmissible extracted-unbound rows</title>
  <desc>Left: the 91 inadmissible rows. Middle: 65 test-fixture identities, decided by the row's
  own id and source_id with no admission rule involved, and 26 refusals a rule decided. Right:
  the 26 split by which entity the failing gate reads — 3 whose failing condition lives on the
  parent identity, which a parent repair would clear, and 23 whose lives on the row's own node,
  which no parent repair can clear.</desc>

  <!-- column 1: the whole set -->
  <text x="10" y="20" font-weight="700">91 inadmissible rows</text>
  <text x="10" y="36" font-family="ui-monospace,monospace" font-size="11">extracted-unbound cohort, 2026-09-17</text>
  <rect x="10" y="48" width="120" height="280" rx="3" fill="currentColor" fill-opacity="0.10"/>
  <text x="70" y="180" text-anchor="middle" font-size="22" font-weight="700">91</text>
  <text x="70" y="200" text-anchor="middle" font-size="11">inadmissible</text>

  <!-- column 2: the two halves -->
  <rect x="180" y="48" width="250" height="150" rx="3" fill="currentColor" fill-opacity="0.10"/>
  <text x="192" y="70" font-weight="700">65 test-fixture identities</text>
  <text x="192" y="90" font-size="11">no admission rule decided these</text>
  <text x="192" y="108" font-size="11">id begins with the declared prefix</text>
  <text x="192" y="124" font-size="11"><tspan font-family="ui-monospace,monospace">dd:test_review_entry__</tspan> (64)</text>
  <text x="192" y="140" font-size="11">or is the revision-relative literal</text>
  <text x="192" y="156" font-size="11"><tspan font-family="ui-monospace,monospace">dd:__revreltest__/leaf1</tspan> (1)</text>
  <text x="192" y="180" font-size="11" font-style="italic">every one resolves to no IMASNode</text>

  <rect x="180" y="208" width="250" height="120" rx="3" fill="currentColor" fill-opacity="0.10"/>
  <text x="192" y="230" font-weight="700">26 rule-driven refusals</text>
  <text x="192" y="250" font-size="11">18 node_category_ineligible</text>
  <text x="192" y="266" font-size="11">3 container_node_no_signal_signature</text>
  <text x="192" y="282" font-size="11">3 derived_parent_inadmissible</text>
  <text x="192" y="298" font-size="11">1 dd_lifecycle_removed &#183; 1 duplicate_ids</text>
  <text x="192" y="318" font-size="11" font-style="italic">a rule actually decided these</text>

  <!-- column 3: the 26 split by who owns the failing condition -->
  <text x="500" y="20" font-weight="700">the 26, by what owns the refusal</text>
  <rect x="500" y="208" width="360" height="62" rx="3" fill="currentColor" fill-opacity="0.55"/>
  <text x="512" y="230" font-weight="700">3 parent-owned</text>
  <text x="512" y="248" font-size="11">a repair to the parent identity returns them</text>
  <text x="512" y="262" font-size="11">power_density &#183; wavelength &#183; root_mean_square_of_&#8230;</text>

  <rect x="500" y="276" width="360" height="52" rx="3" fill="currentColor" fill-opacity="0.22"/>
  <text x="512" y="298" font-weight="700">23 row-owned</text>
  <text x="512" y="316" font-size="11">the gate reads the row's own node; no parent repair returns them</text>

  <!-- arrows -->
  <path d="M130 120 H180" stroke="currentColor" stroke-width="1" fill="none"/>
  <path d="M130 260 H180" stroke="currentColor" stroke-width="1" fill="none"/>
  <path d="M430 232 H500" stroke="currentColor" stroke-width="1" fill="none"/>
  <path d="M430 270 H500" stroke="currentColor" stroke-width="1" fill="none"/>
</svg>