<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="system-ui, DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- facility-side stages: thin grey border -->
  <rect x="20" y="20" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="105" y="39" text-anchor="middle" font-size="14" font-weight="bold">paths</text>
  <text x="105" y="57" text-anchor="middle">SSH scan · LLM score</text>

  <rect x="230" y="20" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="315" y="39" text-anchor="middle" font-size="14" font-weight="bold">code</text>
  <text x="315" y="57" text-anchor="middle">SSH · LLM</text>

  <rect x="230" y="84" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="315" y="103" text-anchor="middle" font-size="14" font-weight="bold">documents</text>
  <text x="315" y="121" text-anchor="middle">SSH · VLM</text>

  <rect x="20" y="150" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="105" y="169" text-anchor="middle" font-size="14" font-weight="bold">wiki</text>
  <text x="105" y="187" text-anchor="middle">tunnel · LLM</text>

  <rect x="20" y="250" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="105" y="269" text-anchor="middle" font-size="14" font-weight="bold">signals scan</text>
  <text x="105" y="287" text-anchor="middle">SSH</text>

  <rect x="440" y="170" width="170" height="46" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="525" y="189" text-anchor="middle" font-size="14" font-weight="bold">signals check</text>
  <text x="525" y="207" text-anchor="middle">SSH</text>

  <!-- graph-only stages: accent border -->
  <rect x="230" y="250" width="170" height="46" rx="5" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="315" y="269" text-anchor="middle" font-size="14" font-weight="bold">signals enrich</text>
  <text x="315" y="287" text-anchor="middle" fill="#2f6f9f">graph · LLM</text>

  <rect x="440" y="262" width="170" height="46" rx="5" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="525" y="281" text-anchor="middle" font-size="14" font-weight="bold">discover map</text>
  <text x="525" y="299" text-anchor="middle" fill="#2f6f9f">graph · Jev</text>

  <rect x="650" y="262" width="170" height="46" rx="5" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="735" y="281" text-anchor="middle" font-size="14" font-weight="bold">imas map run</text>
  <text x="735" y="299" text-anchor="middle" fill="#2f6f9f">graph · reasoning LLM</text>

  <!-- data flow -->
  <line x1="190" y1="43" x2="228" y2="43" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="190" y1="50" x2="228" y2="100" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="190" y1="273" x2="228" y2="273" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="400" y1="265" x2="438" y2="205" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="400" y1="278" x2="438" y2="284" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="610" y1="285" x2="648" y2="285" stroke="#444444" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- enrichment context, read when present -->
  <path d="M 400 36 L 420 36 L 420 236 L 372 248" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="190" y1="185" x2="268" y2="248" stroke="#777777" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="262" y="226" fill="#555555">context, if present</text>
</svg>
