    <text x="1194" y="226" fill="#3a6ea5">0.5303</text>

    <text x="290" y="280" text-anchor="end" fill="#333">rerank, module pass 1</text>
    <rect x="300" y="263" width="891" height="34" fill="#3a6ea5"/>
    <text x="1201" y="286" fill="#3a6ea5">0.5345</text>
