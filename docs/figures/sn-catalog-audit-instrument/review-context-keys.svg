<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Helvetica,Arial,sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#111">Every key the review pipeline builds, and whether a rendered prompt reads it</text>
  <text x="24" y="56" font-size="12.5" fill="#555">The pipeline sets seven keys on the render context (pipeline.py:1956-1968). A key reaches the reviewer only if a template names it. Six do; audit_findings does not.</text>

  <defs>
    <marker id="a-read" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6 z" fill="#2e7d32"/>
    </marker>
    <marker id="a-dead" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- left: producer -->
  <rect x="24" y="80" width="300" height="470" rx="6" fill="#f7f9fc" stroke="#546e7a"/>
  <text x="40" y="106" font-size="14" font-weight="bold" fill="#263238">build_batch_prompt builds the context</text>
  <text x="40" y="126" font-size="11.5" fill="#555">review/pipeline.py:1956-1968</text>

  <g font-size="12">
    <rect x="40" y="140" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="159" fill="#333">items (the cohort)</text>

    <rect x="40" y="178" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="197" fill="#333">existing_names  (catalog roster)</text>
    <text x="292" y="197" fill="#777" font-size="10.5">:958</text>

    <rect x="40" y="216" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="235" fill="#333">nearby_existing_names</text>
    <text x="292" y="235" fill="#777" font-size="10.5">:532</text>

    <rect x="40" y="254" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="273" fill="#333">review_scored_examples</text>

    <rect x="40" y="292" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="311" fill="#333">batch_context</text>

    <rect x="40" y="330" width="268" height="30" rx="4" fill="#fff" stroke="#999"/>
    <text x="52" y="349" fill="#333">prior_reviews / grammar_enums</text>

    <rect x="40" y="376" width="268" height="46" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
    <text x="52" y="396" fill="#b71c1c" font-weight="bold">audit_findings</text>
    <text x="52" y="413" fill="#c62828" font-size="10.5">set at :1964 from the Layer 1 report</text>
    <text x="292" y="396" fill="#777" font-size="10.5">:1964</text>
  </g>

  <!-- right: consumer -->
  <rect x="676" y="80" width="300" height="180" rx="6" fill="#f4faf4" stroke="#2e7d32"/>
  <text x="692" y="106" font-size="14" font-weight="bold" fill="#1b5e20">template sn/review_names</text>
  <text x="692" y="126" font-size="11.5" fill="#555">prompts/sn/review_names.md</text>
  <text x="692" y="152" font-size="11.5" fill="#333">roster block reads existing_names (:278)</text>
  <text x="692" y="172" font-size="11.5" fill="#333">nearby block reads nearby_existing_names (:266)</text>
  <text x="692" y="200" font-size="11.5" fill="#c62828">reads no audit_findings</text>
  <text x="692" y="228" font-size="11.5" fill="#555">rendered length 32249</text>

  <rect x="676" y="276" width="300" height="180" rx="6" fill="#f4faf4" stroke="#2e7d32"/>
  <text x="692" y="302" font-size="14" font-weight="bold" fill="#1b5e20">template sn/review_docs</text>
  <text x="692" y="322" font-size="11.5" fill="#555">prompts/sn/review_docs.md</text>
  <text x="692" y="348" font-size="11.5" fill="#333">roster block reads existing_names (:123)</text>
  <text x="692" y="368" font-size="11.5" fill="#333">nearby block reads nearby_existing_names (:114)</text>
  <text x="692" y="396" font-size="11.5" fill="#c62828">reads no audit_findings</text>
  <text x="692" y="424" font-size="11.5" fill="#555">rendered length 6869</text>

  <!-- edges: read keys -->
  <g stroke="#2e7d32" stroke-width="1.6" fill="none" marker-end="url(#a-read)">
    <path d="M308 155 C 480 155, 500 160, 674 162"/>
    <path d="M308 193 C 470 193, 490 340, 674 352"/>
    <path d="M308 231 C 460 231, 480 356, 674 366"/>
    <path d="M308 269 C 450 269, 470 372, 674 376"/>
    <path d="M308 307 C 440 307, 460 386, 674 386"/>
    <path d="M308 345 C 430 345, 450 400, 674 396"/>
  </g>
  <text x="470" y="150" font-size="11" fill="#2e7d32">read → rendered</text>

  <!-- edge: audit_findings dead ends -->
  <g stroke="#c62828" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a-dead)">
    <path d="M308 399 C 430 399, 450 470, 560 470"/>
  </g>
  <rect x="470" y="448" width="230" height="44" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
  <text x="482" y="467" font-size="12" font-weight="bold" fill="#b71c1c">no template names it</text>
  <text x="482" y="484" font-size="11" fill="#c62828">the value is built and discarded</text>

  <!-- probe box -->
  <rect x="24" y="516" width="952" height="66" rx="6" fill="#fffdf5" stroke="#f9a825"/>
  <text x="40" y="538" font-size="12" font-weight="bold" fill="#7a5b00">Render probe — the same call, markers injected into three keys (the positive controls prove the probe is not blind):</text>
  <text x="40" y="558" font-size="12" font-family="monospace" fill="#333">sn/review_names len 32249 | roster True | nearby True | audit False</text>
  <text x="40" y="574" font-size="12" font-family="monospace" fill="#333">sn/review_docs  len  6869 | roster True | nearby True | audit False</text>
</svg>