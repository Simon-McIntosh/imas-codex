<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="31.1cm" height="9.33cm" font-family="system-ui, sans-serif" font-size="15">
  <rect width="1400" height="420" fill="#ffffff"/>
  <g fill="none" stroke="#555555" stroke-width="1.2">
    <rect x="20" y="150" width="190" height="120"/>
    <rect x="270" y="150" width="210" height="120"/>
    <rect x="540" y="150" width="210" height="120"/>
    <rect x="810" y="150" width="210" height="120"/>
    <rect x="1080" y="150" width="300" height="120"/>
    <rect x="270" y="20" width="210" height="80" stroke="#1f77a8"/>
  </g>
  <g fill="none" stroke="#555555" stroke-width="1.2">
    <path d="M210 210 H262"/><path d="M256 204 L266 210 L256 216"/>
    <path d="M480 210 H532"/><path d="M526 204 L536 210 L526 216"/>
    <path d="M750 210 H802"/><path d="M796 204 L806 210 L796 216"/>
    <path d="M1020 210 H1072"/><path d="M1066 204 L1076 210 L1066 216"/>
  </g>
  <g fill="none" stroke="#1f77a8" stroke-width="1.2">
    <path d="M375 100 V142"/><path d="M369 136 L375 146 L381 136"/>
  </g>
  <g fill="#1a1a1a">
    <text x="115" y="185" text-anchor="middle" font-size="16" font-weight="600">Catalogue</text>
    <text x="115" y="210" text-anchor="middle">every archive variable</text>
    <text x="115" y="232" text-anchor="middle">with its metadata state</text>
    <text x="115" y="254" text-anchor="middle" fill="#666666">exists today</text>

    <text x="375" y="185" text-anchor="middle" font-size="16" font-weight="600">Context</text>
    <text x="375" y="210" text-anchor="middle">labels, units and limits,</text>
    <text x="375" y="232" text-anchor="middle">signal lists, component</text>
    <text x="375" y="254" text-anchor="middle">and specification links</text>

    <text x="645" y="185" text-anchor="middle" font-size="16" font-weight="600">Group</text>
    <text x="645" y="210" text-anchor="middle">by component and by</text>
    <text x="645" y="232" text-anchor="middle">repeated field pattern</text>

    <text x="915" y="185" text-anchor="middle" font-size="16" font-weight="600">Enrich</text>
    <text x="915" y="210" text-anchor="middle">one description per</text>
    <text x="915" y="232" text-anchor="middle">group, members filled</text>
    <text x="915" y="254" text-anchor="middle">by template</text>

    <text x="1230" y="185" text-anchor="middle" font-size="16" font-weight="600">Check, embed, search</text>
    <text x="1230" y="210" text-anchor="middle">bounded read confirms a signal,</text>
    <text x="1230" y="232" text-anchor="middle">search and the read tool find it</text>
    <text x="1230" y="254" text-anchor="middle" fill="#666666">existing pipeline stages</text>

    <text x="375" y="52" text-anchor="middle" font-size="16" font-weight="600" fill="#1f77a8">ICP and IDM</text>
    <text x="375" y="76" text-anchor="middle" fill="#1f77a8">read inside ITER only</text>
  </g>
  <g fill="#666666" font-size="14">
    <text x="20" y="330">Everything written to the graph carries the ITER facility and is covered by the facility-scoped protected backup.</text>
    <text x="20" y="354">Blue marks content that never enters the repository or a prompt to an external provider.</text>
  </g>
</svg>
