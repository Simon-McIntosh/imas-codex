<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Pre-WEST Standard Names delivery sequence</title>
  <desc id="desc">Typed context, local DD resolutions, and ISN geometry grammar feed semantic pipeline hardening. Benchmarking and the hardened pipeline feed graph and evidence recovery. Typed CLI consolidation follows, then WEST expert review and catalog release.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:2;rx:10}
      .gate{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}
      .recover{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:10}
      .west{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}
      .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .label{font:600 16px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#334155;text-anchor:middle}
      .wave{font:700 14px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <text class="wave" x="20" y="38">FOUNDATIONS</text>
  <rect class="box" x="40" y="58" width="300" height="82"/>
  <text class="label" x="190" y="88">Typed LLM context</text>
  <text class="small" x="190" y="112">all active call sites; authority roles</text>
  <rect class="box" x="430" y="58" width="300" height="82"/>
  <text class="label" x="580" y="88">Local DD resolutions</text>
  <text class="small" x="580" y="112">exact, versioned, graph-traceable</text>
  <rect class="box" x="820" y="58" width="300" height="82"/>
  <text class="label" x="970" y="88">ISN plane + arc grammar</text>
  <text class="small" x="970" y="112">closed vocab; strict round trips</text>

  <text class="wave" x="20" y="205">PREVENTION</text>
  <rect class="gate" x="330" y="175" width="500" height="92"/>
  <text class="label" x="580" y="208">Semantic pipeline hardening</text>
  <text class="small" x="580" y="232">role + carrier + representation + frame + plane</text>
  <text class="small" x="580" y="251">claim, admission, grouping and attachment gates</text>
  <path class="line" d="M190 140 L430 190"/>
  <path class="line" d="M580 140 L580 175"/>
  <path class="line" d="M970 140 L730 190"/>

  <text class="wave" x="20" y="330">MEASURE + RECOVER</text>
  <rect class="recover" x="80" y="310" width="310" height="90"/>
  <text class="label" x="235" y="340">DSv4 advisory benchmark</text>
  <text class="small" x="235" y="365">frozen gold; full flag-only census</text>
  <rect class="recover" x="425" y="310" width="310" height="90"/>
  <text class="label" x="580" y="340">Exact semantic recovery</text>
  <text class="small" x="580" y="365">snapshot diff; selective source reset</text>
  <rect class="recover" x="770" y="310" width="310" height="90"/>
  <text class="label" x="925" y="340">Evidence recovery</text>
  <text class="small" x="925" y="365">proof backfill; bounded hosted rescore</text>
  <path class="line" d="M500 267 L270 310"/>
  <path class="line" d="M580 267 L580 310"/>
  <path class="line" d="M660 267 L890 310"/>
  <path class="line" d="M390 355 L425 355"/>

  <text class="wave" x="20" y="470">OPERATOR + WEST</text>
  <rect class="gate" x="100" y="450" width="300" height="75"/>
  <text class="label" x="250" y="480">Eight typed CLI intents</text>
  <text class="small" x="250" y="503">one manifest/apply/receipt contract</text>
  <rect class="west" x="460" y="450" width="270" height="75"/>
  <text class="label" x="595" y="480">WEST expert review</text>
  <text class="small" x="595" y="503">current graph; no protection</text>
  <rect class="west" x="790" y="450" width="270" height="75"/>
  <text class="label" x="925" y="480">Catalog release</text>
  <text class="small" x="925" y="503">fold-back + exact undo</text>
  <path class="line" d="M580 400 L330 450"/>
  <path class="line" d="M925 400 L340 450"/>
  <path class="line" d="M400 488 L460 488"/>
  <path class="line" d="M730 488 L790 488"/>
</svg>
