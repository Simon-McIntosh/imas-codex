<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">Bounded protected reconciliation</title>
  <desc id="desc">One aggregate graph read is partitioned offline. Protected, stale, open, and ambiguous rows remain non-actions. Only a signed exact manifest reaches dry-run, explicit apply, and one-query release census.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#506070"/>
    </marker>
    <style>
      .box { fill:#f7fafc; stroke:#506070; stroke-width:2; rx:12; }
      .safe { fill:#ecfdf5; stroke:#0a7; stroke-width:2; rx:12; }
      .hold { fill:#fff7ed; stroke:#c76a00; stroke-width:2; rx:12; }
      .title { font:700 17px system-ui,sans-serif; fill:#17202a; }
      .text { font:14px system-ui,sans-serif; fill:#334155; }
      .small { font:12px system-ui,sans-serif; fill:#475569; }
      .edge { stroke:#506070; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="24" y="112" width="180" height="112"/>
  <text class="title" x="114" y="144" text-anchor="middle">One graph query</text>
  <text class="text" x="114" y="171" text-anchor="middle">aggregate census</text>
  <text class="small" x="114" y="196" text-anchor="middle">no per-row retrieval</text>

  <path class="edge" d="M204 168 H258"/>
  <rect class="box" x="260" y="70" width="220" height="196"/>
  <text class="title" x="370" y="104" text-anchor="middle">Offline partition</text>
  <text class="text" x="282" y="136">protected</text>
  <text class="text" x="282" y="163">stale DD</text>
  <text class="text" x="282" y="190">open lifecycle</text>
  <text class="text" x="282" y="217">ambiguous</text>
  <text class="text" x="282" y="244">unsigned candidate</text>

  <path class="edge" d="M480 120 H534"/>
  <rect class="hold" x="536" y="42" width="218" height="124"/>
  <text class="title" x="645" y="75" text-anchor="middle">Visible non-actions</text>
  <text class="text" x="645" y="103" text-anchor="middle">preserved for ownership</text>
  <text class="small" x="645" y="130" text-anchor="middle">no inferred mutation authority</text>

  <path class="edge" d="M480 220 H534"/>
  <rect class="safe" x="536" y="194" width="218" height="124"/>
  <text class="title" x="645" y="227" text-anchor="middle">Signed exact manifest</text>
  <text class="text" x="645" y="255" text-anchor="middle">DD 4.1.1 · COCOS 17</text>
  <text class="small" x="645" y="282" text-anchor="middle">identities + expected state</text>

  <path class="edge" d="M754 256 H808"/>
  <rect class="safe" x="810" y="194" width="142" height="124"/>
  <text class="title" x="881" y="227" text-anchor="middle">Dry-run</text>
  <text class="text" x="881" y="255" text-anchor="middle">default</text>
  <text class="small" x="881" y="282" text-anchor="middle">zero writes</text>

  <path class="edge" d="M952 256 H1006"/>
  <rect class="safe" x="1008" y="178" width="128" height="156"/>
  <text class="title" x="1072" y="211" text-anchor="middle">Explicit apply</text>
  <text class="small" x="1072" y="238" text-anchor="middle">hash + authority</text>
  <text class="small" x="1072" y="264" text-anchor="middle">atomic receipt</text>
  <text class="small" x="1072" y="290" text-anchor="middle">one-query census</text>
</svg>
