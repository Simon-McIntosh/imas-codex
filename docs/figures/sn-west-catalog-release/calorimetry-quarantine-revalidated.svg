  <text x="378" y="160" font-family="monospace" font-size="12" fill="#334155">drain_validation_for_ids([sn_id])</text>
  <text x="378" y="182" font-family="monospace" font-size="12" fill="#334155">1. claim (validated_at IS NULL)</text>
  <text x="378" y="202" font-family="monospace" font-size="12" fill="#334155">2. validate_name_candidate (LLM-free)</text>
  <text x="378" y="222" font-family="monospace" font-size="12" fill="#334155">3. re-stamp status/issues/validated_at</text>
  <text x="378" y="250" font-family="monospace" font-size="12" fill="#475569">no direct validation_status write;</text>
  <text x="378" y="266" font-family="monospace" font-size="12" fill="#475569">a genuine defect re-quarantines</text>
  <line x1="314" y1="210" x2="356" y2="210" stroke="#dc2626" stroke-width="3"/>
  <polygon points="356,203 366,210 356,217" fill="#dc2626"/>
  <line x1="604" y1="200" x2="646" y2="200" stroke="#16a34a" stroke-width="3"/>
