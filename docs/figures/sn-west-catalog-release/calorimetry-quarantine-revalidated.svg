<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Calorimetry energy quarantine cleared by the sanctioned id-scoped revalidation drain</title>
  <desc id="desc">Before: validation_status=quarantined with validation_issues null, validated_at null, refine_stop_reason grammar_invalid. The sanctioned drain re-runs the deterministic admission gate and re-stamps. After: validation_status=valid, validation_issues empty, validated_at stamped 2026-09-15T06:27:09Z, scored name review 0.75 unchanged; name_stage=exhausted and docs_stage=pending remain the cut barriers.</desc>
