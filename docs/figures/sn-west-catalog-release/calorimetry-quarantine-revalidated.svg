  <text x="48" y="258" font-family="monospace" font-size="13" fill="#334155">name_stage:         exhausted</text>
  <text x="48" y="280" font-family="monospace" font-size="13" fill="#334155">docs_stage:         pending</text>
  <text x="48" y="302" font-family="monospace" font-size="13" fill="#334155">reviewer_score:     0.75</text>

  <rect x="360" y="110" width="240" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
