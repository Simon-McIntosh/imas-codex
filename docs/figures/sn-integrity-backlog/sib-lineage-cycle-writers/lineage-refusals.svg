<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm" viewBox="0 0 1400 720" role="img" aria-label="Two reciprocal lineage edges and a branch with two live tips are refused">
  <defs>
    <marker id="sib-lineage-cycle-writers-grey-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L10 5.5L0 11Z" fill="#929292"/></marker>
    <marker id="sib-lineage-cycle-writers-red-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L10 5.5L0 11Z" fill="#b42318"/></marker>
  </defs>
  <g font-family="sans-serif" font-size="23" fill="#242424" text-anchor="middle">
    <text x="225" y="95">fold onto ancestor</text>
    <text x="700" y="95">refine onto ancestor</text>
    <text x="1175" y="95">refine with live branch</text>
    <text x="225" y="255">old name · live</text>
    <text x="225" y="525">ancestor · superseded</text>
    <text x="700" y="255">old name · live</text>
    <text x="700" y="525">ancestor · pending</text>
    <text x="1070" y="255">existing tip · live</text>
    <text x="1290" y="255">new tip · live</text>
    <text x="1180" y="525">predecessor · live</text>
  </g>
  <g fill="none" stroke-width="3.5">
    <path d="M185 285V473" stroke="#929292" marker-end="url(#sib-lineage-cycle-writers-grey-arrow)"/>
    <path d="M265 473V285" stroke="#b42318" stroke-dasharray="10 8" marker-end="url(#sib-lineage-cycle-writers-red-arrow)"/>
    <path d="M660 285V473" stroke="#929292" marker-end="url(#sib-lineage-cycle-writers-grey-arrow)"/>
    <path d="M740 473V285" stroke="#b42318" stroke-dasharray="10 8" marker-end="url(#sib-lineage-cycle-writers-red-arrow)"/>
    <path d="M1085 285L1160 470" stroke="#929292" marker-end="url(#sib-lineage-cycle-writers-grey-arrow)"/>
    <path d="M1280 285L1200 470" stroke="#b42318" stroke-dasharray="10 8" marker-end="url(#sib-lineage-cycle-writers-red-arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="100" y="385" fill="#666">stored</text>
    <text x="360" y="385" fill="#b42318">refused</text>
    <text x="575" y="385" fill="#666">stored</text>
    <text x="835" y="385" fill="#b42318">refused</text>
    <text x="1060" y="385" fill="#666">stored</text>
    <text x="1300" y="385" fill="#b42318">refused</text>
  </g>
  <text x="700" y="650" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#555">REFINED_FROM points from successor to predecessor</text>
</svg>
