<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="sans-serif">
  <g fill="none" stroke="#444444" stroke-width="1.2">
    <line x1="300" y1="60" x2="1360" y2="60"/>
  </g>
  <g stroke="#444444" stroke-width="1.2">
    <line x1="300" y1="55" x2="300" y2="65"/>
    <line x1="489" y1="55" x2="489" y2="65"/>
    <line x1="678" y1="55" x2="678" y2="65"/>
    <line x1="867" y1="55" x2="867" y2="65"/>
    <line x1="1057" y1="55" x2="1057" y2="65"/>
    <line x1="1249" y1="55" x2="1249" y2="65"/>
  </g>
  <g font-size="20" fill="#444444" text-anchor="middle">
    <text x="300" y="42">0</text>
    <text x="489" y="42">100</text>
    <text x="678" y="42">200</text>
    <text x="867" y="42">300</text>
    <text x="1057" y="42">400</text>
    <text x="1249" y="42">500</text>
  </g>

  <g font-size="20" fill="#111111" text-anchor="end">
    <text x="288" y="120">census — no successor,</text>
    <text x="288" y="144">no refined-from</text>
  </g>
  <rect x="300" y="100" width="977" height="46" fill="#2b6cb0"/>
  <text x="1289" y="130" font-size="20" fill="#2b6cb0">517</text>

  <g font-size="20" fill="#111111" text-anchor="end">
    <text x="288" y="210">carries a supersession</text>
    <text x="288" y="234">event already</text>
  </g>
  <rect x="300" y="190" width="584" height="46" fill="#9aa5b1"/>
  <text x="896" y="220" font-size="20" fill="#5c6670">309</text>

  <g font-size="20" fill="#111111" text-anchor="end">
    <text x="288" y="300">no supersession event</text>
    <text x="288" y="324">in the change log</text>
  </g>
  <rect x="300" y="280" width="393" height="46" fill="#9aa5b1"/>
  <text x="705" y="310" font-size="20" fill="#5c6670">208</text>

  <g font-size="20" fill="#111111" text-anchor="end">
    <text x="288" y="390">no producing source —</text>
    <text x="288" y="414">retirement recorded here</text>
  </g>
  <rect x="300" y="370" width="346" height="46" fill="#2b6cb0"/>
  <text x="658" y="400" font-size="20" fill="#2b6cb0">183</text>

  <g font-size="20" fill="#111111" text-anchor="end">
    <text x="288" y="480">has a producing source —</text>
    <text x="288" y="504">kept for a successor</text>
  </g>
  <rect x="300" y="460" width="47" height="46" fill="#9aa5b1"/>
  <text x="359" y="490" font-size="20" fill="#5c6670">25</text>

  <text x="300" y="545" font-size="20" fill="#111111" text-anchor="start">standard names</text>
</svg>