<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="340" viewBox="0 0 1140 340" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- source -->
  <rect x="16" y="122" width="150" height="96" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="91" y="146" text-anchor="middle" font-weight="bold">SignalSource</text>
  <text x="91" y="164" text-anchor="middle">enriched group of</text>
  <text x="91" y="182" text-anchor="middle">facility signals</text>
  <text x="91" y="200" text-anchor="middle">JET: 2,288</text>

  <!-- retrieve -->
  <rect x="200" y="122" width="232" height="96" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="316" y="146" text-anchor="middle" font-weight="bold">Retrieve (code)</text>
  <text x="316" y="164" text-anchor="middle">hybrid_dd_search</text>
  <text x="316" y="182" text-anchor="middle">in the Jev-routed IDSs</text>
  <text x="316" y="200" text-anchor="middle">plus precedent</text>

  <!-- judge -->
  <rect x="466" y="122" width="212" height="96" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="572" y="146" text-anchor="middle" font-weight="bold" fill="#2f6f9f">Judge (Jev)</text>
  <text x="572" y="164" text-anchor="middle">IDS routing Choice</text>
  <text x="572" y="182" text-anchor="middle">same_quantity noul</text>
  <text x="572" y="200" text-anchor="middle">rerank, keep top 5</text>

  <!-- route -->
  <rect x="712" y="122" width="120" height="96" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="772" y="155" text-anchor="middle" font-weight="bold">Route (code)</text>
  <text x="772" y="175" text-anchor="middle">thresholds</text>
  <text x="772" y="193" text-anchor="middle">set by §3</text>

  <!-- outcomes -->
  <rect x="876" y="40" width="248" height="70" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="1000" y="62" text-anchor="middle" font-weight="bold">selected</text>
  <text x="1000" y="80" text-anchor="middle">MAPPING_CANDIDATE</text>
  <text x="1000" y="98" text-anchor="middle">off by default</text>

  <rect x="876" y="135" width="248" height="70" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="1000" y="157" text-anchor="middle" font-weight="bold">escalated</text>
  <text x="1000" y="175" text-anchor="middle">shortlist to the</text>
  <text x="1000" y="193" text-anchor="middle">reasoning model</text>

  <rect x="876" y="230" width="248" height="70" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <text x="1000" y="252" text-anchor="middle" font-weight="bold">no candidate</text>
  <text x="1000" y="270" text-anchor="middle">best path and its</text>
  <text x="1000" y="288" text-anchor="middle">probability kept</text>

  <!-- arrows -->
  <line x1="166" y1="170" x2="198" y2="170" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="432" y1="170" x2="464" y2="170" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="678" y1="170" x2="710" y2="170" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="832" y1="160" x2="874" y2="80" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="832" y1="170" x2="874" y2="170" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="832" y1="180" x2="874" y2="262" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="316" y="244" text-anchor="middle" fill="#444444">K = 20 per source</text>
  <text x="572" y="244" text-anchor="middle" fill="#444444">probabilities, not text</text>
  <text x="1000" y="326" text-anchor="middle" fill="#444444">selected and escalated feed imas map run</text>
</svg>
